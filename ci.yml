Error: Process completed with exit code 2.
##[debug]Finishing: Coordination import check
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conformance:
    name: Repository conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify CI startup (always visible)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "CI controller: GitHub Actions"
          echo "Execution: hosted ubuntu"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
          echo "STARTUP=PASS"

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]' || python -m pip install pytest ruff mypy

      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q sovereign || python -m compileall -q .

      - name: Ruff
        run: ruff check sovereign/ || ruff check .

      - name: Mypy
        run: mypy sovereign/

      - name: Pytest
        run: pytest -q
