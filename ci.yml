name: ci.yml

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conformance:
    name: Repository conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Verify CI startup (always visible)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "CI controller: GitHub Actions"
          echo "Execution: hosted ubuntu"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
          echo "STARTUP=PASS"

      - name: Set up Python
        shell: bash
        run: |
          set -Eeuo pipefail
          python --version
          python -m pip --version

      - name: Install project test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]' || python -m pip install pytest ruff mypy

      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q sovereign || python -m compileall -q .

      - name: Ruff
        shell: bash
        run: ruff check sovereign/ || ruff check .

      - name: Mypy
        shell: bash
        run: mypy sovereign/

      - name: Pytest
        shell: bash
        run: pytest -q
