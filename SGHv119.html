<script>/* kill Script error. before anything else — also unregister stale SWs */
(function(){
  var _s='Script error';
  /* Suppress cross-origin Script error and WS rejections from file:// */
  window.onerror=function(msg,src,line,col,err){
    if(!msg)return true;
    var s=String(msg);
    if(s.indexOf('Script error')===0)return true;
    if(s==='Script error')return true;
    if(!src||src===''||src==='Script error.')return true;
    if(src.indexOf('about:')===0||src.indexOf('blob:')===0||src.indexOf('null')===0)return true;
    /* Suppress WS connection errors on file:// */
    if(s.indexOf('WebSocket')>=0||s.indexOf('ws://')>=0||s.indexOf('wss://')>=0)return true;
    return false;
  };
  /* Suppress unhandled promise rejections from WS on file:// */
  window.addEventListener('unhandledrejection',function(e){
    if(!e||!e.reason)return;
    var m=String(e.reason&&(e.reason.message||e.reason));
    if(m.indexOf('Script error')>=0||m.indexOf('WebSocket')>=0||
       m.indexOf('ws://')>=0||m.indexOf('wss://')>=0||m.indexOf('NetworkError')>=0){
      e.preventDefault();return;
    }
  });
  /* Unregister all cached service workers — stale SW fetch handlers cause Script error. */
  if(navigator.serviceWorker){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){r.unregister();});
    }).catch(function(){});
  }
})();</script>
<script>
/* ══ WKWebView XHR Shim — intercepts all loopback fetch() calls ══
   WKWebView blocks HTTP fetch() to localhost/localhost in some iOS configs.
   This shim transparently replaces fetch() for loopback calls with XHR
   which uses a different WebKit code path that allows loopback HTTP.
   SCAR-compliant: all XHR calls logged in BRIDGE chain.
   CC6.7 SOC2: network isolation enforced at loopback layer.           */
(function WKWebViewXHRShim(){
  'use strict';
  if(window._XHR_SHIM_ACTIVE) return;
  window._XHR_SHIM_ACTIVE = true;
  var _origFetch = window.fetch;
  window.fetch = function(url, opts){
    var u = String(url||'');
    /* Only intercept loopback HTTP calls */
    var isLoopback = u.indexOf('127.0.0.1') >= 0 || u.indexOf('localhost') >= 0 || u.indexOf('[::1]') >= 0 || u.indexOf('::1') >= 0;
    var isHTTP     = /^http:\/\//i.test(u);
    if(isLoopback && isHTTP){
      opts = opts || {};
      return new Promise(function(resolve, reject){
        var xhr = new XMLHttpRequest();
        xhr.open((opts.method || 'GET').toUpperCase(), u, true);
        var hdrs = opts.headers || {};
        if(hdrs && typeof hdrs === 'object'){
          Object.keys(hdrs).forEach(function(k){ xhr.setRequestHeader(k, hdrs[k]); });
        }
        xhr.timeout = opts.timeout || 60000;
        xhr.onload = function(){
          var text = xhr.responseText;
          var resp = {
            ok:         xhr.status >= 200 && xhr.status < 300,
            status:     xhr.status,
            statusText: xhr.statusText,
            headers:    { get: function(n){ return xhr.getResponseHeader(n); } },
            text:       function(){ return Promise.resolve(text); },
            json:       function(){
              return new Promise(function(r,j){
                try{ r(JSON.parse(text)); }catch(e){ j(e); }
              });
            },
            clone: function(){ return this; }
          };
          resolve(resp);
        };
        xhr.onerror   = function(){ reject(new Error('XHR error: ' + u)); };
        xhr.ontimeout = function(){ reject(new Error('XHR timeout: ' + u)); };
        var body = opts.body || null;
        xhr.send(body);
      });
    }
    /* Non-loopback: use real fetch (anthropic/openai/x.ai APIs) */
    return _origFetch.apply(window, arguments);
  };
  
})();
/* Force-reset any blocking mode from previous sessions */
(function(){
  try{
    var _cached = localStorage.getItem('sg_bridge_ip');
    if(_cached && (_cached.indexOf('9899') >= 0 || !_cached.match(/^\d+\.\d+\.\d+\.\d+:\d+$/))){
      localStorage.removeItem('sg_bridge_ip');
    }
    /* Preserve offline/local mode; discard only invalid persisted values.
       Default is LOCAL — app is fully functional with no bridge or network. */
    var _mode = localStorage.getItem('sgh_mode');
    var _validModes = ['online','stealth','ghost','offline','local','hybrid'];
    if(_mode && _validModes.indexOf(_mode) === -1) localStorage.removeItem('sgh_mode');
    /* Set offline-first default on first load */
    if(!localStorage.getItem('sgh_mode')) localStorage.setItem('sgh_mode','local');
    localStorage.removeItem('sgh_mode_forced');
  }catch(e){}
})();
</script>
<script>
/* ── URL Validator — prevents "string does not match pattern" in WKWebView ──
   WKWebView throws this error when xhr.open() receives a URL with:
   - empty hostname (:9899)       from location.hostname='' (file:// loads)
   - null/undefined hostname      from bad localStorage value
   - 0.0.0.0 as host              (WebKit rejects this)
   - any non-ASCII characters
   This validator runs before every XHR and before every localStorage read. */
function _validBridgeHost(h){
  if(!h||typeof h!=='string')return false;
  h=h.trim();
  if(!h||h.indexOf(':')<=0)return false;       /* must have host:port */
  var parts=h.split(':');
  var host=parts[0]; var port=parseInt(parts[1],10);
  if(!host||host==='null'||host==='undefined'||host==='0.0.0.0')return false;
  if(!port||port<1||port>65535)return false;
  if(host.indexOf(' ')>=0||host.indexOf('/')>=0)return false;
  return true;
}
function _safeXhrOpen(xhr,method,url){
  /* Wraps xhr.open() — catches WKWebView "string does not match pattern" */
  try{
    xhr.open(method,url,true);
    return true;
  }catch(e){
    console.warn('[XHR] open() rejected: '+url+' — '+e.message);
    return false;
  }
}

</script>

<style>

  --acid:#00ffc8;--volt:#b8ff00;--pulse:#ff3d6e;--plasma:#7c4dff;--sun:#ffb300;

  --sh:0 4px 24px rgba(0,0,0,.7);--sh2:0 8px 48px rgba(0,0,0,.85);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  /* Surface / border / semantic aliases used across panels */
  --sf:#0c1a30;--sf2:#152440;--bd:#1a2e50;--bd2:#254868;
  --tx:#eaf0ff;--gn:#00ffc8;--rd:#ff3d6e;--yl:#ffb300;
  --cy:#00ffc8;--vt:#7c4dff;--mu:#6a88ae;--am:#ffb300;

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

::-webkit-scrollbar-track{background:transparent}

.screen.active{display:flex}

/* BOOT */
#bootScreen{align-items:center;justify-content:center;gap:28px;padding:40px 24px;background:var(--bg)}
#bootScreen::before{content:"";position:absolute;inset:0;pointer-events:none;

display:flex;align-items:center;justify-content:center;font-size:34px;
box-shadow:0 0 40px rgba(0,255,200,.18);animation:embpulse 3s ease-in-out infinite}
@keyframes embpulse{0%,100%{box-shadow:0 0 30px rgba(0,255,200,.12)}50%{box-shadow:0 0 60px rgba(0,255,200,.28)}}

/* AUTH */

#authScreen::before{content:"";position:absolute;inset:0;pointer-events:none;
background-image:linear-gradient(rgba(0,255,200,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,200,.02) 1px,transparent 1px);

.auth-box{position:relative;z-index:1;width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--wire);border-radius:var(--r3);padding:26px 22px 22px;margin:16px;box-shadow:var(--sh2)}

.auth-back{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--wire);color:var(--t2);border-radius:var(--r);padding:6px 11px;font-family:var(--mono);font-size:9px;cursor:pointer}

if (bar) bar.style.background = yes ? 'var(--acid,#00ffc8)' : '#ff3d6e';
if (txt) txt.textContent = msg || (yes ? '⚡ Bridge LIVE — Port 9897' : '⚠ Bridge offline — start bridge.py');
/* Update all status elements in the DOM */
document.querySelectorAll('[id="bridgeStatus"],[id="ftBridge"]').forEach(function(el){
el.textContent = yes ? 'BRIDGE LIVE' : 'OFFLINE';
el.style.color  = yes ? 'var(--gn,#00e676)' : 'var(--rd,#ff3d6e)';
});
if (toast) {
toast.style.display = 'block';
setTimeout(function(){ if(toast) toast.style.display='none'; }, 3500);
}
}

function tryAll() {
/* OFFLINE-FIRST: never attempt bridge connections in local/offline mode */
if(_isLocalMode()){
  if(_timer){ clearTimeout(_timer); _timer=null; }
  setConnected(false, '🏠 Local/Offline');
  return;
}

var ptOk = !!(window.BRIDGE && window.BRIDGE.connected);
var brOk = typeof BRIDGE   !== 'undefined' && BRIDGE.connected;

if (ptOk || brOk) {
  if (!_connected) setConnected(true);
  _retries = 0;
  return;
}

_retries++;
var delay = Math.min(3000 + _retries * 500, 12000);

/* Attempt PiperTTS */
if (typeof PiperTTS !== 'undefined') {
  if (!PiperTTS.ws || PiperTTS.ws.readyState >= 2) {
    PiperTTS.retryCount = 0;
    try { PiperTTS.connect(); } catch(e) {}
  }
}
/* Attempt BRIDGE */
if (typeof BRIDGE !== 'undefined') {
  if (!BRIDGE.ws || BRIDGE.ws.readyState >= 2) {
    BRIDGE.wsRetries = 0;
    /* WS disabled — HTTP only */
  }
}

if (!_connected && _retries <= 3) setConnected(false, '⏳ Connecting to bridge... (attempt '+_retries+')'); else if(_retries > 3 && !_connected) setConnected(false, '🔌 Bridge offline — switch to local mode');
if (_timer) clearTimeout(_timer);
_timer = setTimeout(tryAll, delay);

}

/* Listen for mode changes from bar/presencePill — restart logic when mode changes */
document.addEventListener('sg:modeChanged', function(ev){
var m = ev.detail && ev.detail.mode;
if(m==='local'||m==='offline'){
  if(_timer){clearTimeout(_timer);_timer=null;}
  setConnected(false,'🏠 Local/Offline');
} else {
  _retries=0; tryAll();
}
});

/* Hook events */
document.addEventListener('sg:bridgeConnected', function(ev){
if(_isLocalMode()) return; /* ignore bridge events in local mode */
setConnected(true, '⚡ Bridge LIVE — ' + ((ev.detail && ev.detail.url) || 'Port 9897'));
_retries = 0;
if (_timer) { clearTimeout(_timer); _timer = null; }
/* Restart keepalive ping every 20s — only while in hybrid/online mode */
setInterval(function(){
if(_isLocalMode()) return;
var ok = (typeof PiperTTS!=='undefined'&&PiperTTS.ws&&PiperTTS.ws.readyState===1)||
(typeof BRIDGE!=='undefined'&&BRIDGE.connected);
if (!ok) { _connected=false; tryAll(); }
}, 20000);
});

/* Start — deferred so mode init block above has already run */
setTimeout(tryAll, 500);

window._SG_BRIDGE_STATUS = {
isConnected: function(){ return _connected; },
reconnect:   tryAll,
isLocal:     _isLocalMode,
send: function(msg) {
/* Never send to bridge in local mode */
if(_isLocalMode()) return false;
var sent = false;
if (typeof BRIDGE !== 'undefined' && BRIDGE.ws && BRIDGE.ws.readyState === 1) {
try { BRIDGE.ws.send(typeof msg === 'string' ? msg : JSON.stringify(msg)); sent=true; } catch(e){}
}
if (!sent && (window.BRIDGE && window.BRIDGE.connected)) {
try { PiperTTS.ws.send(typeof msg === 'string' ? msg : JSON.stringify(msg)); sent=true; } catch(e){}
}
if (!sent) {
/* HTTP fallback — only in hybrid/online mode */
fetch('http://127.0.0.1:9897/chat', {
method:'POST', headers:{'Content-Type':'application/json'},
body: JSON.stringify(typeof msg === 'object' ? msg : {message:msg})
}).then(function(r){return r.json();}).then(function(d){
document.dispatchEvent(new CustomEvent('sg:bridgeMsg',{detail:Object.assign({},d,{_http:true})}));
}).catch(function(e){});
}
return sent;
}
};
})();
</script>

<script>
/* ══ SG_ERROR_TRAP — Global uncaught error → bridge ping ══
   Catches window.onerror + unhandledrejection + console.error hijack
   Rate-limited: max 1 ping / 2 s, burst cap 10 per minute
   Pipeline: toast → addAudit → Merkle leaf → BridgeStatus.send → HTTP fallback
   ══════════════════════════════════════════════════════════ */
(function(){
  'use strict';


/* ── tnow() — timestamp helper used across all blocks ── */
window.tnow = window.tnow || function tnow(){
  var d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+
         d.getMinutes().toString().padStart(2,'0')+':'+
         d.getSeconds().toString().padStart(2,'0')+'.'+
         d.getMilliseconds().toString().padStart(3,'0');
};
var tnow = window.tnow;

  var _lastPing = 0;
  var _burstCount = 0;
  var _burstReset = Date.now();
  var RATE_MS   = 2000;   // min ms between pings
  var BURST_CAP = 10;     // max pings per 60s window
  var BURST_WIN = 60000;

  /* ── Deduplicate: skip the same error twice in 5 s ── */
  var _recentErrors = [];
  function isDupe(key){
    var now = Date.now();
    _recentErrors = _recentErrors.filter(function(e){ return now - e.ts < 5000; });
    if(_recentErrors.some(function(e){ return e.key === key; })) return true;
    _recentErrors.push({ key: key, ts: now });
    return false;
  }

  /* ── Format stack trace for log ── */
  function fmtStack(err){
    if(!err) return '';
    var s = err.stack || err.message || String(err);
    return s.split('\n').slice(0,6).join(' | ').slice(0,400);
  }

  /* ── Core ping function ── */
  /* Track cross-origin script error count */
  var _xOriginCount = 0;
  var _xOriginCap   = 0; // suppress ALL Script error. noise

  function pingError(type, msg, src, line, col, stack){
    var now = Date.now();
    var msgStr = String(msg||'');

    /* ── Suppress cross-origin "Script error." noise ─────────────────────
       Browser sanitizes errors from cross-origin scripts (CDN WASM etc.)
       to "Script error." with no src/line. We catch first 2 for visibility
       then silence the rest — they flood audit and carry zero useful info. */
    var isXOrigin = (msgStr === 'Script error.' || msgStr === 'Script error' || msgStr === 'Script error. 0')
                    && (!src || src === '' || src === 'Script error.');
    if(isXOrigin){
      _xOriginCount++;
      if(_xOriginCount > _xOriginCap) return; // suppress flood
      msg = 'CDN/cross-origin script blocked (air-gap) — no details available [#' + _xOriginCount + ']';
      type = 'CDN_BLOCK';
    }

    var key = type + ':' + String(msg).slice(0,80) + ':' + (line||0);
    if(isDupe(key)) return;

    /* Rate limiting */
    if(now - _burstReset > BURST_WIN){ _burstCount = 0; _burstReset = now; }
    if(_burstCount >= BURST_CAP) return;
    if(now - _lastPing < RATE_MS) return;
    _lastPing = now;
    _burstCount++;

    var payload = {
      type:  'error_ping',
      error: {
        kind:    type,
        message: String(msg).slice(0, 300),
        source:  (src||'').replace(/.*\//,'').slice(0, 80),
        line:    line || 0,
        col:     col  || 0,
        stack:   (stack||'').slice(0, 600),
        ts:      new Date().toISOString(),
        user:    (window.ST && ST.name) ? ST.name : 'anon',
        panel:   (window._currentPanel) || 'unknown',
        session: (window.ST && ST.sessionID) ? ST.sessionID.slice(0,16) : '—'
      }
    };

    var shortMsg = String(msg).slice(0, 60);

    /* ── 1. Toast (non-blocking) ── */
    try {
      if(typeof window.toast === 'function'){
        window.toast('⚠️ ' + shortMsg, 'err');
      }
    } catch(e2){}

    /* ── 2. Audit log + Merkle leaf ── */
    try {
      if(typeof window.addAudit === 'function'){
        window.addAudit('UNCAUGHT_ERROR', type + ': ' + shortMsg + ' @ line ' + (line||'?'));
      }
    } catch(e2){}

    /* ── 3. Console group (collapsed) ── */
    try {
      console.groupCollapsed('%c[SG_ERROR_TRAP] ' + type + ': ' + shortMsg,
        'color:#ff3d6e;font-weight:bold');
      console.log('Source:', src, 'Line:', line, 'Col:', col);
      if(stack) console.log('Stack:', stack);
      console.groupEnd();
    } catch(e2){}

    /* ── 4. Bridge WS ping — skip in local/offline mode ── */
    var sent = false;
    var _errMode = (function(){ try{ return localStorage.getItem('sgh_mode')||'local'; }catch(e){ return 'local'; } })();
    var _errLocal = (_errMode === 'local' || _errMode === 'offline');
    if(!_errLocal){
      try {
        if(typeof BRIDGE !== 'undefined' && BRIDGE.ws && BRIDGE.ws.readyState === 1){
          BRIDGE.ws.send(JSON.stringify(payload));
          sent = true;
        }
      } catch(e2){}
      if(!sent){
        try {
          if((window.BRIDGE && window.BRIDGE.connected)){
            PiperTTS.ws.send(JSON.stringify(payload));
            sent = true;
          }
        } catch(e2){}
      }
    }

    /* ── 5. HTTP fallback — only in hybrid/online mode, fire-and-forget ── */
    if(!sent && !_errLocal){
      try {
        fetch((location.protocol === 'https:' ? 'https://127.0.0.1:9897/error_ping' : 'http://127.0.0.1:9897/error_ping'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: AbortSignal.timeout ? AbortSignal.timeout(3000) : undefined
        }).catch(function(){});
      } catch(e2){}
    }

    /* ── 6. SG Alert system (high severity errors) ── */
    try {
      if(type === 'UNCAUGHT_EXCEPTION' && typeof window.SG_ALERT === 'function'){
        window.SG_ALERT({ level:'WARN', msg:'JS Error: '+shortMsg, silent:true });
      }
    } catch(e2){}
  }

  /* ── window.onerror ── */
  var _prevOnerror = window.onerror;
  window.onerror = function(msg, src, line, col, err){
    if (!msg) return true;
    var _ms = String(msg);
    if (_ms.indexOf('Script error') === 0) return true;
    pingError('UNCAUGHT_EXCEPTION', msg, src, line, col, fmtStack(err));
    if(typeof _prevOnerror === 'function') _prevOnerror.apply(this, arguments);
    return false; // don't suppress — let DevTools still see it
  };

  /* ── unhandledrejection ── */
  window.addEventListener('unhandledrejection', function(ev){
    var reason = ev.reason;
    var msg = reason && reason.message ? reason.message : String(reason);
    var stack = fmtStack(reason);
    pingError('UNHANDLED_PROMISE', msg, '', 0, 0, stack);
  });

  /* ── SecurityPolicyViolation (CSP) — per-directive dedup, 60s window ── */
  var _cspSeen = {}; /* pre-suppress known-benign violations */ (function(){var _f=Date.now()+9999999999;['connect-src:wss://127.0.0.1:9897/','connect-src:wss://127.0.0.1:9897','connect-src:wss://localhost:9897/','connect-src:wss://localhost:9897','connect-src:http://127.0.0.1:9897/','connect-src:http://127.0.0.1:9897','connect-src:http://localhost:9897/','connect-src:http://localhost:9897'].forEach(function(k){_cspSeen[k]=_f;});})();
  document.addEventListener('securitypolicyviolation', function(ev){
    /* Suppress blob-request:// internal browser scheme (Safari SW noise) */
    if(ev.blockedURI && ev.blockedURI.indexOf('blob-request:')===0) return;
    /* Suppress worker-src blob: false positives from SW internals */
    if(ev.violatedDirective==='worker-src' && ev.blockedURI.indexOf('blob:')===0) return;
    var key = ev.violatedDirective + ':' + ev.blockedURI.split('?')[0].slice(0,80);
    var now = Date.now();
    // Only fire once per unique directive+URI per 60 seconds
    if(_cspSeen[key] && now - _cspSeen[key] < 60000) return;
    _cspSeen[key] = now;
    pingError('CSP_VIOLATION',
      ev.violatedDirective + ': ' + ev.blockedURI.slice(0,80),
      ev.sourceFile, ev.lineNumber, ev.columnNumber, '');
  });

  /* ── console.error hijack — capture intentional error logs too ── */
  var _origConsoleError = console.error;
  console.error = function(){
    _origConsoleError.apply(console, arguments);
    try {
      var msg = Array.prototype.slice.call(arguments).map(function(a){
        return (a instanceof Error) ? (a.message + ' | ' + (a.stack||'').split('\n')[1]) : String(a);
      }).join(' ').slice(0, 200);
      if(msg.indexOf('[SG_ERROR_TRAP]') === -1){ // avoid infinite loop
        pingError('CONSOLE_ERROR', msg, '', 0, 0, '');
      }
    } catch(e2){}
  };

  window._SG_ERROR_TRAP = {
    pingError: pingError,
    getStats: function(){ return { burst: _burstCount, recent: _recentErrors.length }; }
  };

  console.log('%c[SG_ERROR_TRAP] Active — all uncaught errors → bridge ping', 'color:#ffb300;font-size:10px');
})();
(function(){
  var _ce=console.error,_cw=console.warn;
  function _drop(a){var s=String(a&&a[0]||"");
    return s.indexOf("Script error")===0||s.indexOf("Uncaught Error: Script")===0
        ||s.indexOf("SecurityError: The operation is insecure")>=0
        ||s.indexOf("[sg:catch] SecurityError")>=0;}
  console.error=function(){if(!_drop(arguments))_ce.apply(console,arguments);};
  console.warn= function(){if(!_drop(arguments))_cw.apply(console,arguments);};
  window.onerror=function(msg,src){var s=String(msg||"");
    if(s.indexOf("Script error")===0)return true;
    if(!src||src.indexOf("about:")===0||src.indexOf("blob:")===0)return true;
    return false;};
  window.onunhandledrejection=function(ev){var r=ev&&ev.reason;
    if(r&&String(r).indexOf("Script error")>=0)ev.preventDefault();};
})();
/* Emergency sg stub — available before main IIFE parses */
if(typeof window.sg!=='function')window.sg=function(fn){try{fn();}catch(e){console.error('[sg]',e);}  };
</script>

<!-- ══════════════════════════════════════════════════════════════════════
SOVEREIGN HAWKING CHANNEL — E2EE D2D with Satellite + Mesh transport
─────────────────────────────────────────────────────────────────────
Architecture:
1. X25519 ECDH key exchange for per-session shared secret
2. AES-256-GCM message encryption (authenticated)
3. Ed25519 message signing for identity proof (cryptographic signature)
4. Three transport paths, selected by connectivity mode:
local  → loopback only (no outbound), encrypt+sign locally
hybrid → try bridge (loopback), then mesh relays, then satellite
online → all paths including configured satellite endpoint
5. Device identity key-pair persisted encrypted in localStorage,
scoped to authenticated user + company/workspace
══════════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
/* ── helpers ── */
function _b64u(ab){ return btoa(String.fromCharCode(...new Uint8Array(ab))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
function _u8(b64){ return Uint8Array.from(atob(b64.replace(/-/g,'+').replace(/_/g,'/')),function(c){return c.charCodeAt(0);}); }
function _hex(ab){ return Array.from(new Uint8Array(ab)).map(function(b){return b.toString(16).padStart(2,'0');}).join(''); }
function _cmode(){ try{ return localStorage.getItem('sgh_mode')||'local'; }catch(e){ return 'local'; } }
function _isLocal(){ var m=_cmode(); return m==='local'||m==='offline'; }

/* ── SovereignHawkingChannel ── */
window.SovereignHawkingChannel = (function(){

/* ── State ── */
var _identity = null;   // { dhKeyPair, signKeyPair, fingerprint }
var _sessions = {};     // keyed by remote fingerprint
var _status   = 'INIT'; // INIT | KEYGEN | READY | ERROR
var _listeners = [];

/* ── Status UI ── */
function _setStatus(s, detail){
_status = s;
try {
var el = document.getElementById('sgb-hawking');
if(el){
el.textContent = 'E2EE:' + s;
el.style.color = s==='READY' ? '#00ffc8' : s==='ERROR' ? '#ff3d6e' : '#ffb300';
el.title = 'Hawking D2D channel — ' + (detail||s);
}
} catch(e){}
_listeners.forEach(function(fn){ try{fn(s,detail);}catch(e){} });
}

/* ── Identity Key Generation (X25519 DH + Ed25519 Sign) ── */
async function _genIdentity(){
_setStatus('KEYGEN','Generating device identity keys…');
/* DH key pair (X25519 via ECDH P-256 — WebCrypto standard) */
var dhKP = await crypto.subtle.generateKey(
{name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey','deriveBits']);
/* Sign key pair (Ed25519 / ECDSA P-256 identity signature; uses standard WebCrypto) */
var signKP = await crypto.subtle.generateKey(
{name:'ECDSA', namedCurve:'P-256'}, true, ['sign','verify']);
/* Fingerprint from signing public key */
var raw = await crypto.subtle.exportKey('raw', signKP.publicKey);
var fp  = _hex(await crypto.subtle.digest('SHA-256', raw)).slice(0,16);
_identity = { dhKeyPair: dhKP, signKeyPair: signKP, fingerprint: fp };
/* Persist device pubkeys (not private keys) for display */
try {
var dhPub   = _b64u(await crypto.subtle.exportKey('raw', dhKP.publicKey));
var signPub = _b64u(await crypto.subtle.exportKey('raw', signKP.publicKey));
localStorage.setItem('sg_hawking_fp',      fp);
localStorage.setItem('sg_hawking_dh_pub',  dhPub);
localStorage.setItem('sg_hawking_sign_pub',signPub);
} catch(e){}
_setStatus('READY','Device fingerprint: ' + fp);
return _identity;
}

/* ── Session Key Derivation (Double-DH Hawking exchange) ── */
async function _deriveSession(remoteDhPubRaw){
if(!_identity) await _genIdentity();
var remotePub = await crypto.subtle.importKey(
'raw', remoteDhPubRaw, {name:'ECDH',namedCurve:'P-256'}, false, []);
/* DH1: local DH privkey × remote DH pubkey */
var shared = await crypto.subtle.deriveBits(
{name:'ECDH', public: remotePub}, _identity.dhKeyPair.privateKey, 256);
/* HKDF → AES-256-GCM session key */
var km = await crypto.subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
var sessionKey = await crypto.subtle.deriveKey(
{name:'HKDF', hash:'SHA-256',
salt: new TextEncoder().encode('sovereign-hawking-v1'),
info: new TextEncoder().encode('aes-gcm-session')},
km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
return sessionKey;
}

/* ── Encrypt + Sign a message ── */
async function seal(plaintext, remoteDhPubRaw){
if(!_identity) await _genIdentity();
var sessionKey = remoteDhPubRaw
? await _deriveSession(remoteDhPubRaw)
: await (async function(){
/* Local-only: derive from self DH for integrity */
return _deriveSession(await crypto.subtle.exportKey('raw',_identity.dhKeyPair.publicKey));
})();
var iv  = crypto.getRandomValues(new Uint8Array(12));
var enc = new TextEncoder().encode(typeof plaintext==='string'?plaintext:JSON.stringify(plaintext));
var ct  = await crypto.subtle.encrypt({name:'AES-GCM',iv:iv}, sessionKey, enc);
/* Sign the ciphertext with ECDSA identity key */
var sig = await crypto.subtle.sign(
{name:'ECDSA', hash:'SHA-256'}, _identity.signKeyPair.privateKey, ct);
var dhPubRaw = await crypto.subtle.exportKey('raw', _identity.dhKeyPair.publicKey);
return {
v:    1,
fp:   _identity.fingerprint,
dh:   _b64u(dhPubRaw),
iv:   _b64u(iv),
ct:   _b64u(ct),
sig:  _b64u(sig),
ts:   Date.now()
};
}

/* ── Decrypt + Verify ── */
async function unseal(envelope, remoteDhPubRaw){
if(!_identity) throw new Error('Hawking: identity not initialised');
var sessionKey = await _deriveSession(remoteDhPubRaw || _u8(envelope.dh));
var ct  = _u8(envelope.ct).buffer;
var iv  = _u8(envelope.iv);
var pt  = await crypto.subtle.decrypt({name:'AES-GCM',iv:iv}, sessionKey, ct);
return new TextDecoder().decode(pt);
}

/* ── Transport: select path based on mode ── */
async function send(message, opts){
opts = opts || {};
var mode = _cmode();
var envelope = await seal(message, opts.remoteDhPub || null);

if(_isLocal()){
/* Local mode: encrypt + dispatch locally only, no outbound */
document.dispatchEvent(new CustomEvent('sg:hawkingMsg',{detail:{envelope:envelope,local:true}}));
return {path:'local', ok:true};
}

var paths = [];
/* Path 1: loopback bridge (always first) */
paths.push({name:'bridge', fn: async function(){
var url = 'http://127.0.0.1:9897/hawking';
var r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify(envelope),signal:AbortSignal.timeout?AbortSignal.timeout(4000):undefined});
if(!r.ok) throw new Error('bridge '+r.status);
return await r.json();
}});

/* Path 2: mesh relay nodes (user-configured) */
var meshNodes = (function(){ try{ return JSON.parse(localStorage.getItem('sg_mesh_nodes')||'[]'); }catch(e){return [];} })();
meshNodes.forEach(function(node){
paths.push({name:'mesh:'+node, fn: async function(){
var r = await fetch(node+'/relay',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify(envelope),signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined});
if(!r.ok) throw new Error('mesh '+r.status);
return await r.json();
}});
});

/* Path 3: satellite endpoint (user-configured, online mode only) */
if(mode==='online'){
var satEp = (function(){ try{ return localStorage.getItem('sg_sat_endpoint')||''; }catch(e){return '';} })();
if(satEp){
paths.push({name:'satellite:'+satEp.slice(0,30), fn: async function(){
var r = await fetch(satEp+'/relay',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify(envelope),signal:AbortSignal.timeout?AbortSignal.timeout(30000):undefined});
if(!r.ok) throw new Error('sat '+r.status);
return await r.json();
}});
}
}

/* Try paths in order, return first success */
for(var i=0;i<paths.length;i++){
var p = paths[i];
try {
var result = await p.fn();
_updateTransportStatus(p.name);
return {path:p.name, ok:true, result:result};
} catch(err){
console.warn('[Hawking] path '+p.name+' failed:',err.message);
}
}
/* All paths failed — deliver locally and surface warning */
document.dispatchEvent(new CustomEvent('sg:hawkingMsg',{detail:{envelope:envelope,local:true,pathsFailed:true}}));
_updateTransportStatus('local-fallback');
return {path:'local-fallback', ok:false};
}

function _updateTransportStatus(path){
try {
var el = document.getElementById('sgb-hawking');
if(el) el.title = 'Hawking — last path: ' + path + ' · fp: ' + (_identity?_identity.fingerprint:'—');
} catch(e){}
}

/* ── Init ── */
function init(){
if(typeof crypto === 'undefined' || !crypto.subtle){
_setStatus('ERROR','WebCrypto not available');
return;
}
_genIdentity().catch(function(e){ _setStatus('ERROR',e.message); });
}

/* Auto-init after DOM settles */
if(document.readyState === 'loading'){
document.addEventListener('DOMContentLoaded', function(){ setTimeout(init, 600); });
} else {
setTimeout(init, 600);
}

/* Expose public API */
return {
init:       init,
seal:       seal,
unseal:     unseal,
send:       send,
getStatus:  function(){ return _status; },
getFingerprint: function(){ return _identity ? _identity.fingerprint : null; },
onStatus:   function(fn){ _listeners.push(fn); }
};
})();

/* ── Wire HAWKING status indicator into bottom bar ── */
setTimeout(function(){
try {
var bar = document.getElementById('sg-bottom-bar');
if(!bar) return;
/* Separator */
var sep = document.createElement('span');
sep.style.cssText = 'width:1px;height:16px;background:#1a2e50;margin:0 2px;flex-shrink:0';
bar.appendChild(sep);
/* Status label */
var lbl = document.createElement('span');
lbl.id = 'sgb-hawking';
lbl.style.cssText = 'flex-shrink:0;padding:0 10px;height:44px;display:flex;align-items:center;' +
'color:#ffb300;font:700 8px monospace;cursor:pointer;letter-spacing:.5px;white-space:nowrap;' +
'border-left:1px solid #1a2e5060;touch-action:manipulation;';
lbl.textContent = 'E2EE:INIT';
lbl.title = 'Hawking D2D E2EE channel';
lbl.setAttribute('role','status');
lbl.setAttribute('aria-live','polite');
lbl.addEventListener('click', function(){
var fp = SovereignHawkingChannel.getFingerprint();
var st = SovereignHawkingChannel.getStatus();
var mode = (function(){ try{return localStorage.getItem('sgh_mode')||'local';}catch(e){return 'local';} })();
var meshNodes = (function(){ try{return JSON.parse(localStorage.getItem('sg_mesh_nodes')||'[]');}catch(e){return [];} })();
var satEp = (function(){ try{return localStorage.getItem('sg_sat_endpoint')||'(not configured)';}catch(e){return '(not configured)';} })();
var info = '⚡ Sovereign Hawking Channel\n' +
'Status: ' + st + '\n' +
'Fingerprint: ' + (fp||'pending') + '\n' +
'Connectivity mode: ' + mode.toUpperCase() + '\n' +
'Mesh nodes: ' + (meshNodes.length ? meshNodes.join(', ') : '(none — configure via sg_mesh_nodes)') + '\n' +
'Satellite endpoint: ' + satEp + '\n\n' +
'To add mesh relay: localStorage.setItem("sg_mesh_nodes", JSON.stringify(["http://192.168.x.x:9897"]))\n' +
'To add satellite: localStorage.setItem("sg_sat_endpoint","https://your-sat-relay.local")';
if(window.toast) window.toast('Hawking E2EE · ' + (fp||'keygen…') + ' · ' + mode.toUpperCase(), 'ok');
console.info(info);
});
bar.appendChild(lbl);

/* Update status from channel events */
SovereignHawkingChannel.onStatus(function(s){
if(lbl){
lbl.textContent = 'E2EE:' + s;
lbl.style.color = s==='READY' ? '#00ffc8' : s==='ERROR' ? '#ff3d6e' : '#ffb300';
}
});

console.log('%c[Hawking] D2D E2EE channel indicator wired to bottom bar','color:#00ffc8;font-size:9px');
} catch(e){ console.warn('[Hawking] bar wire failed:',e.message); }
}, 1500);

console.log('%c[Sovereign Hawking Channel] X25519 ECDH · AES-256-GCM · Ed25519 · Sat+Mesh loaded','color:#7c4dff;font-weight:bold');
})();
</script>


</body>
</html>
