version: '3.9'

# Sovereignty AI Studio — production ingress
# Public application traffic enters through the owner-provided TLS certificate on 443.
# Backend services remain internal to the Docker network. Keycloak may remain on its
# separately approved administration port 8080; test-only ports are not published here.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereignty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sovereignty_db}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sovereignty}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sovereignty}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sovereignty_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SOVEREIGN_MODEL_PATH: ${SOVEREIGN_MODEL_PATH:-/models/sovereign.gguf}
      SOVEREIGN_ONNX_PATH: ${SOVEREIGN_ONNX_PATH:-/models/sovereign.onnx}
      SOVEREIGN_API_URL: http://node-bridge:9899/api/ai
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      LOG_DIR: /app/logs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  node-bridge:
    build: ./node-bridge
    restart: unless-stopped
    expose:
      - "9899"
    environment:
      NODE_BRIDGE_PORT: "9899"
      NODE_BRIDGE_HOST: "127.0.0.1"
      BACKEND_URL: http://backend:8002
      WEATHER_URL: http://backend:8002
      GATEWAY_URL: http://gateway:9001
      SOVEREIGN_API_URL: http://backend:8002/api/ai
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-30}
    depends_on:
      backend:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sovereignty_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-sovereignty}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: start-dev
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - keycloak

  judge_agent:
    build:
      context: .
      dockerfile: agents/judge_agent/Dockerfile
    restart: unless-stopped
    expose:
      - "9002"
    environment:
      JUDGE_METRICS_PORT: 9002
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  ai_router_agent:
    build:
      context: .
      dockerfile: agents/ai_router_agent/Dockerfile
    restart: unless-stopped
    expose:
      - "9004"
    environment:
      AI_ROUTER_PORT: 9004
      REDIS_URL: redis://redis:6379
    depends_on:
      - judge_agent
      - redis

  plugin_agent:
    build:
      context: .
      dockerfile: agents/plugin_agent/Dockerfile
    restart: unless-stopped
    expose:
      - "9005"
    environment:
      PLUGIN_AGENT_PORT: 9005
      REDIS_URL: redis://redis:6379
      PLUGIN_SDK_DIR: /app/plugin_sdk
    depends_on:
      - judge_agent
      - redis

  platform_agent:
    build:
      context: .
      dockerfile: agents/platform_agent/Dockerfile
    restart: unless-stopped
    expose:
      - "9006"
    environment:
      PLATFORM_AGENT_PORT: 9006
      REDIS_URL: redis://redis:6379
    depends_on:
      - judge_agent
      - redis

  voice_assist_agent:
    build:
      context: .
      dockerfile: agents/voice_assist_agent/Dockerfile
    restart: unless-stopped
    expose:
      - "9007"
    environment:
      VOICE_ASSIST_PORT: 9007
      REDIS_URL: redis://redis:6379
    depends_on:
      - judge_agent
      - redis

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    expose:
      - "9001"
    environment:
      GATEWAY_PORT: 9001
      REDIS_URL: redis://redis:6379
    depends_on:
      - judge_agent
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT:?Set TLS_CERT to the owner-approved certificate chain}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY:?Set TLS_KEY to the owner-approved private key}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - node-bridge
    profiles:
      - production

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
