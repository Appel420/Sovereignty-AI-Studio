version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Sovereignty AI Studio — Self-Hosted Docker Stack
# NO external SaaS. NO Ollama. NO third-party AI vendors.
# All AI routes through the sovereign bridge (port 9898).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereignty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-sovereignty_db}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sovereignty}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python Backend (FastAPI) ──────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sovereignty}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/${POSTGRES_DB:-sovereignty_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SOVEREIGN_MODEL_PATH: ${SOVEREIGN_MODEL_PATH:-/models/sovereign.gguf}
      SOVEREIGN_ONNX_PATH: ${SOVEREIGN_ONNX_PATH:-/models/sovereign.onnx}
      SOVEREIGN_API_URL: http://node-bridge:9898/api/ai
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:9898}
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
      - ${SOVEREIGN_MODEL_PATH:-/dev/null}:/models/sovereign.gguf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Node.js Sovereign Bridge (only external port: 9898) ───────────────────
  node-bridge:
    build: ./node-bridge
    restart: unless-stopped
    ports:
      - "9898:9898"
    environment:
      NODE_BRIDGE_PORT: "9898"
      BACKEND_URL: http://backend:8000
      SOVEREIGN_API_URL: http://backend:8000/api/ai
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-30}
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT:-/dev/null}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY:-/dev/null}:/etc/nginx/ssl/key.pem:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - node-bridge

volumes:
  db_data:
    driver: local
