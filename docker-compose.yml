version: '3.8'

services:
  # ── Data stores ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-creativeflow_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-creativeflow_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  # ── Node gateway / bridge (external entry point on port 9898) ─────────────
  node-bridge:
    build: ./node-bridge
    ports:
      - "9898:9898"
    environment:
      - BACKEND_URL=http://backend:8000
      - WEATHER_URL=http://backend:8001
      - GATEWAY_URL=http://gateway:9000
      - NODE_BRIDGE_PORT=9898
      - CORS_ORIGIN=http://localhost:9898
    depends_on:
      - backend
      - gateway

  # ── Multi-agent system ────────────────────────────────────────────────────
  judge_agent:
    build:
      context: .
      dockerfile: agents/judge_agent/Dockerfile
    expose:
      - "9001"
      - "8000"
    environment:
      - JUDGE_METRICS_PORT=8000
    depends_on:
      - redis

  ai_router_agent:
    build:
      context: .
      dockerfile: agents/ai_router_agent/Dockerfile
    expose:
      - "8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    depends_on:
      - judge_agent
      - redis

  plugin_agent:
    build:
      context: .
      dockerfile: agents/plugin_agent/Dockerfile
    expose:
      - "8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - PLUGIN_SDK_DIR=/app/plugin_sdk
    depends_on:
      - judge_agent
      - redis

  platform_agent:
    build:
      context: .
      dockerfile: agents/platform_agent/Dockerfile
    expose:
      - "8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_STREAM_ID=${YOUTUBE_STREAM_ID:-}
      - KICK_CHANNEL=${KICK_CHANNEL:-}
      - X_BEARER_TOKEN=${X_BEARER_TOKEN:-}
    depends_on:
      - judge_agent
      - redis

  voice_assist_agent:
    build:
      context: .
      dockerfile: agents/voice_assist_agent/Dockerfile
    expose:
      - "8004"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - judge_agent
      - redis

  # ── Python multi-agent gateway (internal port 9000) ───────────────────────
  # External traffic still enters through node-bridge on port 9898.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    expose:
      - "9000"
    environment:
      - GATEWAY_PORT=9000
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - PLUGIN_SDK_DIR=/app/plugin_sdk
    depends_on:
      - judge_agent
      - redis

volumes:
  postgres_data: