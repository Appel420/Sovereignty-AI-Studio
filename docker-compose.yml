version: '3.8'

services:
  backend:
    build: ./backend
    # Internal only - no external port exposure
    # Accessible via node-bridge on port 9898
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/creativeflow_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-sovereignty-one-secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOCAL_MODEL=${LOCAL_MODEL:-llama3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  node-bridge:
    build: ./node-bridge
    # ONLY external port - all traffic goes through 9898
    ports:
      - "9898:9898"
    environment:
      - BACKEND_URL=http://backend:8000
      - WEATHER_URL=http://backend:8001
      - NODE_BRIDGE_PORT=9898
      - CORS_ORIGIN=http://localhost:9898
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: creativeflow_db
    # Internal only - accessible via backend services
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    # Internal only - accessible via backend services
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-bridge
    profiles:
      - production

volumes:
  db_data:
  redis_data: