# Sovereignty AI Studio — Nginx Configuration
# All traffic proxied through node-bridge on 9898.

server {
    listen 9898;
    server_name _;

    # Static frontend
    root /usr/share/nginx/html;
    index index.html;

    # API / WebSocket traffic → node-bridge
    location /api/ {
        proxy_pass http://node-bridge:9898;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://node-bridge:9898;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Serve frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        proxy_pass http://node-bridge:9898/health;
    }
}
