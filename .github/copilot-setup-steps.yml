# ─────────────────────────────────────────────────────────────────────────────
# Copilot cloud-agent setup — air-gapped / offline-first CI guard
#
# This repository is designed for self-hosted, offline-only CI/CD and must NOT
# make outbound calls to the Copilot cloud runtime during automated runs.
#
# AIRGAP_MODE=1 (default, safe): the Copilot cloud agent is disabled.
#   The guard step below exits non-zero so the agent never starts, no external
#   quota is consumed, and the job fails with a clear diagnostic message.
#
# AIRGAP_MODE=0 (opt-in, requires active Copilot quota): cloud agent is
#   permitted. Override by setting AIRGAP_MODE=0 as a repository Actions
#   variable: Settings → Secrets and variables → Actions → Variables.
# ─────────────────────────────────────────────────────────────────────────────

steps:
  - name: Offline CI guard — Copilot cloud agent disabled in air-gapped mode
    env:
      # Pull from repository Actions variable; default to 1 (offline/air-gapped).
      AIRGAP_MODE: ${{ vars.AIRGAP_MODE || '1' }}
    run: |
      # ── Air-gapped / offline-first guard ─────────────────────────────────
      # AIRGAP_MODE=1: skip the cloud agent entirely.  Exiting non-zero here
      # prevents the agent from proceeding, so no Copilot quota is consumed
      # and no outbound network calls are made during automated CI runs.
      # ─────────────────────────────────────────────────────────────────────
      if [ "${AIRGAP_MODE}" = "1" ]; then
        echo "::notice title=Offline CI::AIRGAP_MODE=1 — Copilot cloud agent disabled."
        echo ""
        echo "This repository runs in air-gapped / offline-first mode."
        echo "The Copilot cloud agent is intentionally skipped to avoid"
        echo "external quota consumption and outbound network calls."
        echo ""
        echo "To enable the cloud agent set AIRGAP_MODE=0 in repository"
        echo "Actions variables: Settings > Secrets and variables > Actions > Variables."
        echo ""
        echo "Exiting with a controlled failure — no cloud runtime was contacted."
        exit 1
      fi

      # ── Online mode: proceed with local environment setup ────────────────
      echo "::notice title=Online CI::AIRGAP_MODE=0 — Copilot cloud agent is permitted."
      echo "AIRGAP_MODE=0" >> "$GITHUB_ENV"
