# Dependabot version updates — visible, active coverage for all maintained
# package manifests and GitHub Actions workflows in this repository.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/backend"
      - "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/node-bridge"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/orchestrator"
      - "/crates/policy-engine"
      - "/crates/principal"
      - "/phase0"
      - "/resources/configs"
      - "/rust/pqcrypto-ffi"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "github-actions"
