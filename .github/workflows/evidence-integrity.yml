name: Evidence Integrity

on:
  pull_request:
  push:
    branches: [Collaboration]

permissions:
  contents: read

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f scripts/init_sovereignty_state.sh
          bash -n scripts/init_sovereignty_state.sh

      - name: Validate evidence gate source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f scripts/evidence_integrity_gate.py
          python3 -m py_compile scripts/evidence_integrity_gate.py
