name: CodeQL Scan

on: 
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, GPT/Codex-scar-ci-fix, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

permissions:
  contents: read

jobs:
  analyze:
    name: Local Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Verify runner
        run: |
          test "${RUNNER_OS}" = "ARM64"
      - name: Scan workflow action policy
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '(^|[[:space:]])uses:[[:space:]]*[^./[:space:]]+/[^[:space:]]+' .github/workflows --include='*.yml' --include='*.yaml'; then exit 1; fi
          echo 'Workflow action policy: PASS'
      - name: Scan for high-risk credential material
        shell: bash
        run: |
          set -Eeuo pipefail
          # Exclude vendor trees, docs, HTML dashboards, and tests that deliberately
          # contain PEM header string literals (not real private keys).
          if grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE KEY)|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,})' . \
            --include-dir=.git \
            --include-dir=.venv \
            --include-dir=node_modules \
            --exclude-dir=external \
            --include-dir=docs \
            --include-dir=tests \
            --include='*.html' \
            --include='*.md' \
            --include='*.json'; then
            exit 
          fi
          echo 'Credential exposure scan: PASS'
      - name: Compile first-party Python security surface
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do python -m py_compile "$f"; done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.git/**')
          echo 'First-party Python syntax/security preflight: PASS'
