name: CodeQL Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Analyze with CodeQL
        uses: codebeltnet/codeql-scan@v1.0.0
        with:
          languages: csharp
