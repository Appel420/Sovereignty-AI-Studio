name: CodeQL Scan

# Repository policy forbids actions outside Appel420-owned repositories.
# Keep this as a manual security gate without third-party GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Local Security Gate
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 20
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Scan workflow action policy
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '(^|[[:space:]])uses:[[:space:]]*[^./[:space:]]+/[^[:space:]]+' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'ERROR: external GitHub Action reference detected.'
            exit 1
          fi
          echo 'Workflow action policy: PASS'
      - name: Scan for high-risk credential material
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE KEY)|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,})' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules; then
            echo 'ERROR: probable credential/private-key material detected.'
            exit 1
          fi
          echo 'Credential exposure scan: PASS'
      - name: Compile Python security surface
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do python -m py_compile "$f"; done < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          echo 'Python syntax/security preflight: PASS'
