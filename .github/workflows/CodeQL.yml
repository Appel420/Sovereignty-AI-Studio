name: CodeQL Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Local Security Gate
    runs-on: 'self-hosted ubuntu-latest'
    timeout-minutes: 10
   steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Scan workflow action policy
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '(^|[[:space:]])uses:[[:space:]]*[^./[:space:]]+/[^[:space:]]+' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'ERROR: external GitHub Action reference detected.'
            exit 1
          fi
          echo 'Workflow action policy: PASS'
      - name: Scan for high-risk credential material
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE KEY)|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,})' . --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules; then
            echo 'ERROR: probable credential/private-key material detected.'
            exit 1
          fi
          echo 'Credential exposure scan: PASS'
      - name: Compile first-party Python security surface
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do
            python -m py_compile "$f"
          done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.git/**')
          echo 'First-party Python syntax/security preflight: PASS'
