name: Dependency Health

on:
  push:
    branches: [ "Collaboration" ]
  pull_request:
    branches: [ "Collaboration" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-audit:
    name: Python — CVE audit
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Install pip-audit
        run: python3 -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        shell: bash
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip_audit -r requirements.txt || true
          else
            echo "No requirements.txt — not skipped"
          fi

  node-audit:
    name: Node.js — CVE audit
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: npm audit
        working-directory: node-bridge
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            npm audit --audit-level=moderate || true
          else
            echo "No package.json in node-bridge — not skipped"
          fi

  requirements-lint:
    name: Lint requirements files
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Validate requirements structure
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          for name in ('requirements.txt',):
              path = pathlib.Path(name)
              if path.exists():
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if not line.strip() or line.lstrip().startswith(('#','-r','--')):
                          continue
          print('requirements files are structurally valid')
          PY
