name: Dependency Health

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  python-audit:
    name: Python — CVE audit (pip-audit)
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install pip-audit
        run: python3 -m pip install --user --upgrade pip pip-audit
      - name: Run pip-audit
        run: python3 -m pip_audit -r requirements.txt

  python-outdated:
    name: Python — requirements validation
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate requirements syntax
        run: python3 -m pip install --dry-run -r requirements.txt

  node-audit:
    name: Node.js — CVE audit (npm audit)
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install node-bridge dependencies
        working-directory: node-bridge
        run: npm ci
      - name: Run npm audit
        working-directory: node-bridge
        run: npm audit --audit-level=moderate

  requirements-lint:
    name: Lint requirements files
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 5
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate requirements files
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '\t' in line:
                      raise SystemExit(f'{name}:{number}: tab character is not allowed')
          print('requirements files are structurally valid')
          PY
