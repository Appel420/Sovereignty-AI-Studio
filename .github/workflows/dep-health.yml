name: Dependency Health

on:
  workflow_dispatch:
  branches: [Collaboration]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: dep-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-audit:
    name: Python — CVE audit (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip_audit -r requirements.txt

  python-outdated:
    name: Python — requirements validation (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          
      - run: python -m pip install --dry-run -r requirements.txt

  node-audit:
    name: Node.js — CVE audit (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - working-directory: node-bridge
        run: npm audit --audit-level=moderate

  requirements-lint:
    name: Lint requirements files (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          
          run: python - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if path.exists():
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1)
          print('requirements files are structurally valid')
          PY
