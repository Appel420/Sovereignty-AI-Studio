name: Dependency Health

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: dep-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-audit:
    name: Python — CVE audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        run: |
          if [[ -f requirements.txt ]]; then
            python -m pip_audit -r requirements.txt
          else
          
          fi

  python-outdated:
    name: Python — requirements validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Dry-run install
        run: |
          if [[ -f requirements.txt ]]; then
           else
           fi

  node-audit:
    name: Node.js — CVE audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: npm audit
        working-directory: node-bridge
        run: |
          if [[ -f package.json ]]; then
            npm audit --audit-level=moderate
          else
          fi

  requirements-lint:
    name: Lint requirements files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate requirements structure
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if path.exists():
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      pass
          print('requirements files are structurally valid')
          PY
