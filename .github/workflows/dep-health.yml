name: Dependency Health

on:
  workflow_dispatch:
  push:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  python-audit:
    name: Python — CVE audit (pip-audit)
    # This is a pure dependency check. Keep it on GitHub-hosted Linux so it
    # cannot consume the single ephemeral sovereign runner and leave the rest
    # of the PR checks queued.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        shell: bash
        run: |
          set -Eeuo pipefail
          report="pip-audit.json"
          set +e
          python -m pip_audit -r requirements.txt --format json --output "$report"
          audit_status=$?
          set -e
          python - "$report" "$audit_status" <<'PY'
          import json
          import sys

          report_path = sys.argv[1]
          audit_status = int(sys.argv[2])
          allowed = {"PYSEC-2026-1325"}

          with open(report_path, encoding="utf-8") as fh:
              data = json.load(fh)

          findings = []
          for dependency in data.get("dependencies", []):
              for vuln in dependency.get("vulns", []):
                  findings.append((
                      dependency.get("name", "unknown"),
                      dependency.get("version", "unknown"),
                      vuln.get("id", "unknown"),
                  ))

          unexpected = [finding for finding in findings if finding[2] not in allowed]
          if unexpected:
              print("Unexpected pip-audit findings:")
              for finding in unexpected:
                  print("  %s %s %s" % finding)
              raise SystemExit(1)

          tracked = [finding for finding in findings if finding[2] in allowed]
          if tracked:
              print("Tracked unresolved advisory (no upstream fixed release):")
              for finding in tracked:
                  print("  %s %s %s" % finding)

          # A non-zero audit status is acceptable only when every finding is
          # one of the explicitly tracked advisories above.
          if audit_status and not tracked:
              raise SystemExit(audit_status)
          print("pip-audit gate passed; no untracked vulnerabilities remain.")
          PY

  python-outdated:
    name: Python — requirements validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate requirements syntax
        run: python -m pip install --dry-run -r requirements.txt

  node-audit:
    name: Node.js — CVE audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json
      - name: Install node-bridge dependencies
        working-directory: node-bridge
        run: npm ci
      - name: Run npm audit
        working-directory: node-bridge
        run: npm audit --audit-level=moderate

  requirements-lint:
    name: Lint requirements files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate requirements files
        run: |
          python3 - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '\t' in line:
                      raise SystemExit(f'{name}:{number}: tab character is not allowed')
          print('requirements files are structurally valid')
          PY
