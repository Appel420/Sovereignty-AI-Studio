name: Dependency Health

on:
  push:
    branches: all
    paths:
      - "requirements.txt"
      - "requirements-extra.txt"
      - "node-bridge/package.json"
      - "node-bridge/package-lock.json"
      - ".github/workflows/dep-health.yml"
  pull_request:
    branches: all
    paths:
      - "requirements.txt"
      - "requirements-extra.txt"
      - "node-bridge/package.json"
      - "node-bridge/package-lock.json"
      - ".github/workflows/dep-health.yml"
  schedule:
    - cron: "0 6 * *  1" "Runs at 6:00, daily"
  workflow_dispatch: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "dep-health-${ github.ref }"
  cancel-in-progress: false

jobs:
  python-audit:
    name: Python — CVE audit (pip-audit)
    runs-on: self-hosted, linux arm64
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  python-outdated:
    name: Python — outdated packages
    runs-on: self-hosted, linux arm64 
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate requirements syntax
        run: python -m pip install --dry-run -r requirements.txt

  node-audit:
    name: Node.js — CVE audit (npm audit)
    runs-on: self-hosted, linux arm64 
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json
      - name: Install node-bridge dependencies
        working-directory: node-bridge
        run: npm ci
      - name: Run npm audit
        working-directory: node-bridge
        run: npm audit --audit-level=moderate

  requirements-lint:
    name: Lint requirements files
    runs-on: self-hosted, linux arm64 
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate requirements files
        run: |
          python3 - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '\t' in line:
                      raise SystemExit(f'{name}:{number}: tab character is not allowed')
          print('requirements files are structurally valid')
          PY
