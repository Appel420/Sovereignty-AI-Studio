name: Dependency Health

# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push, PR, and weekly schedule.
# Performs four checks in parallel:
#   1. pip-audit  – Python CVE scan (requirements.txt)
#   2. PyPI version check – outdated Python packages
#   3. npm-audit  – Node.js CVE scan (node-bridge)
#   4. Lint – requirements files syntax validation
# Any discovered vulnerabilities cause the workflow to fail and show a summary.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-extra.txt"
      - "node-bridge/package.json"
      - "node-bridge/package-lock.json"
      - ".github/workflows/dep-health.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-extra.txt"
      - "node-bridge/package.json"
      - "node-bridge/package-lock.json"
      - ".github/workflows/dep-health.yml"
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: dep-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python CVE audit ─────────────────────────────────────────────────────
  python-audit:
    name: Python — CVE audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install --quiet pip-audit

      - name: Run pip-audit on requirements.txt
        id: audit
        run: |
          set +e
          pip-audit -r requirements.txt > /tmp/audit-report.txt 2> /tmp/audit-error.txt
          status=$?
          echo "PIP_AUDIT_EXIT_CODE=$status" >> "$GITHUB_ENV"
          case "$status" in
            0)
              ;;
            1)
              echo "AUDIT_VULNS=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "AUDIT_ERROR=true" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Show audit report
        if: always()
        run: |
          echo "## pip-audit Report" >> "$GITHUB_STEP_SUMMARY"
          if [ "${AUDIT_ERROR:-}" = "true" ]; then
            echo "⚠️ pip-audit failed to run correctly (exit code ${PIP_AUDIT_EXIT_CODE:-unknown})." >> "$GITHUB_STEP_SUMMARY"
            if [ -f /tmp/audit-error.txt ] && [ -s /tmp/audit-error.txt ]; then
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/audit-error.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${AUDIT_VULNS:-}" = "true" ] && [ -f /tmp/audit-report.txt ] && [ -s /tmp/audit-report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/audit-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${AUDIT_VULNS:-}" = "true" ]; then
            echo "⚠️ pip-audit reported vulnerabilities, but no textual report was captured." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${PIP_AUDIT_EXIT_CODE:-}" = "0" ]; then
            echo "✅ No vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ pip-audit produced an unexpected result (exit code ${PIP_AUDIT_EXIT_CODE:-unknown})." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if vulnerabilities found
        if: env.AUDIT_VULNS == 'true'
        run: |
          echo "::error::pip-audit found vulnerabilities in requirements.txt — see step summary."
          exit 1

      - name: Fail on pip-audit execution/configuration errors
        if: env.AUDIT_ERROR == 'true'
        run: |
          echo "::error::pip-audit failed to run correctly (exit code $PIP_AUDIT_EXIT_CODE) — see step summary."
          exit 1

  # ── Python outdated check ─────────────────────────────────────────────────
  python-outdated:
    name: Python — outdated packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Non-blocking: outdated ≠ broken; report only
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check pinned versions against PyPI
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request

          pattern = re.compile(r"^([A-Za-z0-9_.-]+)(?:\[[^\]]+\])?\s*(==|>=|<=|!=|~=|>|<)\s*(.+)$")
          outdated = []

          with open("requirements.txt", encoding="utf-8") as handle:
              for raw_line in handle:
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  match = pattern.match(line)
                  if not match:
                      continue
                  package, operator, pinned = match.groups()
                  try:
                      with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json", timeout=10) as response:
                          latest = json.load(response)["info"]["version"]
                  except Exception:
                      continue
                  if latest != pinned:
                      outdated.append(f"{package}{operator}{pinned} -> {latest}")

          with open("/tmp/outdated.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(outdated))
          PY

      - name: Write outdated summary
        run: |
          echo "## Outdated Python Packages" >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/outdated.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/outdated.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ All pinned packages match the latest PyPI release." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Node.js CVE audit ────────────────────────────────────────────────────
  node-audit:
    name: Node.js — CVE audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: node-bridge/package-lock.json

      - name: Install node-bridge dependencies
        working-directory: node-bridge
        run: npm ci --prefer-offline

      - name: Run npm audit
        working-directory: node-bridge
        id: npm_audit
        run: |
          npm audit --audit-level=moderate --json > /tmp/npm-audit.json 2>&1 \
            && echo "NPM_AUDIT_CLEAN=true" >> "$GITHUB_ENV" \
            || echo "NPM_AUDIT_FAILED=true" >> "$GITHUB_ENV"

      - name: Show npm audit summary
        if: always()
        run: |
          echo "## npm audit (node-bridge)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/npm-audit.json ]; then
            node -e "
              const r = require('/tmp/npm-audit.json');
              const v = r.metadata && r.metadata.vulnerabilities || {};
              const total = Object.values(v).reduce((a,b)=>a+b,0);
              console.log(total === 0
                ? '✅ No vulnerabilities found.'
                : JSON.stringify(v, null, 2));
            " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || \
            echo "See job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if vulnerabilities found
        if: env.NPM_AUDIT_FAILED == 'true'
        run: |
          echo "::error::npm audit found vulnerabilities in node-bridge — see step summary."
          exit 1

  # ── Sanitize requirements syntax ─────────────────────────────────────────
  requirements-lint:
    name: Lint requirements files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate requirements.txt is parseable
        run: |
          python3 - <<'EOF'
          import re, sys

          files = ["requirements.txt", ".github/workflows/Requirements.txt"]
          errors = []
          for fname in files:
              try:
                  with open(fname) as f:
                      lines = f.readlines()
              except FileNotFoundError:
                  continue
              for i, line in enumerate(lines, 1):
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  # Must be a valid PEP 508 specifier or URL
                  if not re.match(
                      r'^[A-Za-z0-9_\-\.\[\]]+\s*(==|>=|<=|!=|~=|>|<)\s*[\w\.\-\*]+.*$',
                      stripped,
                  ) and not stripped.startswith("http") and not stripped.startswith("-r"):
                      errors.append(f"{fname}:{i}: suspicious line: {stripped!r}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          else:
              print("✅ requirements files look clean.")
          EOF

      - name: Dry-run install (no-deps, check only)
        run: |
          pip install --quiet --dry-run --no-deps -r requirements.txt 2>&1 | \
            grep -i "error\|warn" || true
          echo "✅ requirements.txt dry-run passed."
