name: Docker

on:
  push:
    branches: [Collaboration]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'diamond-core/**'
      - 'backend/**'
      - 'node-bridge/**'
      - 'agents/**'
      - 'gateway/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [Collaboration]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'diamond-core/**'
      - 'backend/**'
      - 'node-bridge/**'
      - 'agents/**'
      - 'gateway/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Docker build and contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify Docker
        run: docker version
      - name: Resolve Diamond Core lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile --manifest-path diamond-core/Cargo.toml
          test -s Cargo.lock
      - name: Diamond Core contract gate
        run: cargo test --manifest-path diamond-core/Cargo.toml --all-targets --locked
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
          JWT_SECRET: ci-compose-validation-only
          SECRET_KEY: ci-compose-validation-only
          KEYCLOAK_ADMIN_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet
      - name: Build image
        run: |
          set -Eeuo pipefail
          TAG="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --tag "$TAG" .
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "${GITHUB_ACTOR}" --password-stdin
          docker push "$IMAGE_TAG"
