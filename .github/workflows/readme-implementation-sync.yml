name: README Implementation Sync

on:
  workflow_dispatch:
    inputs:
      branch: ['**']
      description: 'Branch to sync README on (leave empty for current branch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ['self-hosted, linux arm64'] 
    steps:
      - name: Determine target branch
        id: target-branch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
            if [ -z "$BRANCH" ]; then BRANCH="${{ github.ref_name }}"; fi
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target-branch.outputs.branch }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Regenerate README implementation block
        run: python scripts/python/update_readme_implementation.py
      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet README.md; then
            echo "README already up to date. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update implementation status block"
          git push
