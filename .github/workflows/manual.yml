name: Manual workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet'
        default: 'World'
        required: true
        type: string

permissions:
  contents: read

jobs:
  greet:
    runs-on: self-hosted linux ARM64
    steps:
      - name: Send greeting
        run: echo "Hello ${{ inputs.name }}"
