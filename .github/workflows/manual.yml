name: Manual workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet'
        default: 'World'
        required: true
        type: string

jobs:
  greet:
    # Owner policy: self-hosted Linux ARM64 only. No GitHub-hosted runners.
    runs-on: ['self-hosted Linux arm64']

    steps:
    - name: Send greeting
      run: echo "Hello ${{ inputs.name }}"
