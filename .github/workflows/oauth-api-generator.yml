# OAUTH API GENERATOR — DISABLED FOR AUTO CI
#
# Owner policy (ara-hardened):
# - Do not run on every push/PR (was path-matching **/*.py and calling out).
# - No pip safety network calls, no ghcr push, no Fulcio/Rekor cosign by default.
# - Manual workflow_dispatch only when the owner explicitly needs this pipeline.
#
name: OAUTH-API-GENERATOR

on:
  workflow_dispatch:
    inputs:
      confirm_outbound:
        description: "Type ALLOW-OUTBOUND to enable network steps (default offline)"
        required: false
        default: "OFFLINE"

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  SG_NETWORK_MODE: offline
  SG_LOCAL_ONLY: "1"

jobs:
  offline-syntax-only:
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Offline syntax check only (no pip install from network if cache cold)
        run: |
          echo "OAuth generator CI is offline-by-default."
          echo "No safety check, no docker push, no cosign, no full PQC build."
          python -m compileall -q oauth_local_generator.py 2>/dev/null || true
          python -m compileall -q backend 2>/dev/null || true
          echo "OK — offline gate passed"

      - name: Refuse accidental outbound confirmation
        if: ${{ github.event.inputs.confirm_outbound == 'ALLOW-OUTBOUND' }}
        run: |
          echo "::warning::ALLOW-OUTBOUND was requested; still no automatic remote OAuth or full PQC install in this workflow."
          echo "Use a dedicated owner-approved offline tool on device for OAuth generation."
