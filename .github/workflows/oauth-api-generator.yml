# OAUTH API GENERATOR – CI/CD PIPELINE
# Visible, branch-independent validation for Sovereignty AI Studio.

name: OAUTH-API-GENERATOR

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

# Never cancel an already-running OAuth pipeline because another run arrived.
# Every triggered run must remain visible in Actions until it completes.
concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  # =========================================================
  # LINT + TEST (Python) — ALWAYS VISIBLE
  # =========================================================
  build-test:
    name: OAuth Python ${{ matrix.python }}
    runs-on: ['self-hosted, linux arm64']
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - name: Start OAuth pipeline
        run: |
          echo "=== OAUTH-API-GENERATOR START ==="
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "runner=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install flake8 safety

      - name: Lint with flake8
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        env:
          PYTHONPATH: .:./backend
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=term --strict-markers -x --tb=short

      - name: Dependency safety check
        run: |
          safety check -r .github/workflows/Requirements.txt --output text
          safety check -r requirements.txt --output text

  # =========================================================
  # NODE CHECK — ALWAYS VISIBLE
  # =========================================================
  node-check:
    name: OAuth Node validation
    runs-on: ['self-hosted, linux arm64']
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Start Node validation
        run: |
          echo "=== OAUTH NODE CHECK START ==="
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Node syntax check
        run: |
          npm run check
          node -c node-bridge/server.js

  # =========================================================
  # SECURITY SCANNING — ALWAYS VISIBLE
  # =========================================================
  security-scan:
    name: OAuth security scan
    needs: [build-test, node-check]
    if: ${{ always() }}
    runs-on: ['self-hosted, linux arm64']
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Report dependency status
        run: |
          echo "=== OAUTH SECURITY SCAN START ==="
          echo "build-test=${{ needs.build-test.result }}"
          echo "node-check=${{ needs.node-check.result }}"
          if [[ "${{ needs.build-test.result }}" != "success" || "${{ needs.node-check.result }}" != "success" ]]; then
            echo "::error::Upstream OAuth validation failed; security scan is still starting visibly."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: false
          exit-code: 1

      - name: OWASP dependency check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # =========================================================
  # DEPENDENCY REVIEW — ALWAYS VISIBLE ON PULL REQUESTS
  # =========================================================
  dependency-review:
    name: OAuth dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ['self-hosted, linux arm64']
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Start dependency review
        run: |
          echo "=== OAUTH DEPENDENCY REVIEW START ==="
          echo "base=${GITHUB_BASE_REF}"
          echo "head=${GITHUB_HEAD_REF}"

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # =========================================================
  # BUILD/SIGN — JOB ALWAYS APPEARS; PUBLISHING IS EXPLICIT
  # =========================================================
  build-sign:
    name: OAuth image build and publication
    needs: [build-test, node-check]
    if: ${{ always() }}
    runs-on: ['self-hosted, linux arm64']
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Start image workload
        run: |
          echo "=== OAUTH IMAGE WORKLOAD START ==="
          echo "build-test=${{ needs.build-test.result }}"
          echo "node-check=${{ needs.node-check.result }}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required release credentials
        if: ${{ github.event_name == 'release' }}
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1 }}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2 }}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3 }}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            else
              echo "Credential ${key}: present (value withheld)"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Set image name
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Prepare Docker tooling
        uses: docker/setup-buildx-action@v3

      - name: Build image (no publication on non-release/non-main refs)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}

      - name: Report publication mode
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" || ("${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main") ]]; then
            echo "Publication mode: enabled for this release/main execution."
          else
            echo "Publication mode: disabled for this validation execution."
            echo "The image workload still ran and remains visible in Actions."
          fi

      - name: Install cosign for publish-capable execution
        if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: sigstore/cosign-installer@v3

      - name: Sign published image
        if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${REGISTRY_LC}:${GITHUB_SHA}"
        env:
          COSIGN_EXPERIMENTAL: 1
