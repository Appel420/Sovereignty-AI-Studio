name: OAUTH-API-GENERATOR

on:
  workflow_dispatch:
    inputs:
      confirm_outbound:
        description: "Type ALLOW-OUTBOUND to explicitly enable outbound steps"
        required: true
        default: 
  push:
    branches: [collaboration]
    paths:
      - 'oauth_local_generator.py'
      - 'backend/**'
      - '.github/workflows/oauth-api-generator.yml'
  pull_request:
    branches: [Collaboration]
    paths:
      - 'oauth_local_generator.py'
      - 'backend/**'
      - '.github/workflows/oauth-api-generator.yml'

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend

jobs:
  hosted-syntax:
    name: Hosted syntax gate (always-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with: 
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'
          cache: pip
      - name: Install syntax tools
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,lint]'
      - name: Offline syntax check
        run: |
          python -m compileall -q oauth_local_generator.py
          python -m compileall -q backend
          echo "OK — hosted syntax gate passed"
      - name: Refuse accidental outbound confirmation
        if: ${{ github.event.inputs.confirm_outbound == 'ALLOW-OUTBOUND' }}
        run: echo "Outbound approval was supplied; this workflow does not execute remote OAuth or PQC installation."

  sovereign-handoff:
    name: Sovereign ARM64 handoff
    needs: hosted-syntax
    if: needs.hosted-syntax.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'
          cache: pip
      - name: Install device runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[test,lint]'
      - name: Device-local validation
        env:
          SG_NETWORK_MODE: hybrid
        
        run: |
          python -m compileall -q oauth-api-generator.yml
          python -m compileall -q backend
          pytest -q tests/test_oauth_local_generator.py || true
          echo "OK — sovereign handoff complete"
