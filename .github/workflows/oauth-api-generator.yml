name: OAUTH-API-GENERATOR (L6 Sovereign Hardened)

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend
  # L6 GateOne Configuration
  GATEONE_VERIFIER_URL: ${{ secrets.GATEONE_VERIFIER_URL || 'http://localhost:9899/verify-attestation' }}
  SOVEREIGN_LIVETERMINAL_URL: ${{ secrets.SOVEREIGN_LIVETERMINAL_URL || '' }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: oauth-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # LINT + TEST + SOVEREIGN CORE VALIDATION
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-extra.txt || true
          pip install flake8 safety pytest-cov pytest-asyncio oqs  # oqs-python for real ML-DSA

      - name: Lint with flake8
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test Sovereign Core (ML-DSA-87 Primary + 65 Fallback + Key Rotation)
        run: |
          python -c "
          import asyncio
          from sovereign import sovereign, init_sovereign
          from sovereign.pqc_signatures import MLDSASigner

          async def test_sovereign():
              result = await init_sovereign()
              print('Init result:', result)
              assert result['status'] == 'success'

              # ML-DSA-87 primary with fallback test
              signer = MLDSASigner(algorithm='ML-DSA-87')
              pub, sec = signer.load_or_create_keypair()
              message = b'L6 Sovereign CI Test - ML-DSA-87 Primary'
              signature = signer.sign(message)
              verified = signer.verify(message, signature)
              assert verified is True
              print('ML-DSA-87 signing + verification: PASSED')

              # Fallback path test
              signer65 = MLDSASigner(algorithm='ML-DSA-65')
              sig65 = signer65.sign(message)
              assert signer65.verify(message, sig65) is True
              print('ML-DSA-65 fallback path: PASSED')

              # API Key Derivation + Rotation
              key = sovereign.derive_api_key('ci-test-service', length=32)
              assert len(key) == 64
              rot = sovereign.rotate_all('ci_test_rotation')
              print('Rotation result:', rot)

              print('Sovereign Core checks PASSED')
          asyncio.run(test_sovereign())
          "

      - name: Run Python tests
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=xml --strict-markers -x --tb=short

      - name: Dependency safety check
        run: safety check -r requirements.txt --output text || true
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Node syntax check
        run: |
          node -c node-bridge/server.js || true
          node -c unified_server.js || true

  # =========================================================
  # SOVEREIGN SECURITY JOB (ML-DSA-87 + Real GateOne Attestation)
  # =========================================================
  sovereign-security:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install sovereign core + oqs-python
        run: |
          pip install -r requirements.txt || true
          pip install oqs

      - name: Generate + Verify ML-DSA-87 GateOne Attestation Token
        run: |
          python -c "
          import json, time, oqs, os
          from sovereign.pqc_signatures import MLDSASigner

          PRIMARY = 'ML-DSA-87'
          FALLBACK = 'ML-DSA-65'

          payload = {
              'node_id': 'github-actions-${{ github.run_id }}',
              'nonce': str(int(time.time())),
              'timestamp': int(time.time()),
              'build_ref': '${{ github.sha }}',
              'l6_level': 'Environmental',
              'workflow': '${{ github.workflow }}'
          }

          # Sign with ML-DSA-87 primary
          signer = MLDSASigner(algorithm=PRIMARY)
          pub, sec = signer.load_or_create_keypair()
          message = json.dumps(payload, sort_keys=True).encode()
          signature = signer.sign(message)

          token = {
              'payload': payload,
              'signature': signature.hex(),
              'public_key': pub.hex(),
              'algorithm': PRIMARY
          }

          print('Generated ML-DSA-87 attestation token')
          print(json.dumps(token, indent=2))

          # Local verification
          verified = signer.verify(message, signature)
          print(f'Local ML-DSA-87 verification: {verified}')
          assert verified is True

          # Optional: POST to real GateOne verifier
          verifier_url = os.environ.get('GATEONE_VERIFIER_URL', '')
          if verifier_url and verifier_url.startswith('http'):
              import requests
              try:
                  r = requests.post(verifier_url, json={'attestation_token': json.dumps(token), 'max_age_seconds': 300}, timeout=10)
                  print('GateOne response:', r.json())
              except Exception as e:
                  print('GateOne call skipped or failed:', e)

          # Optional SCAR / LiveTerminal emission
          live_url = os.environ.get('SOVEREIGN_LIVETERMINAL_URL', '')
          if live_url:
              print(f'SCAR emission would go to {live_url} (stub)')
          "

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN (gated)
  # =========================================================
  build-sign:
    needs: [build-test, sovereign-security]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        shell: bash
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign Image (Keyless)
        run: cosign sign --yes ${{ env.REGISTRY_LC }}:${{ github.sha }}

  # =========================================================
  # SBOM + ATTESTATION (gated)
  # =========================================================
  supply-chain:
    needs: [build-sign, sovereign-security]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        shell: bash
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Cosign SBOM Attestation
        run: cosign attest --predicate sbom-sovereignty-ai.json --type cyclonedx --yes ${{ env.REGISTRY_LC }}:${{ github.sha }}
        continue-on-error: true

  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: true
