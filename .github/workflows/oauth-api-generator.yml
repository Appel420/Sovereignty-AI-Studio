# OAUTH API GENERATOR – HYBRID IGNITION PIPELINE
# Public/global-safe: GitHub-hosted ARM64 is the ignition/fallback path.
# When an authorized self-hosted Linux ARM64 runner is online, ignition dispatches
# the sovereign execution workflow to it instead of leaving this run queued.
name: OAUTH-API-GENERATOR

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  ignition:
    name: OAuth ignition / runner selection
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    outputs:
      self_hosted: ${{ steps.select.outputs.self_hosted }}
    steps:
      - name: Select execution path
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== OAUTH HYBRID IGNITION ==="
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          self_hosted=false

          # Never expose a public/fork pull request to the owner's self-hosted runner.
          trusted_event=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            trusted_event=true
          fi

          if [[ "$trusted_event" == true ]]; then
            runners="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"

            if echo "$runners" | jq -e '
              any(.runners[]?;
                .status == "online" and .busy == false and
                (any(.labels[]?; (.name | ascii_downcase) == "self-hosted")) and
                (any(.labels[]?; (.name | ascii_downcase) == "linux")) and
                (any(.labels[]?; (.name | ascii_downcase) == "arm64"))
              )
            ' >/dev/null; then
              echo "Matching idle self-hosted Linux ARM64 runner is online."
              payload="$(jq -nc \
                --arg ref "$GITHUB_REF_NAME" \
                --arg sha "$GITHUB_SHA" \
                --arg run_id "$GITHUB_RUN_ID" \
                '{ref:$ref,inputs:{source_sha:$sha,source_run_id:$run_id}}')"
              if curl -fsSL -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/oauth-api-generator-self-hosted.yml/dispatches" \
                -d "$payload"; then
                self_hosted=true
                echo "Self-hosted execution dispatched."
              else
                echo "::warning::Self-hosted dispatch failed; falling back to GitHub-hosted ARM64."
              fi
            else
              echo "No matching idle self-hosted Linux ARM64 runner."
              echo "GitHub-hosted ARM64 remains the execution path."
            fi
          else
            echo "Untrusted/public event: self-hosted execution disabled."
            echo "GitHub-hosted ARM64 remains the execution path."
          fi

          echo "self_hosted=${self_hosted}" >> "$GITHUB_OUTPUT"

  build-test:
    name: OAuth Python 3.13
    needs: ignition
    if: ${{ needs.ignition.outputs.self_hosted != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install flake8 safety pytest pytest-cov
      - name: Lint
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Tests
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=term --strict-markers -x --tb=short
      - name: Dependency safety
        run: |
          safety check -r .github/workflows/Requirements.txt --output text
          safety check -r requirements.txt --output text

  node-check:
    name: OAuth Node validation
    needs: ignition
    if: ${{ needs.ignition.outputs.self_hosted != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Node syntax check
        run: |
          npm run check
          node -c node-bridge/server.js

  security-scan:
    name: OAuth security scan
    needs: [ignition, build-test, node-check]
    if: ${{ always() && needs.ignition.outputs.self_hosted != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Validate upstream
        run: |
          if [[ "${{ needs.build-test.result }}" != "success" || "${{ needs.node-check.result }}" != "success" ]]; then
            echo "::error::Upstream OAuth validation failed."
            exit 1
          fi
      - name: Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          hide-progress: false
          exit-code: 1
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  dependency-review:
    name: OAuth dependency review
    needs: ignition
    if: ${{ github.event_name == 'pull_request' && needs.ignition.outputs.self_hosted != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@v4

  build-sign:
    name: OAuth image build and publication
    needs: [ignition, build-test, node-check]
    if: ${{ always() && needs.ignition.outputs.self_hosted != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Validate release credentials
        if: ${{ github.event_name == 'release' }}
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1 }}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2 }}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3 }}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            else
              echo "Credential ${key}: present (value withheld)"
            fi
          done
          [[ "$missing" -eq 0 ]]
      - name: Set image name
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
      - name: Install cosign
        if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: sigstore/cosign-installer@v3
      - name: Sign published image
        if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${REGISTRY_LC}:${GITHUB_SHA}"
