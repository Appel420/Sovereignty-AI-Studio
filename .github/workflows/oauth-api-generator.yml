# OAUTH API GENERATOR – CI/CD PIPELINE
#
# Sovereignty AI Studio integration CI/CD.
# Collaboration is the canonical integration branch for this repository.
# Every triggered run remains observable; concurrency never cancels prior runs.

name: OAUTH-API-GENERATOR

on:
  push:
    branches: [ Collaboration ]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  pull_request:
    branches: [ Collaboration ]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  build-test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install flake8 safety
      - name: Lint with flake8
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Python tests
        env:
          PYTHONPATH: .:./backend
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=term --strict-markers -x --tb=short
      - name: Dependency safety check
        run: |
          safety check -r .github/workflows/Requirements.txt --output text || true
          safety check -r requirements.txt --output text || true
        continue-on-error: true

  node-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund
      - name: Node syntax check
        run: |
          npm run check
          node -c node-bridge/server.js

  build-sign:
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/Collaboration' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate SHAMIR release-share secrets
        if: github.event_name == 'release'
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1 }}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2 }}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3 }}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_1:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_2:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_3:-}"
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
      - name: Compute lowercase image name
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign Image (Keyless — Fulcio + Rekor)
        run: |
          cosign sign --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

  security-scan:
    needs: [build-test, node-check]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1
      - name: OWASP dependency check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: true

# Security headers are enforced in nginx + FastAPI.
# Compliance checks are advisory guards, not certification claims.
# SHAMIR shares are checked for presence only; CI never reconstructs a master key.
