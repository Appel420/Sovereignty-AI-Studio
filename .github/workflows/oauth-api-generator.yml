name: OAUTH-API-GENERATOR

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CI_EXECUTION_MODE: connected
  SG_NETWORK_MODE: online
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  build-test:
    name: OAuth Python Build and Test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout repository without third-party Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Verify connected runner
        run: |
          test "${GITHUB_ACTIONS}" = "true"
          test "${CI_EXECUTION_MODE}" = "connected"
          test "${SG_NETWORK_MODE}" = "online"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then python3 -m pip install -e '.[test,lint]' || python3 -m pip install -e .; fi
          if [[ -f requirements.txt ]]; then python3 -m pip install -r requirements.txt; fi
          if [[ -f .github/workflows/Requirements.txt ]]; then python3 -m pip install -r .github/workflows/Requirements.txt; fi
          python3 -m pip install pytest flake8
          python3 -m pip check

      - name: Python lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        env:
          PYTHONPATH: .:./backend:./src:./prototypes
        run: python3 -m pytest -q --strict-markers -x --tb=short

  node-check:
    name: OAuth Node Bridge Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without third-party Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Node validation
        run: |
          node --version
          if [[ -f package-lock.json ]]; then npm ci --ignore-scripts --no-audit --no-fund; elif [[ -f package.json ]]; then npm install --ignore-scripts --no-audit --no-fund; fi
          if [[ -f package.json ]]; then npm run check --if-present; fi
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi
