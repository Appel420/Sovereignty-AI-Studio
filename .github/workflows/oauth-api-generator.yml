# OAUTH API GENERATOR — manual, offline-safe syntax validation
name: OAUTH-API-GENERATOR

on:
  workflow_dispatch:
    inputs:
      confirm_outbound:
        description: "Type ALLOW-OUTBOUND to explicitly enable outbound steps"
        required: true
        default: "LOCAL"

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  SG_NETWORK_MODE: "local"
  SG_LOCAL_ONLY: "1"

jobs:
  offline-syntax-only:
    runs-on: self-hosted, linux arm64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Offline syntax check
        run: |
          python -m compileall -q oauth_local_generator.py
          python -m compileall -q backend
          echo "OK — offline syntax gate passed"
      - name: Refuse accidental outbound confirmation
        if: ${{ github.event.inputs.confirm_outbound == 'ALLOW-OUTBOUND' }}
        run: echo "Outbound approval was supplied; this workflow does not execute remote OAuth or PQC installation."
