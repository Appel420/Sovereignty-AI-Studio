# =========================================================
# OAUTH API GENERATOR – CI/CD PIPELINE
# =========================================================
# Connected CI/CD build, test, security, container, SBOM, and signing
# pipeline for Sovereignty AI Studio.
#
# This workflow is NOT an offline-only lane. It is the connected CI bridge.
# Offline/local execution belongs in the dedicated local CI workflows.
# =========================================================

name: OAUTH-API-GENERATOR

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  # =========================================================
  # LINT + TEST (Python)
  # =========================================================
  build-test:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Report connected runner
        run: |
          echo "CI bridge: connected"
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          echo "Branch/ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          python -m pip install flake8 safety

      - name: Python flake8 Lint
        uses: py-actions/flake8@v2.3.0
        with:
          path: .
          update-pip: false
          flake8-version: latest

      - name: Run Python tests
        env:
          PYTHONPATH: .:./backend
        run: python -m pytest --cov=apps --cov=backend --cov=src --cov-report=term --strict-markers -x --tb=short

      - name: PyCharm Python Security Scanner
        uses: tonybaloney/pycharm-security@1.25.1
        with:
          path: .
          fail_on_warnings: no
          source: .
          requirements: requirements.txt

      - name: Dependency safety check
        continue-on-error: true
        run: |
          python -m safety check -r .github/workflows/Requirements.txt --output text || true
          python -m safety check -r requirements.txt --output text || true

  # =========================================================
  # NODE CHECK
  # =========================================================
  node-check:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Report connected runner
        run: |
          echo "CI bridge: connected"
          echo "Runner: ${RUNNER_NAME}"
          echo "Architecture: ${RUNNER_ARCH}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Node syntax check
        run: |
          npm run check
          node --check node-bridge/server.js

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # =========================================================
  build-sign:
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SHAMIR release-share secrets
        if: github.event_name == 'release'
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1 }}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2 }}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3 }}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_1:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_2:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_3:-}"
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Compute lowercase image name
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (Keyless — Fulcio + Rekor)
        run: |
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # =========================================================
  # DEPENDENCY REVIEW
  # =========================================================
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

  # =========================================================
  # SECURITY SCANNING
  # =========================================================
  security-scan:
    needs: [build-test, node-check]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1

      - name: OWASP dependency check
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt || true
