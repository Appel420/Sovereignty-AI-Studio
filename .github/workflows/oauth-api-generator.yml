name: OAUTH-API-GENERATOR

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend

permissions:
  contents: read

concurrency:
  group: oauth-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # LINT + TEST + SOVEREIGN CORE VALIDATION
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install flake8 safety pytest-cov

      - name: Lint with flake8
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test Sovereign Core (Async Init + API Key Derivation + ML-DSA-65)
        run: |
          python -c "
          import asyncio
          from sovereign import sovereign, init_sovereign
          async def test_sovereign():
              result = await init_sovereign()
              print('Init result:', result)
              assert result['status'] == 'success'
              assert result.get('mldsa65_ready') is True

              # API Key Derivation test (hydration enforced)
              key = sovereign.derive_api_key('ci-test-service', length=32)
              assert len(key) == 64

              # Rotation test
              rot = sovereign.rotate_all('ci_test_rotation')
              print('Rotation result:', rot)

              print('Sovereign Core checks PASSED')
          asyncio.run(test_sovereign())
          "

      - name: Run Python tests
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=xml --strict-markers -x --tb=short

      - name: Dependency safety check
        run: safety check -r .github/workflows/Requirements.txt --output text || true
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Node syntax check
        run: |
          node -c node-bridge/server.js || true
          node -c unified_server.js || true

  # =========================================================
  # NEW: Sovereign Security Job (Key Rotation + ML-DSA-65 Signing)
  # =========================================================
  sovereign-security:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r .github/workflows/Requirements.txt
      - name: Full Sovereign Security Validation (Rotation + ML-DSA-65)
        run: |
          python -c "
          import asyncio
          from sovereign import sovereign, init_sovereign
          from sovereign.pqc_signatures import MLDSASigner

          async def full_security_test():
              await init_sovereign()

              # Key Rotation
              rot = sovereign.rotate_all('github_actions_sovereign_security')
              print('Rotation result:', rot)
              assert rot.get('status') in ('success', 'partial_failure')

              # ML-DSA-65 Signing Test
              signer = MLDSASigner()
              pub, sec = signer.load_or_create_keypair()
              message = b'Sovereign Security CI Test Message - ML-DSA-65'
              signature = signer.sign(message)
              verified = signer.verify(message, signature)
              assert verified is True
              print('ML-DSA-65 signing and verification: PASSED')

              print('Sovereign Security Job: ALL CHECKS PASSED')
          asyncio.run(full_security_test())
          "

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN (gated)
  # =========================================================
  build-sign:
    needs: [build-test, sovereign-security]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        shell: bash
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign Image (Keyless)
        run: cosign sign --yes ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # =========================================================
  # SBOM + ATTESTATION (gated)
  # =========================================================
  supply-chain:
    needs: [build-sign, sovereign-security]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        shell: bash
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Cosign SBOM Attestation
        run: cosign attest --predicate sbom-sovereignty-ai.json --type cyclonedx --yes ${{ env.REGISTRY_LC }}:${{ github.sha }}
        continue-on-error: true

  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: true
