# =========================================================
# OAUTH API GENERATOR – CI/CD PIPELINE
# =========================================================
# Production-grade, zero-trust, supply-chain verified
# deployment pipeline for Sovereignty AI Studio
# =========================================================

name: OAUTH-API-GENERATOR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

env:
  PYTHONPATH: .:./backend

jobs:

  # =========================================================
  # LINT + TEST (Python + Node)
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install flake8 safety

      - name: Lint with flake8
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        env:
          PYTHONPATH: .:./backend
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=xml --strict-markers -x --tb=short

      - name: Dependency safety check
        run: |
          safety check -r .github/workflows/Requirements.txt --output text || true
          safety check -r requirements.txt --output text || true
        continue-on-error: true

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Node syntax check
        run: |
          node -c node-bridge/server.js
          node -c unified_server.js

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # =========================================================
  build-sign:
    needs: build-test
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        shell: bash
        run: |
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign Image (Keyless — Fulcio + Rekor)
        run: |
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # =========================================================
  # SBOM GENERATION + ATTESTATION
  # =========================================================
  supply-chain:
    needs: build-sign
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Compute lowercase image name
        shell: bash
        run: |
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Cosign SBOM Attestation
        run: |
          cosign attest \
            --predicate sbom-sovereignty-ai.json \
            --type cyclonedx \
            --yes \
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1
        continue-on-error: true

  # =========================================================
  # SECURITY SCANNING
  # =========================================================
  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: OWASP dependency check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: true

# =========================================================
# SECURITY HARDENING HEADERS (enforced in nginx + FastAPI)
# =========================================================
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# Content-Security-Policy: default-src 'self'; script-src 'self'
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# X-XSS-Protection: 1; mode=block
# Referrer-Policy: strict-origin-when-cross-origin
# Permissions-Policy: camera=(), microphone=(), geolocation=()

# =========================================================
# CRYPTO STACK (implemented in security_backend.py)
# =========================================================
# - HMAC-SHA3-512 (token signing, Dilithium3 shim)
# - Argon2id (KDF for passphrase hashing — planned)
# - BLAKE3 hashing (audit integrity — planned)
# - ChaCha20-Poly1305 (AEAD encryption — planned)
# - ML-DSA / Falcon (PQ signatures — planned)
# - ML-KEM (Kyber key exchange — planned)
# - Merkle tree audit logs (tamper proof — planned)
# - TSA timestamping (court admissible — planned)

