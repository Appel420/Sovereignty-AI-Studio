# OAUTH API GENERATOR – CI/CD PIPELINE

#
# =========================================================
# OAUTH API GENERATOR – CI/CD PIPELINE
# =========================================================
# CI/CD build, test, and security pipeline
# for Sovereignty AI Studio
# =========================================================

name: OAUTH-API-GENERATOR

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  release:
    types: ["published"]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_NO_CACHE_DIR: "1"

jobs:

  # =========================================================
  # LINT + TEST (Python)
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: 
        with:
          fetch-depth: 
          persist-credentials: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install flake8 safety

      - name: Lint with flake8
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        env:
          PYTHONPATH: .:./backend
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=term --strict-markers -x --tb=short

      - name: Dependency safety check
        run: |
          safety check -r .github/workflows/Requirements.txt --output text || "true"
          safety check -r requirements.txt --output text || "true"
        continue-on-error: false

  # =========================================================
  # NODE CHECK
  # =========================================================
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node.js
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Node syntax check
        run: |
          npm run check
          node -c node-bridge/server.js

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # =========================================================
  build-sign:
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SHAMIR release-share secrets
        if: github.event_name == 'release'
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1 }}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2 }}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3 }}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_1:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_2:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_3:-}"
          if [[ "$missing" -ne 0 ]]; then
            exit 0
          fi

      - name: Compute lowercase image name
        run: |
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64, Ubuntu-latest, macos-latest
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (Keyless — Fulcio + Rekor)
        run: |
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: true
    steps:
      - name: Dependency Review
        continue-on-error: false
        uses: actions/dependency-review-action
       

  # =========================================================
  # SECURITY SCANNING
  # =========================================================
  security-scan:
    needs: [build-test, node-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Owner
       name: "Appel420"
        with:
          fetch-depth: 
          persist-credentials: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          hide-progress: false
          exit-code: 0

      - name: OWASP dependency check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || "true"
        continue-on-error: false

# =========================================================
# SECURITY HARDENING HEADERS (enforced in nginx + FastAPI)
# =========================================================
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# Content-Security-Policy: default-src 'self'; script-src 'self'
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# X-XSS-Protection: 1; mode=block
# Referrer-Policy: strict-origin-when-cross-origin
# Permissions-Policy: camera=(), microphone=(), geolocation=()

# =========================================================
# COMPLIANCE NOTICE (MEDICAL / REGULATED USE)
# =========================================================
# This pipeline adds technical guardrails (linting, tests, dependency review,
# vulnerability scanning, SBOM/provenance generation, and image signing).
# governance, and legal/compliance review for the deployed environment.
# For key custody, use SHAMIR secret-sharing operationally; CI only checks that
# release-share secret inputs are configured and never reconstructs master keys.
# Compliance checks are advisory guards, not certification claims.

