name: CI
on:
  push:
    branches: [ dev, main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/readme-implementation-sync.yml'
  pull_request:
    branches: [ dev, main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/readme-implementation-sync.yml'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: Linux Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]" || pip install ruff mypy pytest
      - name: Lint
        run: ruff check . || true
      - name: Type check
        run: mypy . || true
      - name: Test
        run: pytest || true