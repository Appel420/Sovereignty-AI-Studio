name: ci.yml

on:
  push:
    branches:
      - Collaboration
  pull_request:
    branches:
      - Collaboration
  workflow_dispatch:

concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .:./backend

jobs:
  repo-conformance:
    name: Repository conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "${GITHUB_SHA}"

          git checkout --detach FETCH_HEAD

      - name: Diamond Core contract gate
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f diamond-core/Cargo.toml

          cargo test \
            --manifest-path diamond-core/Cargo.toml \
            --all-targets \
            --locked

      - name: Python baseline
        shell: bash
        run: |
          python --version
          python -m pip --version

      - name: Install validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'
          python -m pip install pip-audit==2.9.0
          python -m pip check

      - name: Dependency vulnerability gate
        shell: bash
        run: |
          set -Eeuo pipefail
          pip-audit --strict

      - name: I-008 executable contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_i008_contract.py

      - name: Compile
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q .

      - name: Ruff
        shell: bash
        run: |
          set -Eeuo pipefail
          ruff check .

      - name: Mypy
        shell: bash
        run: |
          set -Eeuo pipefail
          mypy sovereign/

      - name: Pytest
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q

  workflow-surface:
    name: Workflow surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "${GITHUB_SHA}"

          git checkout --detach FETCH_HEAD

      - name: Enumerate workflow surface
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d .github/workflows

          count="$(
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              | wc -l
          )"

          test "$count" -gt 0

          echo "WORKFLOW_FILE_COUNT=$count"

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -print \
            | sort

  coordination-surface:
    name: Coordination import and contract audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "${GITHUB_SHA}"

          git checkout --detach FETCH_HEAD

      - name: Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python --version

      - name: Coordination import
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c 'from backend.coordination import BranchRegistry; print("coordination import: PASS")'

      - name: Coordination tests
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q backend/coordination

  recovery-observer:
    name: Recovery observer
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "${GITHUB_SHA}"

          git checkout --detach FETCH_HEAD

      - name: Publish execution state
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "RECOVERY_OBSERVER=ACTIVE"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "SHA=${GITHUB_SHA}"
          echo "Recovery policy: preserve evidence; never silently convert failure to success."
