name: CI

# Non-blocking CI: it still runs on pushes and pull requests, but failures do not
# prevent other checks or merges from proceeding.
on:
  push:
    branches: [dev, main, copilot/main, Collaboration]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/readme-implementation-sync.yml'
  pull_request:
    branches: [main, copilot/main, Collaboration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Non-blocking CI
    continue-on-error: true
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,lint]"

      - name: Lint
        run: ruff check sovereign/

      - name: Type check
        run: mypy sovereign/

      - name: Test
        run: pytest

      - name: Create local CI manifest
        if: always()
        run: |
          python3 - <<'PY'
          import json, time
          manifest = {
              "workflow": "CI",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "event": "${{ github.event_name }}",
              "execution": "self-hosted-local-arm64",
              "non_blocking": True,
              "timestamp": int(time.time()),
          }
          with open("ci-build-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
          print("Local CI manifest created")
          PY

      - name: Upload CI Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-manifest-${{ github.run_id }}
          path: ci-build-manifest.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Explain execution boundary
        if: always()
        run: |
          echo "This workflow is non-blocking."
          echo "Failures are reported but do not block merges."
          echo "Normal local CI path: bash scripts/offline-runner.sh"
