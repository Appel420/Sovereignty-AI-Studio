name: Sovereign CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sovereign-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  conformance:
    name: Sovereign Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository without third-party Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Verify runner
        run: |
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          test -n "${RUNNER_OS}"
          test -n "${RUNNER_ARCH}"
          echo "Sovereign CI: CONNECTED"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Commit: ${GITHUB_SHA}"

      - name: Python validation
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then python3 -m pip install -e '.[test,lint]' || python3 -m pip install -e .; fi
          if [[ -f requirements.txt ]]; then python3 -m pip install -r requirements.txt; fi
          python3 -m pip check
          if [[ -d tests ]]; then PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/backend:${GITHUB_WORKSPACE}/prototypes" python3 -m pytest -q tests; fi

      - name: Python lint
        run: |
          if command -v ruff >/dev/null 2>&1; then
            [[ ! -d sovereign ]] || ruff check sovereign
            [[ ! -d backend ]] || ruff check backend
          else
            echo 'ruff not installed; lint is not configured in this repository'
          fi

      - name: Rust validation
        run: |
          if [[ -f phase0/Cargo.toml ]]; then cargo test --manifest-path phase0/Cargo.toml; else echo 'No Phase 0 Rust workspace; skipping'; fi

      - name: Node validation
        run: |
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; fi
