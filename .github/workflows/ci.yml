name: CI

# Retained only as an owner-invoked diagnostic workflow.
# Normal validation is local/offline via scripts/offline-runner.sh.
# No push or pull_request trigger is allowed to create startup failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Explain execution boundary
        run: |
          echo "This workflow is manual-only."
          echo "Normal CI path: bash scripts/offline-runner.sh"
          echo "No automatic push or pull_request execution is enabled."
