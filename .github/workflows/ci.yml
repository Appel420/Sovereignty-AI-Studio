name: CI
on:
  push:
    branches: [ dev, main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/readme-implementation-sync.yml'
  workflow_dispatch:
    
  

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libssl-dev \
            pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,lint,pqc]"

      - name: Verify PQC provider (ML-DSA-87)
        run: |
          python - <<'PY'
          import oqs

          supported = oqs.get_enabled_sig_mechanisms()
          if "ML-DSA-87" not in supported:
              raise SystemExit(
                  f"ML-DSA-87 is unavailable in this liboqs build.\n"
                  f"Supported algorithms: {supported}"
              )
          print(f"liboqs {oqs.oqs_version()} — ML-DSA-87 available")
          PY

      - name: Lint
        run: ruff check sovereign/

      - name: Type check
        run: mypy sovereign/

      - name: Test
        run: pytest

      - name: Create PQC-Signed CI Manifest
        run: |
          python3 - <<'PY'
          import json
          import sys
          import time

          sys.path.insert(0, ".")

          from sovereign.pqc_signatures import MLDSASigner

          manifest = {
              "workflow": "CI",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "event": "${{ github.event_name }}",
              "timestamp": int(time.time()),
          }

          signer = MLDSASigner(algorithm="ML-DSA-87")
          public_key, _ = signer.load_or_create_keypair()
          message = json.dumps(manifest, sort_keys=True).encode()
          signature = signer.sign(message)

          if not signer.verify(message, signature):
              raise RuntimeError("ML-DSA-87 signature verification failed")

          manifest["ml_dsa_87_signature"] = signature.hex()
          manifest["public_key"] = public_key.hex()

          with open("ci-build-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)

          print("PQC-signed CI build manifest created (ML-DSA-87)")
          PY

      - name: Upload CI Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-manifest-${{ github.run_id }}
          path: ci-build-manifest.json
          retention-days: 30
