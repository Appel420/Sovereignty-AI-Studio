name: CI

# Device-local / hybrid CI. GitHub dispatches the job; execution remains on the
# owner's self-hosted ARM64 runner. No hosted build execution.
on:
  push:
    branches: [ dev, main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/readme-implementation-sync.yml'
  workflow_dispatch:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Use standard runner labels so GitHub can match a normal ARM64 self-hosted
    # runner. The previous single custom label could leave jobs permanently queued.
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,lint]"

      - name: Lint
        run: ruff check sovereign/

      - name: Type check
        run: mypy sovereign/

      - name: Test
        run: pytest

      - name: Create local CI manifest
        if: always()
        run: |
          python3 - <<'PY'
          import json, time
          manifest = {
              "workflow": "CI",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "event": "${{ github.event_name }}",
              "execution": "self-hosted-local-arm64",
              "timestamp": int(time.time()),
          }
          with open("ci-build-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
          print("Local CI manifest created")
          PY

      - name: Upload CI Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-manifest-${{ github.run_id }}
          path: ci-build-manifest.json
          retention-days: 30
          if-no-files-found: ignore
