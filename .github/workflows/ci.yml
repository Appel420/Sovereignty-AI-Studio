name: Sovereignty CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, dev]
  pull_request:
    branches: [Collaboration, main, dev]

permissions:
  contents: read

concurrency:
  group: sovereignty-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate manifest
        run: |
          set -Eeuo pipefail
          python -m json.tool system/component-manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('system/component-manifest.json').read_text())
          assert d['schema']=='sovereignty.system.component/v1'
          assert d['authority']=='human-owner'
          ids=[c['id'] for c in d['components']]
          repos=[c['repository'] for c in d['components']]
          assert len(ids)==len(set(ids)), 'duplicate component id'
          assert len(repos)==len(set(repos)), 'duplicate repository mapping'
          for e in d['edges']:
              assert e['from'] in ids and e['to'] in ids
          print(f"contract OK: {len(ids)} components, {len(d['edges'])} edges")
          PY
      - name: Validate submodule policy
        run: |
          set -Eeuo pipefail
          if [[ -f .gitmodules ]]; then
            while read -r key url; do
              [[ "$url" == https://github.com/Appel420/* ]] || { echo "ERROR: unapproved submodule URL: $url"; exit 1; }
            done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.url$' || true)
          fi

  python:
    name: Python Lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Compile Python
        run: |
          set -Eeuo pipefail
          files=$(find . -type f -name '*.py' -not -path './.git/*' -not -path './.venv/*')
          if [[ -z "$files" ]]; then echo 'No Python sources; lane passed.'; exit 0; fi
          while IFS= read -r f; do python -m py_compile "$f"; done <<< "$files"
      - name: Test Python when a suite exists
        run: |
          set -Eeuo pipefail
          if [[ -d tests && ( -f requirements.txt || -f pyproject.toml ) ]]; then
            python -m pip install -q pytest
            [[ ! -f requirements.txt ]] || python -m pip install -q -r requirements.txt
            python -m pytest -q tests
          else
            echo 'No dependency-backed Python suite; compile result retained.'
          fi

  node:
    name: Node Lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate Node
        run: |
          set -Eeuo pipefail
          if [[ ! -f package.json ]]; then echo 'No package.json; lane passed.'; exit 0; fi
          node --version
          npm --version
          npm install --ignore-scripts --no-audit --no-fund
          npm test --if-present

  rust:
    name: Rust Lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate Rust
        run: |
          set -Eeuo pipefail
          if [[ ! -f Cargo.toml ]]; then echo 'No Cargo.toml; lane passed.'; exit 0; fi
          cargo test --workspace --all-targets

  integration:
    name: Integration Result
    if: ${{ always() }}
    needs: [contract, python, node, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report independent lanes
        env:
          CONTRACT: ${{ needs.contract.result }}
          PYTHON: ${{ needs.python.result }}
          NODE: ${{ needs.node.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "contract=$CONTRACT"
          echo "python=$PYTHON"
          echo "node=$NODE"
          echo "rust=$RUST"
          if [[ "$CONTRACT" == failure || "$CONTRACT" == cancelled ]]; then
            echo 'Contract gate failed; integration result is not authoritative.'
            exit 1
          fi
          echo 'Independent lanes completed without dependency cascade.'
