name: Sovereignty CI

on:
  workflow_dispatch:
  push:
    branches: ["Collaboration", "main", "dev"]
  pull_request:
    branches: ["Collaboration", "main", "dev"]

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate component manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m json.tool system/component-manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("system/component-manifest.json")
          d = json.loads(p.read_text())
          assert d["schema"] == "sovereignty.system.component/v1"
          assert d["authority"] == "human-owner"
          assert d["default_mode"] == "local-first"
          ids = [c["id"] for c in d["components"]]
          assert len(ids) == len(set(ids))
          print(f"validated {len(ids)} components and {len(d['edges'])} contract edges")
          PY

      - name: Detect committed virtual environment
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d .venv ]]; then
            echo "ERROR: .venv must not be committed to the repository"
            exit 1
          fi

      - name: Validate Git submodules
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f .gitmodules ]]; then
            git config --file .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key url; do
              [[ "$url" == https://github.com/Appel420/* ]] || { echo "ERROR: unapproved submodule URL: $url"; exit 1; }
            done
          fi

      - name: Python validation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f pyproject.toml || -f requirements.txt ]]; then
            python -m pip install --upgrade pip
            if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
            if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]' || python -m pip install -e .; fi
            python -m pip check
          fi

      - name: Python tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then python -m pytest -q tests; else echo "No tests directory; no Python tests to run"; fi

      - name: Node validation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f package.json ]]; then
            node --version
            npm --version
            npm install --ignore-scripts
            npm test --if-present
          fi

      - name: Rust validation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f Cargo.toml ]]; then cargo test --workspace --all-targets; fi

      - name: Contract summary
        shell: bash
        run: |
          echo "Sovereignty CI: component boundaries validated"
          echo "Failure policy: isolate/degrade, never cascade"
