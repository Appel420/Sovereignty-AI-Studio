name: CI

on:
  push:
    branches: [Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [Collaboration, main, dev, copilot/main]
  workflow_dispatch:

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest ruff

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d sovereign ]]; then ruff check sovereign; fi
          if [[ -d backend ]]; then ruff check backend; fi

      - name: Python tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then python -m pytest -q tests; fi

      - name: Rust tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then
            cargo test --manifest-path phase0/Cargo.toml --locked
          fi

      - name: Node syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi

      - name: Frontend ownership contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; fi

  ios:
    name: iOS toolchain
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Xcode and Simulator
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          xcrun simctl list devices available >/dev/null
      - name: Build native project when present
        shell: bash
        run: |
          set -Eeuo pipefail
          project="$(find . -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit)"
          if [[ -n "$project" ]]; then
            echo "Native Apple project detected: $project"
          else
            echo 'No native Apple project present; toolchain validation passed.'
          fi

  android:
    name: Android toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build native project when present
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew build
          else
            echo 'No Gradle project present; Android toolchain validation passed.'
          fi
