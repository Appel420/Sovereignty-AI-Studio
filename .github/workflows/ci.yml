name: CI

# Hybrid CI: self-hosted ARM64 is the primary path. A GitHub-hosted fallback
# runs only when the self-hosted job starts and fails. GitHub Actions cannot
# automatically replace a job that is still queued because no self-hosted
# runner is available.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-hosted:
    name: Primary self-hosted ARM64 CI
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip || true
          python -m pip install -e ".[test,lint]" || true
          python -m pip install pytest ruff mypy || true

      - name: Lint
        run: ruff check sovereign/ || true

      - name: Type check
        run: mypy sovereign/ || true

      - name: Test
        run: pytest -q || true

      - name: Self-hosted execution summary
        if: always()
        run: |
          echo "Primary execution used the self-hosted Linux ARM64 runner."
          echo "CI checks are informational and non-blocking."

  github-hosted-fallback:
    name: GitHub-hosted fallback after primary failure
    needs: self-hosted
    if: needs.self-hosted.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run hosted fallback checks
        run: |
          python -m pip install --upgrade pip || true
          python -m pip install -e ".[test,lint]" || true
          python -m pip install pytest ruff mypy || true
          ruff check sovereign/ || true
          mypy sovereign/ || true
          pytest -q || true

      - name: Fallback execution summary
        if: always()
        run: |
          echo "GitHub-hosted fallback completed."
          echo "The self-hosted primary runner had started but failed."
          echo "CI checks are informational and non-blocking."
