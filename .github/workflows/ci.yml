name: CI

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  conformance:
    name: CI conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify online GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${RUNNER_OS}" = "Linux"
          echo "execution=github-hosted-online"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project and test/lint dependencies
        run: python -m pip install -e '.[test,lint]'
      - name: Ruff
        run: python -m ruff check .
      - name: MyPy
        run: python -m mypy sovereign/
      - name: Pytest
        env:
          PYTHONPATH: .:src:backend:prototypes
        run: python -m pytest -q tests
