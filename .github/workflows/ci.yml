name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - Collaboration

permissions:
  contents: read

concurrency:
  group: sovereignty-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Sovereignty AI Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Verify FastAPI application
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "healthy"}
          print("FASTAPI_HEALTH=PASS")
          PY

      - name: Run tests
        run: python -m pytest -q
