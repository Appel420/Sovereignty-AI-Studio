name: CI

# Global GitHub-hosted CI. This workflow does not depend on the owner's device,
# local network, or self-hosted runner being online.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Global non-blocking CI
    # Always use GitHub infrastructure so runs work for everyone, even when the
    # owner's local/self-hosted device is offline.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
        continue-on-error: true

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
        continue-on-error: true

      - name: Install test and lint dependencies
        if: always()
        run: |
          python -m pip install --upgrade pip || true
          python -m pip install -e ".[test,lint]" || true
          python -m pip install pytest ruff mypy || true
        continue-on-error: true

      - name: Lint
        if: always()
        run: ruff check sovereign/ || true
        continue-on-error: true

      - name: Type check
        if: always()
        run: mypy sovereign/ || true
        continue-on-error: true

      - name: Test
        if: always()
        run: pytest -q || true
        continue-on-error: true

      - name: Create CI manifest
        if: always()
        run: |
          python3 - <<'PY' || true
          import json, time
          manifest = {
              "workflow": "CI",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "event": "${{ github.event_name }}",
              "execution": "github-hosted-ubuntu-latest",
              "owner_device_required": False,
              "non_blocking": True,
              "timestamp": int(time.time()),
          }
          with open("ci-build-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
          print("Global CI manifest created")
          PY

      - name: Upload CI manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-manifest-${{ github.run_id }}
          path: ci-build-manifest.json
          retention-days: 30
          if-no-files-found: ignore
        continue-on-error: true

      - name: Execution summary
        if: always()
        run: |
          echo "Global CI ran on GitHub-hosted ubuntu-latest."
          echo "The owner's self-hosted device and local network were not required."
          echo "This CI is non-blocking by design."
