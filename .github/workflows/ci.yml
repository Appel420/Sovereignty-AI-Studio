name: CI.yml

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: CI (global)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .git
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "CHECKOUT_OK=true"
          echo "COMMIT=${GITHUB_SHA}"

      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install test tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --no-cache-dir ruff pytest

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check .; fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: python -m pytest -q || echo "No tests found or tests skipped"

      - name: Coordination import check
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c "from backend.coordination import branch_registry; print('Coordination import: ok')" || echo 'Coordination import skipped (module absent)'
