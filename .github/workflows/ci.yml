name: CI

on:
  workflow_dispatch:

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conformance:
    name: GitHub CI
    # Global/public CI must not depend on the owner's sovereign runner.
    # Sovereign execution is isolated in ci-sovereign.yml and is opt-in.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify runner execution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          test -n "${RUNNER_OS}"
          test -n "${RUNNER_ARCH}"
          echo "CI controller: GitHub Actions"
          echo "Execution mode: hosted ARM64"
          echo "Actual runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Runner name: ${RUNNER_NAME}"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip check
          python - <<'PY'
          import nacl
          print('PyNaCl:', nacl.__version__)
          PY

      - name: Python lint diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d sovereign ]]; then ruff check sovereign; fi
          if [[ -d backend ]]; then ruff check backend; fi

      - name: Python tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then python -m pytest -q tests; fi

      - name: Phase 0 Rust tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then
            command -v cargo >/dev/null 2>&1
            cargo test --manifest-path phase0/Cargo.toml
          else
            echo 'phase0/Cargo.toml not present; skipping Phase 0 Rust tests'
          fi

      - name: Node syntax check
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then
            command -v node >/dev/null 2>&1
            node --check node-bridge/server.js
          fi

      - name: Frontend ownership contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then
            command -v node >/dev/null 2>&1
            node frontend/scripts/test-sghv119-ownership.js
          fi
