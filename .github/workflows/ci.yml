name: Python CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then
            ruff check "${targets[@]}"
          else
            ruff check .
          fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: python -m pytest -q

      - name: Coordination import check
        shell: bash
        run: |
          python -c "from backend.coordination import branch_registry; print('Coordination import: ok')"
