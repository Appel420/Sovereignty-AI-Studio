name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SGNETWORKMODE: online-ci
  SGLOCALONLY: '0'
  CLOUD_FIRST: 'false'
  PIPNOINPUT: '1'
  PIPDISABLEPIPVERSIONCHECK: '1'
  npmconfigaudit: 'false'
  npmconfigfund: 'false'

jobs:
  conformance:
    name: Repository conformance (self-hosted Linux arm64)
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Actions context
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "CI controller: GitHub Actions"
          echo "Execution: self-hosted
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'

      - name: Lint
        run: ruff check sovereign/

      - name: Type check
        run: mypy sovereign/

      - name: Test
        run: pytest -q
