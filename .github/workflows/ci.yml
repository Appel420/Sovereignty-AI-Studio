name: CI

on:
  push:
    branches: [Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [Collaboration, main, dev, copilot/main]
  workflow_dispatch:

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes

jobs:
  portable:
    name: Portable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest ruff

      - name: Python tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then python -m pytest -q tests; else echo 'No tests directory; nothing to run.'; fi

      - name: Coordination import check
        shell: bash
        run: python -c "from backend.coordination import BranchRegistry; print('coordination import: ok')"

      - name: Rust tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then
            cargo test --manifest-path phase0/Cargo.toml --locked
          fi

      - name: Node syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi

      - name: Frontend ownership contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; fi

  ios:
    name: iOS / Xcode
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Apple toolchain
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          xcrun simctl list devices available >/dev/null
      - name: Detect native Apple project
        shell: bash
        run: |
          set -Eeuo pipefail
          project="$(find . -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit)"
          if [[ -n "$project" ]]; then echo "Native Apple project: $project"; else echo 'No Xcode project present; toolchain validation passed.'; fi

  android:
    name: Android / SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build Android when project exists
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew build
          else
            echo 'No Gradle project present; Android toolchain validation passed.'
          fi
