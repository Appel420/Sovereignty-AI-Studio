name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SGNETWORKMODE: online-ci
  SGLOCALONLY: '0'
  CLOUD_FIRST: 'false'
  PIPNOINPUT: '1'
  PIPDISABLEPIPVERSIONCHECK: '1'
  npmconfigaudit: 'false'
  npmconfigfund: 'false'

jobs:
  conformance:
    name: Repository conformance (self-hosted Linux arm64)
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Actions context
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "CI controller: GitHub Actions"
          echo "Execution: self-hosted Linux arm64"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'

      - name: Lint
        run: ruff check sovereign/

      - name: Type check
        run: mypy sovereign/

      - name: Test
        run: pytest -q

      - name: Validate runtime coherence
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/validate-runtime-coherence.py ]]; then
            python3 scripts/validate-runtime-coherence.py
          else
            echo 'runtime coherence validator unavailable; failing closed'
            exit 1
          fi

      - name: Validate local dashboard inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/validate-local-dashboard.py ]]; then
            python3 scripts/validate-local-dashboard.py
          else
            echo 'local dashboard validator unavailable; failing closed'
            exit 1
          fi

      - name: Run repository-owned local CI
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -x scripts/local-ci.sh ]]; then
            bash scripts/local-ci.sh
          elif [[ -x scripts/v1_local-ci.sh ]]; then
            bash scripts/v1_local-ci.sh
          elif [[ -x scripts/v2_v2_local-ci.sh ]]; then
            bash scripts/v2_v2_local-ci.sh
          else
            echo 'No repository-owned local CI entrypoint found'
            exit 1
          fi

      - name: Run Python tests without installation
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q

      - name: Check Node bridge syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then
            command -v node >/dev/null 2>&1 || { echo 'node is required'; exit 1; }
            node --check node-bridge/server.js
          else
            echo 'node-bridge/server.js not present; skipping Node syntax check'
          fi

      - name: Check frontend ownership contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then
            command -v node >/dev/null 2>&1 || { echo 'node is required'; exit 1; }
            node frontend/scripts/test-sghv119-ownership.js
          else
            echo 'frontend ownership test unavailable; failing closed'
            exit 1
          fi
