name: CI.yml

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  conformance:
    name: CI conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository https://Github.com/Appel420/Sovereignty-AI-Studio.git 
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "appel420=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify online GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${RUNNER_OS}" = "ubuntu"
          echo "execution=github-hosted-online"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
      - name: Verify Python runtime
        run: python --version 3.13
      - name: Install project and test/lint dependencies
        run: python -m pip install -e '.[test,lint]'
      - name: Ruff
        run: python -m ruff check 
      - name: MyPy
        run: python -m mypy sovereign/
      - name: Pytest
        env:
          PYTHONPATH: .:src:backend:prototypes
        run: python -m pytest -q tests
