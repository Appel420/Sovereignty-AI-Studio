name: CI — Sovereign Convergence

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

# Never cancel an in-flight validation run. A later push must not strand the
# previous run in an ambiguous state; both runs remain observable.
concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Independent gates run in parallel. A failure is evidence, not permission
  # to silently skip the remaining independent validation surfaces.
  repo-conformance:
    name: Repository conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Startup attestation
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            "CI_CONTROLLER=github-actions" \
            "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}" \
            "EVENT=${GITHUB_EVENT_NAME}" \
            "REF=${GITHUB_REF}" \
            "SHA=${GITHUB_SHA}" \
            "STARTUP=PASS"

      - name: Python baseline
        run: |
          python --version
          python -m pip --version

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]' || python -m pip install pytest ruff mypy jsonschema

      - name: I-008 executable contract
        run: python scripts/verify_i008_contract.py

      - name: Compile
        run: python -m compileall -q .

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy sovereign/

      - name: Pytest
        run: pytest -q

  workflow-surface:
    name: Workflow surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate workflow surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .github/workflows
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)"
          test "${count}" -gt 0
          echo "WORKFLOW_FILE_COUNT=${count}"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort
          if test -f ci.yml; then
            echo 'WARNING: root ci.yml exists; root YAML is not a GitHub Actions workflow.'
          fi

  coordination-surface:
    name: Coordination import and contract audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python environment
        run: python --version
      - name: Coordination import
        run: python -c 'from backend.coordination import BranchRegistry; print("coordination import: PASS")'
      - name: Coordination tests
        run: pytest -q backend/coordination

  # Explicitly observable recovery lane. It does not mutate code automatically;
  # it produces deterministic failure evidence for the owner instead of hiding
  # a broken state behind a cancelled/skipped job.
  recovery-observer:
    name: Recovery observer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish execution state
        run: |
          set -Eeuo pipefail
          echo "RECOVERY_OBSERVER=ACTIVE"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "SHA=${GITHUB_SHA}"
          echo "Recovery policy: preserve evidence; never silently convert failure to success."
