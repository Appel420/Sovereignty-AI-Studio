name: ci.yml

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

concurrency:
  group: sovereign-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .:./backend

jobs:
  repo-conformance:
    name: Repository conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository at exact commit
        env: { GH_TOKEN: ${{ github.token }} }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Diamond Core lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile --manifest-path diamond-core/Cargo.toml
          test -s diamond-core/Cargo.lock
      - name: Diamond Core contract gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path diamond-core/Cargo.toml --all-targets --locked
      - name: Python baseline
        run: |
          python --version
          python -m pip --version
      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'
          python -m pip install pip-audit==2.9.0
          python -m pip check
      - name: Dependency vulnerability gate
        run: pip-audit --strict
      - name: I-008 executable contract
        run: python scripts/verify_i008_contract.py
      - name: Compile
        run: python -m compileall -q .
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy sovereign/
      - name: Pytest
        run: pytest -q

  workflow-surface:
    name: Workflow surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository at exact commit
        env: { GH_TOKEN: ${{ github.token }} }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Enumerate workflow surface
        run: |
          set -Eeuo pipefail
          test -d .github/workflows
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)"
          test "$count" -gt 0
          echo "WORKFLOW_FILE_COUNT=$count"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort

  coordination-surface:
    name: Coordination import and contract audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository at exact commit
        env: { GH_TOKEN: ${{ github.token }} }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install coordination test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip check
      - name: Coordination import
        run: python -c 'from backend.coordination import BranchRegistry; print("coordination import: PASS")'
      - name: Coordination tests
        run: python -m pytest -q backend/coordination

  recovery-observer:
    name: Recovery observer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository at exact commit
        env: { GH_TOKEN: ${{ github.token }} }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Publish execution state
        run: |
          set -Eeuo pipefail
          echo "RECOVERY_OBSERVER=ACTIVE"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "SHA=${GITHUB_SHA}"
          echo "Recovery policy: preserve evidence; never silently convert failure to success."
