name: CI

on:
  push:
    branches: ["all"]
  pull_request:
    branches: ["all"]
  workflow_dispatch:

# Preserve every run. Do not let a later push replace a prior run.
concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conformance:
    name: GitHub CI
    # These are three independent runner labels. The previous configuration
    # supplied one literal label containing commas/spaces, so matching could
    # never occur unless a runner had that exact custom label.
    runs-on: self-hosted, linux arm64
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify runner execution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "CI controller: GitHub Actions"
          echo "Execution mode: sovereign self-hosted"
          echo "Actual runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Runner name: ${RUNNER_NAME}"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip check
          python - <<'PY'
          import nacl
          print('PyNaCl:', nacl.__version__)
          PY

      - name: Python lint diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d sovereign ]]; then ruff check sovereign; fi
          if [[ -d backend ]]; then ruff check backend; fi

      - name: Python tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then python -m pytest -q tests; fi

      - name: Phase 0 Rust tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then
            command -v cargo >/dev/null 2>&1
            cargo test --manifest-path phase0/Cargo.toml
          else
            echo 'phase0/Cargo.toml not present; skipping Phase 0 Rust tests'
          fi

      - name: Node syntax check
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then
            command -v node >/dev/null 2>&1
            node --check node-bridge/server.js
          fi

      - name: Frontend ownership contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then
            command -v node >/dev/null 2>&1
            node frontend/scripts/test-sghv119-ownership.js
          fi
