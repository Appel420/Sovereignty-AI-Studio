name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python CI (self-hosted ARM64)
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify local runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "SELF_HOSTED_RUNNER=${RUNNER_NAME}"
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"

      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install project test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --no-cache-dir -e ".[test]"
          python -m pip install --no-cache-dir ruff pytest

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check .; fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: python -m pytest -q

      - name: Coordination import check
        shell: bash
        run: |
          python -c "from backend.coordination import branch_registry; print('Coordination import: ok')"
