name: CI

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  startup:
    name: CI startup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify GitHub-hosted runtime
        run: |
          test "${GITHUB_ACTIONS}" = "true"
          test "${RUNNER_OS}" = "Linux"
          python --version
          echo "execution=github-hosted-online"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install lint dependencies
        run: python -m pip install -e '.[lint]'
      - name: Ruff
        run: python -m ruff check .

  mypy:
    name: MyPy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install lint dependencies
        run: python -m pip install -e '.[lint]'
      - name: MyPy
        run: python -m mypy sovereign/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Pytest
        env:
          PYTHONPATH: .:src:backend:prototypes
        run: python -m pytest -q tests
