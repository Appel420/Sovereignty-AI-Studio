name: Python Test Gate

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "pytest.ini"
      - "tests/**"
      - "app/**"
      - "backend/**"
      - "apps/**"
      - "errors/**"
      - "helpers/**"
      - "fixers/**"
      - "watchers/**"
      - ".github/workflows/Quart.yml"
  pull_request:
    branches: [Collaboration]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "pytest.ini"
      - "tests/**"
      - "app/**"
      - "backend/**"
      - "apps/**"
      - "errors/**"
      - "helpers/**"
      - "fixers/**"
      - "watchers/**"
      - ".github/workflows/Quart.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./src:./prototypes

jobs:
  test:
    name: Python dependency + test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip check

      - name: Verify required imports
        run: |
          python - <<'PY'
          from quart import Quart
          from fastapi import FastAPI
          from nacl.signing import SigningKey
          from jose import jwt
          from pydantic import BaseModel
          assert Quart("smoke") is not None
          assert FastAPI() is not None
          assert SigningKey.generate() is not None
          assert jwt is not None
          assert BaseModel is not None
          print("REQUIRED_IMPORTS=PASS")
          PY

      - name: Verify pytest asyncio configuration
        run: python -m pytest --trace-config --collect-only -q

      - name: Run complete Python test suite
        run: python -m pytest -q
