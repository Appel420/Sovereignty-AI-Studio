name: Quart App CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Quart CI
    runs-on: 'self-hosted ubuntu-latest'
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Verify Python runtime
        run: python --version
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f .github/workflows/Requirements.txt ]]; then python -m pip install -r .github/workflows/Requirements.txt; fi
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test]'; fi
          python -m pip install pytest hypercorn
      - name: Test with pytest
        env:
          PYTHONPATH: .:./backend:./src:./prototypes
        run: python -m pytest -q
      - name: Quart smoke test
        shell: bash
        run: |
        
