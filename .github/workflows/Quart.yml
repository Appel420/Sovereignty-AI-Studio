name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
    paths:
      - ".github/workflows/Quart.yml"
      - ".github/workflows/Requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.py"
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
    paths:
      - ".github/workflows/Quart.yml"
      - ".github/workflows/Requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.py"

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  build:
    name: Quart CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test]' || true; fi
      - name: Validate package metadata
        run: python -m pip check
      - name: Test with pytest
        run: python -m pytest -q
      - name: Quart import smoke test
        run: |
          python - <<'PY'
          from quart import Quart
          app = Quart("ci-smoke")
          assert app is not None
          print("Quart import and application construction: OK")
          PY
