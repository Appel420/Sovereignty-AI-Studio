name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, ara-hardened]
  pull_request:
    branches: [Collaboration, ara-hardened]

permissions:
  contents: read

concurrency:
  group: quart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip
          if [ -f .github/workflows/Requirements.txt ]; then
            python3 -m pip install --no-cache-dir -r .github/workflows/Requirements.txt
          fi
          python3 -m pip install --no-cache-dir pytest hypercorn
          if [ -f requirements.txt ]; then
            python3 -m pip install --no-cache-dir -r requirements.txt || true
          fi

      - name: Test with pytest
        env:
          PYTHONPATH: .:./backend
        run: |
          set -Eeuo pipefail
          pytest -q || true

      - name: Run Quart App for local smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f weather_dashboard.py ] || [ -f weather_dashboard ]; then
            hypercorn weather_dashboard:app --bind 127.0.0.1:8000 &
            APP_PID=$!
            trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
            sleep 5
            kill -0 "$APP_PID" || true
            curl -f http://127.0.0.1:8000/api/weather?city=London || true
          else
            echo "No weather_dashboard found — smoke test skipped"
          fi
