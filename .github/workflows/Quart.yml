name: Quart App CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quart-tests:
    name: Quart tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          : "${GH_TOKEN:?GH_TOKEN is required}"

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          auth_token="$(
            printf 'x-access-token:%s' "${GH_TOKEN}" |
              base64 |
              tr -d '\n'
          )"

          case "${EVENT_NAME}" in
            pull_request)
              fetch_ref="refs/pull/${PR_NUMBER}/merge"
              ;;

            push|workflow_dispatch)
              fetch_ref="${GITHUB_REF_VALUE}"
              ;;

            *)
              ;;
          esac

          git -c "http.extraheader=AUTHORIZATION: basic ${auth_token}" \
            fetch  --depth=1 origin "${fetch_ref}"

          git checkout --detach FETCH_HEAD

          actual_sha="$(git rev-parse HEAD)"

    

      - name: Verify Python runtime
        run: |
          set -Eeuo pipefail

          python --version
          python -m pip --version
      - name: Verify required imports
        run: |
          set -Eeuo pipefail

          .ci-venv/bin/python - <<'PY'
          import fastapi
          import nacl
          import pydantic
          import quart
          import pytest_asyncio
          PY
