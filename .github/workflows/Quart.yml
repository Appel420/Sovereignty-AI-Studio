name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
    paths:
      - ".github/workflows/Quart.yml"
      - ".github/workflows/Requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.py"
  pull_request:
    branches: [Collaboration]
    paths:
      - ".github/workflows/Quart.yml"
      - ".github/workflows/Requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.py"

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./src:./prototypes

jobs:
  build:
    name: Quart CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .github/workflows/Requirements.txt
            pyproject.toml
            requirements*.txt

      - name: Verify Python runtime
        run: python --version

      - name: Install authoritative test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          python -m pip install -e '.[test]'
          python -m pip check

      - name: Verify required imports before pytest
        run: |
          python - <<'PY'
          import fastapi
          import jose
          import nacl
          import pydantic
          import quart
          import pytest_asyncio
          print("Required Python imports: PASS")
          PY

      - name: Test with pytest
        run: python -m pytest -q

      - name: Quart import smoke test
        run: |
          python - <<'PY'
          from quart import Quart
          app = Quart("ci-smoke")
          assert app is not None
          print("Quart import and application construction: PASS")
          PY
