name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [ main, Collaboration ]
  pull_request:
    branches: [ main, Collaboration ]

permissions:
  contents: read

concurrency:
  group: quart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: self-hosted 
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install pytest hypercorn
      - name: Test with pytest
        env:
          PYTHONPATH: .:./backend
        run: pytest -q
      - name: Run Quart App for local smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          hypercorn weather_dashboard:app --bind 127.0.0.1:8001 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$APP_PID"
          curl -f http://127.0.0.1:[*]/api/weather?city=London
