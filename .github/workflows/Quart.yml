name: Quart App CI

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: quart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    # Owner policy: self-hosted Linux ARM64 only. No GitHub-hosted runners.
    runs-on: ['self-hosted Linux arm64']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        pip install -r .github/workflows/Requirements.txt
    - name: Test with pytest
      env:
        PYTHONPATH: .:./backend
      run: |
        pip install pytest
        pytest
    - name: Run Quart App for Testing
      run: |
        pip install hypercorn
        hypercorn weather_dashboard:app --bind 127.0.0.1:8001 &
        APP_PID=$!
        echo "Started hypercorn with PID: $APP_PID"
        sleep 5
        if ! kill -0 $APP_PID 2>/dev/null; then
          echo "Error: Hypercorn process failed to start"
          exit 1
        fi
        curl -f http://127.0.0.1:8001/api/weather?city=London || exit 1
        kill $APP_PID
