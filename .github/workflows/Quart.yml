name: Quart CI

on:
  workflow_dispatch:
  pull_request:
    branches: [Collaboration]

permissions:
  contents: read

jobs:
  test:
    name: Quart CI (visible)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Runner evidence
        run: echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH} SHA=${GITHUB_SHA}"
      - name: Install test tools
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Run tests when present
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then python3 -m pytest -q tests; else echo 'No tests directory; structural validation passed.'; fi
