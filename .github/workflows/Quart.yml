name: Quart App CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quart tests (manual)
    runs-on: [self-hosted, linux arm64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify Python runtime
        run: |
          python --version
          python -m pip --version
      - name: Create isolated environment
        run: |
          set -Eeuo pipefail
          rm -rf .ci-venv
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .ci-venv/bin/python -m pip install --disable-pip-version-check -e ".[test]"
          .ci-venv/bin/python -m pip check
      - name: Python syntax gate
        run: .ci-venv/bin/python -m compileall -q backend apps scripts tests
      - name: Test collection gate
        run: .ci-venv/bin/python -m pytest --collect-only -q tests
      - name: Test suite
        run: .ci-venv/bin/python -m pytest -q tests
