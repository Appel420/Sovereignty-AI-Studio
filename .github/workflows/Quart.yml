name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quart-tests:
    name: Quart tests
    runs-on: self-hosted

    steps:
      - name: Checkout repository without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          : "${GH_TOKEN:?GH_TOKEN is required}"

          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          auth_token="$(
            printf 'x-access-token:%s' "${GH_TOKEN}" |
              base64 |
              tr -d '\n'
          )"

          case "${EVENT_NAME}" in
            pull_request)
              fetch_ref="refs/pull/${PR_NUMBER}/merge"
              ;;

            push|workflow_dispatch)
              fetch_ref="${GITHUB_REF_VALUE}"
              ;;

            *)
              echo "ERROR: unsupported GitHub event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          git -c "http.extraheader=AUTHORIZATION: basic ${auth_token}" \
            fetch --no-tags --depth=1 origin "${fetch_ref}"

          git checkout --detach FETCH_HEAD

          actual_sha="$(git rev-parse HEAD)"

          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "ERROR: checked out SHA does not match GitHub SHA" >&2
            echo "Expected: ${EXPECTED_SHA}" >&2
            echo "Actual:   ${actual_sha}" >&2
            exit 1
          fi

      - name: Verify Python runtime
        run: |
          set -Eeuo pipefail

          python --version
          python -m pip --version

      - name: Create isolated environment
        run: |
          set -Eeuo pipefail

          rm -rf .ci-venv
          python -m venv .ci-venv

          .ci-venv/bin/python -m pip install --upgrade pip

          .ci-venv/bin/python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

          .ci-venv/bin/python -m pip install \
            --disable-pip-version-check \
            -e ".[test]"

          .ci-venv/bin/python -m pip check

      - name: Verify required imports
        run: |
          set -Eeuo pipefail

          .ci-venv/bin/python - <<'PY'
          import fastapi
          import nacl
          import pydantic
          import quart
          import pytest_asyncio
          PY
