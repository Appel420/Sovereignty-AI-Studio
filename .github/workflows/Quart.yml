name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
permissions:
  contents: read

jobs:
  test:
    name: Quart tests
    runs-on: ubuntu-latest
    steps:
      - name: Prove runner alive
        run: |
          echo "RUNNER_ALIVE=1"
          echo "SHA=${GITHUB_SHA}"
          uname -a
          python3 --version
      - name: Checkout with token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "CHECKOUT_OK"
      - name: Python baseline
        run: |
          python3 --version
          python3 -m pip --version
