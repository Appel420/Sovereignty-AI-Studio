name: Quart Sovereign Build

on:
  push:
    branches: [Collaboration, main, GPT/Codex]
  pull_request:
    branches: [Collaboration, main, GPT/Codex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quart-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  quart:
    name: Quart CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without third-party Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [[ -f .github/workflows/Requirements.txt ]]; then python3 -m pip install -r .github/workflows/Requirements.txt; fi
          if [[ -f pyproject.toml ]]; then python3 -m pip install -e '.[test]' || python3 -m pip install -e .; fi
          python3 -m pip install pytest hypercorn
          python3 -m pip check

      - name: Run pytest
        env:
          PYTHONPATH: .:./backend:./src:./prototypes
        run: python3 -m pytest -q

      - name: Quart smoke test
        run: |
          if [[ -f weather_dashboard.py ]]; then
            hypercorn weather_dashboard:app --bind 127.0.0.1:8001 &
            APP_PID=$!
            trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
            sleep 5
            kill -0 "$APP_PID"
            curl --fail --silent --show-error 'http://127.0.0.1:8001/api/weather?city=London'
          else
            echo 'weather_dashboard.py not present; Quart application smoke test not applicable'
          fi
