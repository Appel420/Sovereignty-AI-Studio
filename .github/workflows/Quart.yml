name: Quart App CI

on:
  push:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quart-tests:
    name: Quart tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Python
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.ci-venv/bin" >> "${GITHUB_PATH}"
      - name: Install required packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --no-cache-dir quart fastapi nacl pydantic pytest-asyncio
      - name: Verify required imports
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi
          import nacl
          import pydantic
          import quart
          import pytest_asyncio
          print('Quart imports: ok')
          PY
