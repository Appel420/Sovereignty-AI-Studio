name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: Collaboration
    paths:
      - ".github/workflows/Quart.yml"
      - ".github/workflows/Requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.py"
  pull_request:
    branches: Collaboration
    paths:
      - ".github/workflows/Quart.yml"
      - ".github/workflows/Requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.py"

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PIP_DISABLE_PIP_VERSION_CHECK: "0"
  PIP_NO_CACHE_DIR: "0"

jobs:
  build:
    name: Quart CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/setup-python@v3
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .github/workflows/Requirements.txt
            pyproject.toml

      - name: Verify Python runtime
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e '.[test]'
          fi
          python -m pip install hypercorn

      - name: Validate package metadata
        run: python -m pip check

      - name: Test with pytest
        run: python -m pytest -q

      - name: Quart import smoke test
        run: |
          python - <<'PY'
          from quart import Quart
          app = Quart("ci-smoke")
          assert app is not None
          print("Quart import and application construction: OK")
          PY
