name: Quart.yml

on:
  push:
    branches: [ "Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420" ]
  pull_request:
    branches: [ "Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quart-tests:
    name: Quart tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.ci-venv/bin" >> "${GITHUB_PATH}"

      - name: Install required packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --no-cache-dir quart fastapi nacl pydantic pytest-asyncio

      - name: Verify required imports
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi
          import nacl
          import pydantic
          import quart
          import pytest_asyncio
          print('Quart imports: ok')
          PY
