name: Quart App CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Quart CI
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f .github/workflows/Requirements.txt ]]; then python -m pip install -r .github/workflows/Requirements.txt; fi
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test]'; fi
          python -m pip install pytest hypercorn
      - name: Test with pytest
        env:
          PYTHONPATH: .:./backend:./src:./prototypes
        run: python -m pytest -q
      - name: Quart smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f weather_dashboard.py ]]; then
            hypercorn weather_dashboard:app --bind 127.0.0.1:8001 &
            APP_PID=$!
            trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
            sleep 5
            kill -0 "$APP_PID"
            curl -f 'http://127.0.0.1:8001/api/weather?city=London'
          else
            echo 'weather_dashboard.py not present; skipping Quart smoke test'
          fi
