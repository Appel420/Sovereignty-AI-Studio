name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quart tests (self-hosted)
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify local runner
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Install project dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
      - name: Prove Quart runtime
        run: |
          python3 - <<'PY'
          from apps.dashboards.weather_dashboard import app
          client = app.test_client()
          assert app is not None and client is not None
          print('QUART_IMPORT=PASS')
          PY
