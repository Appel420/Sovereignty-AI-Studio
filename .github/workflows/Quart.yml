name: Quart App CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
    paths:
      - '.github/workflows/Quart.yml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '**/*.py'
  pull_request:
    branches: [Collaboration]
    paths:
      - '.github/workflows/Quart.yml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '**/*.py'

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  build:
    name: Quart CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Python runtime
        run: |
          python --version
          python -m pip --version

      - name: Install declared runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Verify dependency closure
        run: python -m pip check

      - name: Verify required imports before pytest
        run: |
          python - <<'PY'
          import fastapi
          import nacl
          import pydantic
          import jose
          import quart
          import pytest_asyncio
          print('fastapi', fastapi.__version__)
          print('nacl', nacl.__version__)
          print('pydantic', pydantic.__version__)
          print('quart', quart.__version__)
          print('pytest-asyncio import: OK')
          print('required dependency closure: OK')
          PY

      - name: Python syntax gate
        run: python -m compileall -q backend apps scripts tests

      - name: Test collection gate
        run: python -m pytest --collect-only -q tests

      - name: Test suite
        run: python -m pytest -q tests

      - name: Quart application smoke test
        run: |
          python - <<'PY'
          from apps.dashboards.weather_dashboard import app
          client = app.test_client()
          print('Quart application import: OK')
          PY
