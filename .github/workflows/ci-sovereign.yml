name: CI — Sovereign Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Sovereign CI
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 30
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify sovereign runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Execution mode: sovereign self-hosted online"
          echo "Actual runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Commit: ${GITHUB_SHA}"
      - name: Verify Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python --version
          python -m pip --version
      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[test,lint]'
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip check
      - name: Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: python -m pytest -q tests
      - name: Phase 0 Rust tests
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then
            cargo test --manifest-path phase0/Cargo.toml
          else
            echo 'phase0/Cargo.toml not present; skipping Phase 0 Rust tests'
          fi
      - name: Node syntax check
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi
      - name: Frontend ownership contract
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; fi
