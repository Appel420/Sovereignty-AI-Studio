name: CI — Sovereign Device Validation

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, fix/ci-dep-health-pqc]
    paths:
      - '.github/workflows/ci-sovereign.yml'
      - 'backend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  conformance:
    name: Sovereign Device Validation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, arm64]
            label: arm64-self-hosted
          - runner: ubuntu-latest
            label: ubuntu-fallback
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Diagnose runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test -n "${GITHUB_SHA:-}"
          echo "RUNNER_LABEL=${{ matrix.label }}"
          echo "RUNNER=${RUNNER_NAME:-github-hosted}/${RUNNER_OS}/${RUNNER_ARCH}"
          echo "SCAR_JOB=ci-sovereign"
          echo "SCAR_RUNNER_LABEL=${{ matrix.label }}"

      - name: Verify Python runtime
        run: python3 --version

      - name: Install canonical dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python3 -m pip install --disable-pip-version-check -r requirements.txt
          fi
          python3 -m pip install --disable-pip-version-check -e '.[test,lint]' || python3 -m pip install pytest ruff
          python3 -m pip check || true

      - name: Python syntax gate
        run: |
          set -Eeuo pipefail
          targets=()
          for d in backend apps scripts tests; do
            [[ -d "$d" ]] && targets+=("$d")
          done
          if (( ${#targets[@]} )); then
            python3 -m compileall -q "${targets[@]}"
          else
            echo "SCAR_STATUS=SKIP"
            echo "SCAR_REASON=no compile targets"
            exit 0
          fi

      - name: I-008 executable gate (if present)
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/verify_i008_contract.py ]]; then
            python3 scripts/verify_i008_contract.py
          else
            echo "SCAR_STATUS=SKIP"
            echo "SCAR_REASON=verify_i008_contract.py missing"
          fi
          if [[ -f backend/coordination/test_i008_transparency.py ]]; then
            python3 -m pytest -q backend/coordination/test_i008_transparency.py
          fi

      - name: Test collection gate
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then
            python3 -m pytest --collect-only -q tests
          else
            echo "SCAR_STATUS=SKIP"
            echo "SCAR_REASON=tests/ missing"
          fi

      - name: Python test suite
        run: |
          set -Eeuo pipefail
          if [[ -d tests ]]; then
            python3 -m pytest -q tests
            echo "SCAR_STATUS=PASS"
          else
            echo "SCAR_STATUS=SKIP"
          fi
