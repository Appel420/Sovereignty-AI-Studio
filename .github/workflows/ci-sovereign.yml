name: CI — Sovereign Runner

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

permissions:
  contents: read

jobs:
  conformance:
    name: Sovereign CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -Eeuo pipefail
          git init .; git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"; git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"; git checkout --detach FETCH_HEAD
      - name: Verify runner
        run: |
          test "${GITHUB_ACTIONS}" = true
          test -n "${GITHUB_SHA}"
          echo "Execution mode: sovereign validation"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        env:
          PYTHONPATH: .:./src:./backend:./prototypes
        run: python -m pytest -q tests
      - name: Node syntax
        run: if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi
      - name: Frontend ownership contract
        run: if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; fi
