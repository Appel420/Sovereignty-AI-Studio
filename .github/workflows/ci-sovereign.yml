name: CI — Sovereign Device Validation

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]

permissions:
  contents: read

concurrency:
  group: sovereign-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Sovereign Device Validation (self-hosted)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Diagnose runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test -n "${GITHUB_SHA:-}"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Verify Python runtime
        run: python3 --version
      - name: Install canonical dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check -e '.[test,lint]'
          python3 -m pip check
      - name: Python syntax gate
        run: python3 -m compileall -q backend apps scripts tests
      - name: I-008 executable gate
        run: |
          python3 scripts/verify_i008_contract.py
          python3 -m pytest -q backend/coordination/test_i008_transparency.py
      - name: Test collection gate
        run: python3 -m pytest --collect-only -q tests
      - name: Python test suite
        run: python3 -m pytest -q tests
      - name: Quart application smoke test
        run: |
          python3 - <<'PY'
          from apps.dashboards.weather_dashboard import app
          client = app.test_client()
          assert app is not None and client is not None
          print('Quart application import and test client: PASS')
          PY
      - name: Phase 0 Rust tests
        run: if [[ -f phase0/Cargo.toml ]]; then cargo test --manifest-path phase0/Cargo.toml; else echo 'Phase 0 Rust tests: NOT APPLICABLE'; fi
      - name: Diamond Core contract tests
        run: if [[ -f diamond-core/Cargo.toml ]]; then cargo test --manifest-path diamond-core/Cargo.toml --all-targets; else echo 'Diamond Core: NOT APPLICABLE'; fi
      - name: Node syntax check
        run: if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; else echo 'Node bridge: NOT APPLICABLE'; fi
      - name: Sovereign certification marker
        run: |
          echo 'SOVEREIGN_DEVICE_VALIDATION=PASS'
          echo "Validated commit: ${GITHUB_SHA}"
