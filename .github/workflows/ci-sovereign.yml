name: CI — Sovereign Device Validation

# This workflow is the device-local sovereign validation lane.
# It MUST NOT gate the live online repository CI. The owner's device owns
# LOCAL / OFFLINE / HYBRID execution; GitHub-hosted CI owns the live ONLINE
# repository health signal.
on:
  workflow_dispatch:

permissions:
  contents: read

# A device validation run is never canceled by a newer dispatch.
concurrency:
  group: sovereign-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Sovereign Device Validation
    # Explicitly target the owner's registered sovereign ARM64 device runner.
    # This lane is manual/device validation and is intentionally independent
    # from the online CI required to keep the repository continuously green.
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Diagnose and attest sovereign device runner
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_os="${RUNNER_OS:-}"
          actual_arch="${RUNNER_ARCH:-}"
          kernel_arch="$(uname -m)"
          printf 'GITHUB_ACTIONS=%q\n' "${GITHUB_ACTIONS:-}"
          printf 'GITHUB_SHA=%q\n' "${GITHUB_SHA:-}"
          printf 'RUNNER_OS=%q\n' "${actual_os}"
          printf 'RUNNER_ARCH=%q\n' "${actual_arch}"
          printf 'uname -m=%q\n' "${kernel_arch}"
          printf 'RUNNER_NAME=%q\n' "${RUNNER_NAME:-}"
          printf 'RUNNER_LABELS=%q\n' "${RUNNER_LABELS:-<not-exposed>}"
          test "${GITHUB_ACTIONS:-}" = "true" || { echo 'FAIL: not executing inside GitHub Actions'; exit 1; }
          test -n "${GITHUB_SHA:-}" || { echo 'FAIL: GITHUB_SHA is empty'; exit 1; }
          test "${actual_os}" = "Linux" || { echo "FAIL: expected Linux, got ${actual_os}"; exit 1; }
          test "${actual_arch}" = "ARM64" || { echo "FAIL: runner architecture mismatch: ${actual_arch}; expected ARM64"; exit 1; }
          test "${kernel_arch}" = "aarch64" || { echo "FAIL: kernel architecture=${kernel_arch}; expected aarch64"; exit 1; }
          echo 'SOVEREIGN_DEVICE_RUNNER_ATTESTATION=PASS'
          echo "Actual runner: ${actual_os}/${actual_arch} (${kernel_arch})"
          echo "Commit: ${GITHUB_SHA}"

      - name: Verify Python runtime
        run: |
          python --version
          python -m pip --version

      - name: Install canonical repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -e '.[test,lint]'
          python -m pip check

      - name: Verify canonical imports and versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import fastapi, nacl, pydantic, jose, quart, pytest, pytest_asyncio
          expected = {'fastapi': '0.139.2', 'PyNaCl': '1.6.2', 'pydantic': '2.13.4', 'python-jose': '3.5.0', 'quart': '0.20.0'}
          for package, required in expected.items():
              actual = version(package)
              print(f'{package}: {actual}')
              assert actual == required, f'{package}: expected {required}, got {actual}'
          print('canonical dependency closure: PASS')
          PY

      - name: Python syntax gate
        run: python -m compileall -q backend apps scripts tests

      - name: I-008 contract gate
        run: python scripts/verify_i008_contract.py

      - name: Test collection gate
        run: python -m pytest --collect-only -q tests

      - name: Python test suite
        run: python -m pytest -q tests

      - name: Quart application smoke test
        run: |
          python - <<'PY'
          from apps.dashboards.weather_dashboard import app
          client = app.test_client()
          assert app is not None
          assert client is not None
          print('Quart application import and test client: PASS')
          PY

      - name: Phase 0 Rust tests
        run: |
          if [[ -f phase0/Cargo.toml ]]; then cargo test --manifest-path phase0/Cargo.toml; else echo 'Phase 0 Rust tests: NOT APPLICABLE'; fi

      - name: Node syntax check
        run: |
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; else echo 'Node bridge: NOT APPLICABLE'; fi

      - name: Frontend ownership contract
        run: |
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; else echo 'Frontend ownership contract: NOT APPLICABLE'; fi

      - name: Sovereign certification marker
        run: |
          echo 'SOVEREIGN_DEVICE_VALIDATION=PASS'
          echo "Validated commit: ${GITHUB_SHA}"
