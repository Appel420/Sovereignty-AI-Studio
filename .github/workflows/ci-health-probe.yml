name: CI Health Probe

on:
  push:
    branches: [Collaboration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: CI health probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove job execution
        run: |
          set -Eeuo pipefail
          echo "GitHub Actions job execution is alive"
          echo "repo=${GITHUB_REPOSITORY}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
