name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration]
    paths: ['.github/workflows/oauth-api-generator.yaml', 'scripts/**', 'config/**', 'tests/**', 'pyproject.toml', '.github/workflows/Requirements.txt']
  pull_request:
    branches: [Collaboration]
    paths: ['.github/workflows/oauth-api-generator.yaml', 'scripts/**', 'config/**', 'tests/**', 'pyproject.toml', '.github/workflows/Requirements.txt']
  workflow_dispatch:

permissions: {}

env:
  PYTHONPATH: .:./backend:./src:./prototypes

jobs:
  oauth-contract:
    name: OAUTH — hosted contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify hosted runner
        run: |
          test "${RUNNER_OS}" = Linux
          test -n "${GITHUB_SHA}"
      - name: Install project test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r .github/workflows/Requirements.txt
          python3 -m pip install -e '.[test]'
          python3 -m pip check
      - name: Validate canonical local OAuth
        run: python3 scripts/validate-local-oauth.py
      - name: OAuth generator contract tests
        run: python3 -m pytest -q tests/test_oauth_local_generator.py

  python-tests:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install project test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r .github/workflows/Requirements.txt
          python3 -m pip install -e '.[test]'
          python3 -m pip check
      - name: Verify required imports
        run: |
          python3 - <<'PY'
          import fastapi
          import jose
          import nacl
          import pydantic
          import quart
          import pytest_asyncio
          print('Required Python imports: PASS')
          PY
      - name: Test
        run: python3 -m pytest -q

  node-check:
    name: Node validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Node checks
        run: |
          test -f package.json
          node --check node-bridge/server.js
          npm --prefix node-bridge test

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install project test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r .github/workflows/Requirements.txt
          python3 -m pip install -e '.[test]'
          python3 -m pip check
      - name: Security policy contract
        run: |
          test -f scripts/security_policy_scan.py
          python3 -m pytest -q tests/contracts/security/test_security_policy_scan.py

  sovereign-handoff:
    name: Sovereign handoff
    needs: [oauth-contract, python-tests, node-check, security-scan]
    if: success()
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify sovereign runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Execution mode: sovereign self-hosted online"
          echo "Actual runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Commit: ${GITHUB_SHA}"
      - name: Verify Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python --version
          python -m pip --version
      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[test,lint]'
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip check
      - name: Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: python -m pytest -q tests
      - name: Phase 0 Rust tests
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then
            cargo test --manifest-path phase0/Cargo.toml
          else
            echo 'phase0/Cargo.toml not present; skipping Phase 0 Rust tests'
          fi
      - name: Node syntax check
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi
      - name: Frontend ownership contract
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; fi
