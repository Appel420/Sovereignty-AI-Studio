# =========================================================
# OAUTH API GENERATOR — CI/CD PIPELINE
# =========================================================
# Stable CI baseline: visible jobs, no hidden startup dependency,
# PR validation stays runnable, release/push packaging remains gated.
# Job-level event skips moved into steps so the graph stays visible.
# =========================================================
name: OAUTH-API-GENERATOR

on:
  push:
    branches: "Collaboration"
    paths:
      - '.github/workflows/oauth-api-generator.yaml'
      - '.github/workflows/Requirements.txt'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'package-lock.json'
      - 'package.json'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements*.txt'
      - '**/*.js'
      - '**/*.py'
  pull_request:
    branches: "Collaboration"
    paths:
      - '.github/workflows/oauth-api-generator.yaml'
      - '.github/workflows/Requirements.txt'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'package-lock.json'
      - 'package.json'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements*.txt'
      - '**/*.js'
      - '**/*.py'
  release:
    types: published
  workflow_dispatch:

permissions: {}

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Always-visible startup/run job.
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Startup
        run: |
          echo 'OAUTH-API-GENERATOR started'
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo 'Jobs: Run, build-test (3.11), build-test (3.12), node-check, build-sign, supply-chain, dependency-review, security-scan'
          test -f package.json
          test -f Dockerfile
          test -f .github/workflows/oauth-api-generator.yaml
          echo 'STARTUP=PASS'

  build-test:
    name: build-test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            .github/workflows/Requirements.txt
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
      - name: Lint
        run: python -m flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest --cov=apps --cov=backend --cov=src --cov-report=xml --cov-report=term --strict-markers -x --tb=short
      - name: Dependency audit (informational)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r .github/workflows/Requirements.txt || true
          if [[ -f requirements.txt ]]; then python -m pip_audit -r requirements.txt || true; fi
      - name: Upload coverage
        if: ${{ always() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  node-check:
    name: Node.js validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Node dependencies
        run: npm install --ignore-scripts
      - name: Node checks
        run: |
          npm run check
          node --check node-bridge/server.js
          if [[ -f unified_server.js ]]; then node --check unified_server.js; fi
      - name: Memory vault tests
        if: ${{ hashFiles('tests/test_sovereign_memory_vault.js') != '' }}
        run: npm run test:memory-vault

  # Packaging is intentionally skipped on pull requests, matching the old
  # visible check behavior. It runs only after validation on push/release/manual.
  build-sign:
    name: build-sign
    needs: [build-test, node-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Gate packaging to push/release/manual
        if: ${{ github.event_name != 'push' && github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Skipping build-sign on event=${GITHUB_EVENT_NAME}"
          exit 0
      - name: Compute image
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up QEMU
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Login GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes --fulcio-url https://fulcio.sigstore.dev --rekor-url https://rekor.sigstore.dev "${REGISTRY_LC}:${GITHUB_SHA}"

  supply-chain:
    name: supply-chain
    needs: build-sign
    if: ${{ needs.build-sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compute image
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json
          output-file: sbom-sovereignty-ai.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign attest --yes --predicate sbom-sovereignty-ai.json --type cyclonedx "${REGISTRY_LC}:${GITHUB_SHA}"
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-sovereignty-ai.json
          if-no-files-found: error

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
      - name: Skip dependency review
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Skipping dependency-review on event=${GITHUB_EVENT_NAME}"

  security-scan:
    name: security-scan
    needs: [build-test, node-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Report upstream results
        run: |
          echo "build-test=${{ needs.build-test.result }}"
          echo "node-check=${{ needs.node-check.result }}"
      - name: Trivy filesystem scan (informational)
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: false
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 0
      - name: Python dependency audit (informational)
        continue-on-error: false
        run: |
          python -m pip install pip-audit
          if [[ -f requirements.txt ]]; then python -m pip_audit -r requirements.txt; fi
