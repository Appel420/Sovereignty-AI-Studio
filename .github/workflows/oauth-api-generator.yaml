name: OAUTH-API-GENERATOR

on:
  push:
    branches: "**"
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yaml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  pull_request:
    branches: "**"
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yaml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash  -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./src:./prototypes
jobs:
  build-test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: ubuntu
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            .github/workflows/Requirements.txt
            pyproject.toml

      - name: Install project and CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e '.[test]'
          fi

      - name: Lint with flake8
        run: python -m flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        run: python -m pytest --cov=apps --cov=backend --cov=src --cov-report=term --strict-markers -x --tb=short

      - name: Python dependency audit
        run: |
          python -m pip_audit -r .github/workflows/Requirements.txt
          if [[ -f requirements.txt ]]; then
            python -m pip_audit -r requirements.txt
          fi

  node-check:
    name: Node.js validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install Node dependencies
        run: npm ci 
      - name: Node syntax and project checks
        run: |
          npm run check
          node --check node-bridge/server.js

  build-sign:
    name: Build and sign container
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/Collaboration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SHAMIR release-share secrets
        if: github.event_name == 'release'
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1 }}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2 }}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3 }}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_1:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_2:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_3:-}"
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Compute lowercase image name
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${{ env.REGISTRY_LC }}":"${{ github.sha }}"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  security-scan:
    name: Security scan
    needs: [build-test, node-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          hide-progress: false
          exit-code: 0

      - name: Audit requirements.txt when present
        run: |
          python -m pip install --upgrade pip-audit
          if [[ -f requirements.txt ]]; then
            python -m pip_audit -r requirements.txt
          else
            echo "No root requirements.txt; dependency audit already ran against the CI requirements."
          fi
