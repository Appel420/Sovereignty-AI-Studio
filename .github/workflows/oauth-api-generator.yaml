concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:

        
    shell: bash  -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./src:./prototypes

    shell: bash -euo pipefail {0}

