name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration]
    paths:
      - '.github/workflows/oauth-api-generator.yaml'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
  pull_request:
    branches: [Collaboration]
    paths:
      - '.github/workflows/oauth-api-generator.yaml'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  oauth-contract:
    name: OAUTH — local contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install declared dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify dependency closure
        run: python3 -m pip check
      - name: Validate canonical local OAuth
        run: python3 scripts/validate-local-oauth.py
      - name: OAuth contract test collection
        run: python3 -m pytest --collect-only -q tests/test_oauth_local_generator.py tests/test_oauth_local_generator_security.py
      - name: OAuth generator contract tests
        run: python3 -m pytest -q tests/test_oauth_local_generator.py tests/test_oauth_local_generator_security.py

  python-tests:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install declared dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify dependency closure
        run: python3 -m pip check
      - name: Test collection gate
        run: python3 -m pytest --collect-only -q
      - name: Test
        run: python3 -m pytest -q

  node-check:
    name: Node validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Node checks
        run: |
          test -f package.json
          node --check node-bridge/server.js

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install declared dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          python3 -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify dependency closure
        run: python3 -m pip check
      - name: Security policy contract
        run: |
          test -f scripts/security_policy_scan.py
          python3 -m pytest -q tests/contracts/security/test_security_policy_scan.py

  sovereign-handoff:
    name: Sovereign handoff
    needs: [oauth-contract, python-tests, node-check, security-scan]
    if: success()
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify sovereign runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Execution mode: sovereign self-hosted online"
          echo "Actual runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Commit: ${GITHUB_SHA}"
      - name: Verify Python runtime
        run: |
          python --version
          python -m pip --version
      - name: Install declared dependencies
        run: |
          python -m pip install -e '.[test,lint]'
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Python test collection gate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: python -m pytest --collect-only -q tests
      - name: Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: python -m pytest -q tests
      - name: Phase 0 Rust tests
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then cargo test --manifest-path phase0/Cargo.toml; else echo 'No Phase 0 Rust workspace'; fi
      - name: Node syntax check
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; else echo 'No node-bridge/server.js'; fi
      - name: Frontend ownership contract
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; else echo 'No frontend ownership contract'; fi
