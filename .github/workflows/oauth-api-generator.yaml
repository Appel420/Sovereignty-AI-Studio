name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration, main]
    paths: ['.github/workflows/oauth-api-generator.yaml', 'scripts/**', 'config/**', 'tests/**', 'pyproject.toml']
  pull_request:
    branches: [Collaboration, main]
    paths: ['.github/workflows/oauth-api-generator.yaml', 'scripts/**', 'config/**', 'tests/**', 'pyproject.toml']
  workflow_dispatch:

permissions: {}

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PIP_NO_INDEX: '0'
  PIP_NO_INPUT: '0'
  PIP_DISABLE_PIP_VERSION_CHECK: '0'

jobs:
  oauth-contract:
    name: OAUTH — local contract
    runs-on: self-hosted, ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify ARM64 device
        run: |
          test "${RUNNER_OS}" = ubuntu
          test "${RUNNER_ARCH}" = ARM64
      - name: Validate canonical local OAuth
        run: python3 scripts/validate-local-oauth.py
      - name: OAuth generator contract tests
        run: python3 -m pytest -q tests/test_oauth_local_generator.py

  python-tests:
    name: Python CI
    runs-on: self-hosted, ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test
        run: python3 -m pytest -q

  node-check:
    name: Node validation
    runs-on: self-hosted, ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Node checks
        run: |
          test -f package.json
          node --check node-bridge/server.js

  security-scan:
    name: Security scan
    runs-on: self-hosted, ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Security policy contract
        run: |
          test -f scripts/security_policy_scan.py
          python3 -m pytest -q tests/contracts/security/test_security_policy_scan.py
