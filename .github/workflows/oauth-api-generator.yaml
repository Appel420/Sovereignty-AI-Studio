# =========================================================
# OAUTH API GENERATOR – CI/CD PIPELINE
# =========================================================
# Production-oriented validation, container build, signing,
# SBOM generation, and security scanning for Sovereignty AI Studio.
# =========================================================

name: OAUTH-API-GENERATOR

on:
  push:
    branches:
      - Collaboration
      - main
  pull_request:
    branches:
      - Collaboration
      - main
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # =========================================================
  # LINT + TEST — PYTHON
  # =========================================================
  build-test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            .github/workflows/Requirements.txt
            requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Lint with flake8
        run: |
          python -m flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        run: |
          python -m pytest \
            --cov=apps \
            --cov=backend \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --strict-markers \
            -x \
            --tb=short

      - name: Dependency safety check
        run: |
          if [[ -f requirements.txt ]]; then
            python -m pip_audit -r requirements.txt
          else
            echo 'No root requirements.txt; auditing CI requirements instead.'
          fi
          python -m pip_audit -r .github/workflows/Requirements.txt

      - name: Upload coverage
        if: matrix.python == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  # =========================================================
  # LINT + TEST — NODE
  # =========================================================
  node-check:
    name: Node.js validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Node syntax and project checks
        run: |
          npm run check
          node --check node-bridge/server.js
          if [[ -f unified_server.js ]]; then
            node --check unified_server.js
          fi

      - name: Node memory-vault tests
        if: ${{ hashFiles('tests/test_sovereign_memory_vault.js') != '' }}
        run: npm run test:memory-vault

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # =========================================================
  build-sign:
    name: Build and sign container
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/Collaboration' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compute lowercase image name
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image — keyless Fulcio/Rekor
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${REGISTRY_LC}:${GITHUB_SHA}"

  # =========================================================
  # SBOM + ATTESTATION
  # =========================================================
  supply-chain:
    name: Generate and attest SBOM
    needs: build-sign
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/Collaboration' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compute lowercase image name
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json
          output-file: sbom-sovereignty-ai.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign attest --yes \
            --predicate sbom-sovereignty-ai.json \
            --type cyclonedx \
            "${REGISTRY_LC}:${GITHUB_SHA}"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-sovereignty-ai.json
          if-no-files-found: error

  # =========================================================
  # PULL REQUEST DEPENDENCY REVIEW
  # =========================================================
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # =========================================================
  # FILESYSTEM SECURITY SCAN
  # =========================================================
  security-scan:
    name: Security scan
    needs: [build-test, node-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      - name: Audit root requirements when present
        run: |
          python -m pip install --upgrade pip-audit
          if [[ -f requirements.txt ]]; then
            python -m pip_audit -r requirements.txt
          else
            echo 'No root requirements.txt; Python dependency audit already ran in build-test.'
          fi

# =========================================================
# SECURITY HEADER REFERENCE
# =========================================================
# Enforce at the actual nginx/FastAPI boundary; these comments do not
# themselves configure the server:
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# Content-Security-Policy: default-src 'self'; script-src 'self'
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# Referrer-Policy: strict-origin-when-cross-origin
# Permissions-Policy: camera=(), microphone=(), geolocation=()

# =========================================================
# CRYPTO / COMPLIANCE STATUS
# =========================================================
# Keep implementation status separate from CI claims. Planned primitives
# must not be described as implemented merely because this workflow runs.
