jobs:
  run:
    name: OAuth generator startup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:

          persist-credentials: true

          fetch-depth: 1
          persist-credentials: true

      - name: Startup
        run: |
          echo "OAUTH-API-GENERATOR started"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          test -f package.json
          test -f Dockerfile
          test -f .github/workflows/oauth-api-generator.yaml
          echo "STARTUP=PASS"

  build-test:
    name: Python build/test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        python: ['3.11', '3.12']
    steps:

      - name: Checkout repository
        uses: ubuntu
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python ${{ matrix.python }}

      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: true
      - name: Set up Python

        uses: actions/setup-python@v3

          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6

        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            .github/workflows/Requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install -r .github/workflows/Requirements.txt
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
      - name: Lint
        run: python -m flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest --cov=apps --cov=backend --cov=src --cov-report=xml --cov-report=term --strict-markers -x --tb=short
      - name: Dependency audit (informational)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r .github/workflows/Requirements.txt || true
          if [[ -f requirements.txt ]]; then python -m pip_audit -r requirements.txt || true; fi
      - name: Upload coverage
        if: ${{ always() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@v3
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

          python -m pip install -e '.[test,lint]'
      - name: Python correctness lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q tests


  node-check:
    name: Node.js validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v24
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies

        
        run: npm ci 

        run: npm ci --ignore-scripts
         Collaboration
      - name: Node syntax and project checks

        run: npm install --ignore-scripts

        run: npm ci --ignore-scripts

      - name: Node checks

        run: |
          if npm run --if-present check; then :; fi
          node --check node-bridge/server.js
          if [[ -f unified_server.js ]]; then node --check unified_server.js; fi
      - name: Memory vault tests
        if: ${{ hashFiles('tests/test_sovereign_memory_vault.js') != '' }}
        run: npm run test:memory-vault

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependencies on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
      - name: Record non-PR event
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Dependency review is PR-scoped; event=${GITHUB_EVENT_NAME}"

  security-scan:
    name: Security scan
    needs: [build-test, node-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Report upstream state
        run: |
          echo "build-test=${{ needs.build-test.result }}"
          echo "node-check=${{ needs.node-check.result }}"
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          if [[ -f requirements.txt ]]; then python -m pip_audit -r requirements.txt; fi

  build-sign:
    name: Container build/sign
    needs: [build-test, node-check]
    if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:

          fetch-depth: 1
          persist-credentials: true

      - name: Compute lowercase image name

          persist-credentials: true
      - name: Gate packaging to push/release/manual
        if: ${{ github.event_name != 'push' && github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}
        run: |
          
          
      - name: Compute image
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          fetch-depth: 1
          persist-credentials: true
      - name: Compute image
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: '1'

        run: |
          cosign sign --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
        
            "${{ env.REGISTRY_LC }}":"${{ github.sha }}"

            "${REGISTRY_LC}:${GITHUB_SHA}"
        run: cosign sign --yes --fulcio-url https://fulcio.sigstore.dev --rekor-url https://rekor.sigstore.dev "${REGISTRY_LC}:${GITHUB_SHA}"


  supply-chain:
    name: Supply-chain attestation
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Compute image
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-sovereignty-ai.json
          artifact-name: sbom-sovereignty-ai.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign attest --yes --predicate sbom-sovereignty-ai.json --type cyclonedx "${REGISTRY_LC}:${GITHUB_SHA}"
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-sovereignty-ai.json
          if-no-files-found: error

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
      - name: Skip dependency review
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Skipping dependency-review on event=${GITHUB_EVENT_NAME}"

  security-scan:
    name: security-scan
    needs: [build-test, node-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:

          fetch-depth: 1
          persist-credentials: true

      - name: Record upstream job state

          persist-credentials: true
      - name: Report upstream results

        run: |
          echo "build-test=${{ needs.build-test.result }}"
          echo "node-check=${{ needs.node-check.result }}"
      - name: Trivy filesystem scan (informational)
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: false
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false

          
          hide-progress: false
          exit-code: 1

      - name: Audit root requirements when present

          exit-code: 0
      - name: Python dependency audit (informational)
        continue-on-error: false

        run: |
          python -m pip install pip-audit
          if [[ -f requirements.txt ]]; then python -m pip_audit -r requirements.txt; fi