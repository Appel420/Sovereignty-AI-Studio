name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration]
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '**/*.py'
      - '**/*.js'
  pull_request:
    branches: [Collaboration]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  run:
    name: OAuth generator startup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Startup
        run: |
          echo "OAUTH-API-GENERATOR started"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          test -f package.json
          test -f Dockerfile
          test -f .github/workflows/oauth-api-generator.yaml
          echo "STARTUP=PASS"

  build-test:
    name: Python build/test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            .github/workflows/Requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'
      - name: Python correctness lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q tests

  node-check:
    name: Node.js validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Node checks
        run: |
          if npm run --if-present check; then :; fi
          node --check node-bridge/server.js
          if [[ -f unified_server.js ]]; then node --check unified_server.js; fi
      - name: Memory vault tests
        if: ${{ hashFiles('tests/test_sovereign_memory_vault.js') != '' }}
        run: npm run test:memory-vault

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependencies on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
      - name: Record non-PR event
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Dependency review is PR-scoped; event=${GITHUB_EVENT_NAME}"

  security-scan:
    name: Security scan
    needs: [build-test, node-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Report upstream state
        run: |
          echo "build-test=${{ needs.build-test.result }}"
          echo "node-check=${{ needs.node-check.result }}"
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          if [[ -f requirements.txt ]]; then python -m pip_audit -r requirements.txt; fi

  build-sign:
    name: Container build/sign
    needs: [build-test, node-check]
    if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compute image
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes --fulcio-url https://fulcio.sigstore.dev --rekor-url https://rekor.sigstore.dev "${REGISTRY_LC}:${GITHUB_SHA}"

  supply-chain:
    name: Supply-chain attestation
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compute image
        run: echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-sovereignty-ai.json
          artifact-name: sbom-sovereignty-ai.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign attest --yes --predicate sbom-sovereignty-ai.json --type cyclonedx "${REGISTRY_LC}:${GITHUB_SHA}"
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-sovereignty-ai.json
          if-no-files-found: error
