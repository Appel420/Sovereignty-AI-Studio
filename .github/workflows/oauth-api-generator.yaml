name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration]
    paths: ['.github/workflows/oauth-api-generator.yaml', 'scripts/**', 'config/**', 'tests/**', 'pyproject.toml']
  pull_request:
    branches: [Collaboration]
    paths: ['.github/workflows/oauth-api-generator.yaml', 'scripts/**', 'config/**', 'tests/**', 'pyproject.toml']
  workflow_dispatch:

permissions: {}

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  oauth-contract:
    name: OAUTH — local contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate canonical local OAuth
        run: python3 scripts/validate-local-oauth.py
      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest
      - name: OAuth generator contract tests
        run: python3 -m pytest -q tests/test_oauth_local_generator.py

  python-tests:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest
      - name: Test
        run: python3 -m pytest -q

  node-check:
    name: Node validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Node checks
        run: |
          test -f package.json
          node --check node-bridge/server.js

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest
      - name: Security policy contract
        run: |
          test -f scripts/security_policy_scan.py
          python3 -m pytest -q tests/contracts/security/test_security_policy_scan.py

  sovereign-handoff:
    name: Sovereign handoff
    needs: [oauth-contract, python-tests, node-check, security-scan]
    if: success()
    runs-on: ['self-hosted', 'linux', 'ARM64']
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required for repository checkout}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all credential.helper || true
      - name: Verify sovereign runner
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_os="${RUNNER_OS:-}"
          actual_arch="${RUNNER_ARCH:-}"
          kernel_arch="$(uname -m)"

          printf 'GITHUB_ACTIONS=%q\n' "${GITHUB_ACTIONS:-}"
          printf 'GITHUB_SHA=%q\n' "${GITHUB_SHA:-}"
          printf 'RUNNER_OS=%q\n' "${actual_os}"
          printf 'RUNNER_ARCH=%q\n' "${actual_arch}"
          printf 'uname -m=%q\n' "${kernel_arch}"
          printf 'RUNNER_NAME=%q\n' "${RUNNER_NAME:-}"
          printf 'RUNNER_LABELS=%q\n' "${RUNNER_LABELS:-<not-exposed>}"

          test "${GITHUB_ACTIONS:-}" = "true" || { echo 'FAIL: not executing inside GitHub Actions'; exit 1; }
          test -n "${GITHUB_SHA:-}" || { echo 'FAIL: GITHUB_SHA is empty'; exit 1; }
          test "${actual_os}" = "Linux" || { echo "FAIL: expected RUNNER_OS=Linux, got ${actual_os}"; exit 1; }
          test "${actual_arch}" = "ARM64" || { echo "FAIL: runner label matched but actual RUNNER_ARCH=${actual_arch}; refusing false sovereign attestation"; exit 1; }
          test "${kernel_arch}" = "aarch64" || { echo "FAIL: kernel architecture is ${kernel_arch}, not aarch64; refusing false ARM64 attestation"; exit 1; }

          echo 'SOVEREIGN_RUNNER_ATTESTATION=PASS'
          echo 'Execution mode: sovereign self-hosted online'
          echo "Actual runner: ${actual_os}/${actual_arch} (${kernel_arch})"
          echo "Commit: ${GITHUB_SHA}"
      - name: Verify Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python --version
          python -m pip --version
      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[test,lint]'
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip check
      - name: Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/backend:${{ github.workspace }}/prototypes
        run: python -m pytest -q tests
      - name: Phase 0 Rust tests
        run: |
          set -Eeuo pipefail
          if [[ -f phase0/Cargo.toml ]]; then
            cargo test --manifest-path phase0/Cargo.toml
          else
            echo 'phase0/Cargo.toml not present; skipping Phase 0 Rust tests'
          fi
      - name: Node syntax check
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/server.js ]]; then node --check node-bridge/server.js; fi
      - name: Frontend ownership contract
        run: |
          set -Eeuo pipefail
          if [[ -f frontend/scripts/test-sghv119-ownership.js ]]; then node frontend/scripts/test-sghv119-ownership.js; fi
