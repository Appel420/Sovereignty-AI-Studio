name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration]
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '**/*.py'
      - '**/*.js'
  pull_request:
    branches: [Collaboration]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .:./backend:./src:./prototypes
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_CACHE_DIR: '1'

concurrency:
  group: oauth-api-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  startup:
    name: Startup / repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify required project structure
        run: |
          test -f package.json
          test -f Dockerfile
          test -f .github/workflows/oauth-api-generator.yaml
          echo "OAUTH-API-GENERATOR started"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "STARTUP=PASS"

  python-check:
    name: Python correctness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: startup
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify Python runtime
        run: |
          python --version
          python -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check pytest flake8
          if [[ -f requirements.txt ]]; then python -m pip install --disable-pip-version-check -r requirements.txt; fi
          if [[ -f pyproject.toml ]]; then python -m pip install --disable-pip-version-check -e . || true; fi
      - name: Python syntax gate
        run: |
          while IFS= read -r -d '' f; do python -m py_compile "$f"; done < <(git ls-files -z -- '*.py')
      - name: Python correctness lint
        run: python -m flake8 --count --select=E9,F63,F7,F82 --show-source --statistics .
      - name: Python tests
        run: python -m pytest -q tests

  node-check:
    name: Node.js validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: startup
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify Node runtime
        run: |
          node --version
          npm --version
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Node checks
        run: |
          npm run --if-present check
          node --check node-bridge/server.js
          if [[ -f unified_server.js ]]; then node --check unified_server.js; fi
      - name: Memory vault tests
        if: ${{ hashFiles('tests/test_sovereign_memory_vault.js') != '' }}
        run: npm run test:memory-vault

  source-security:
    name: Source security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-check, node-check]
    if: ${{ always() }}
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Report upstream state
        run: |
          echo "python-check=${{ needs.python-check.result }}"
          echo "node-check=${{ needs.node-check.result }}"
      - name: Private-key material gate
        run: |
          python - <<'PY'
          from pathlib import Path
          markers = ('BEGIN OPENSSH PRIVATE KEY','BEGIN RSA PRIVATE KEY','BEGIN EC PRIVATE KEY','BEGIN PRIVATE KEY')
          hits = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  text = p.read_text(errors='ignore')
              except OSError:
                  continue
              for marker in markers:
                  if marker in text:
                      hits.append(f'{p}: {marker}')
          if hits:
              for hit in hits:
                  print(f'::error::{hit}')
              raise SystemExit(1)
          print('SOURCE_SECURITY=PASS')

  container-build:
    name: Container build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python-check, node-check]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Build container locally
        run: docker build --pull=false -t sovereignty-ai-studio:ci .
