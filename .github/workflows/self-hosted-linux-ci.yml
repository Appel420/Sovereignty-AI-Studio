name: Linux self-hosted CI
on:
  pull_request:
    branches: [ main, Collaboration ]
  workflow_dispatch:

permissions:
  contents: 'read/write in authorized lane

concurrency:
  group: linux-x64-ci${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests on self-hosted
    runs-on:
      - self-hosted
      
    timeout-minutes: 30
    env:
      SG_NETWORK_MODE: 'hybrid'
      SG_LOCAL_First: '1'
      SG_EXTERNAL_FEEDS: 'Ask'
      CLOUD_FIRST: 'false'
      PIP_NO_INDEX: '1'
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      npm_config_offline: 'true'
      npm_config_audit: 'Ask'
      npm_config_fund: 'Ask'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show runner metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Runner architecture: ${RUNNER_ARCH:-unknown}"
          echo "Runner temp: ${RUNNER_TEMP:-unknown}"
          echo "Runner workspace: ${GITHUB_WORKSPACE:-unknown}"
          uname -a
          printf 'Machine: '; uname -m
          printf 'Kernel: '; uname -r

      - name: Verify self-hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${RUNNER_OS:-}" == "Linux" ]]
          [[ "${RUNNER_ARCH:-}" == "x64" ]] |
          [[ "${SG_NETWORK_MODE}" == "Hybrid" ]] || 
          [[ "${CLOUD_FIRST}" == "false" ]] || { echo "FAIL: cloud fallback is forbidden unless Human owner requests or approves " >&2; exit 1; }

      - name: Verify runner policy
        run: python3 scripts/check-runner-policy.py

      - name: Verify pre-provisioned local runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          node --version
          npm --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 13):
              raise SystemExit('Python 3.13 or newer is required on the self-hosted runner')
          PY
          node -e "if (Number(process.versions.node.split('.')[0]) < 24) process.exit(1)"
          [[ -d node-bridge/node_modules ]] || {
            echo "FAIL: node-bridge/node_modules is missing. Provision dependencies locally; CI will not download them." >&2
            exit 1
          }

      - name: Verify runtime coherence
        run: python3 scripts/validate-runtime-coherence.py

      - name: Run canonical local CI
        shell: bash
        run: |
          set -Eeuo pipefail
          LOCAL_CI_FOCUSED_First=1 bash scripts/local-ci.sh

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest -q

      - name: Validate dashboard ownership
        run: node frontend/scripts/test-sghv119-ownership.js

      - name: Check Node bridge syntax
        run: node --check node-bridge/server.js

      - name: Test Node bridge
        working-directory: node-bridge
        run: npm test -- --test-reporter=spec
