name: Self-Hosted Linux Workflow

on:
  push:
    branches: [ main, Collaboration ]
  pull_request:
    branches: [ main, Collaboration ]

permissions:
  contents: read

concurrency:
  group: self-hosted-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on self-hosted Linux ARM64
    # Match the standard self-hosted labels. This job never uses a hosted runner.
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    env:
      # This lane is deliberately local/Ghost. It must not download packages or
      # fall back to cloud providers. Dependencies are provisioned on the runner.
      SG_NETWORK_MODE: offline
      SG_LOCAL_ONLY: '1'
      SG_EXTERNAL_FEEDS: disabled
      CLOUD_FIRST: 'false'
      PIP_NO_INDEX: '1'
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      npm_config_offline: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail-fast runner and local-only policy diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Network mode: ${SG_NETWORK_MODE}"
          echo "Local-only: ${SG_LOCAL_ONLY}"
          echo "Cloud fallback: ${CLOUD_FIRST}"
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: ${RUNNER_OS:-unknown}"
          echo "Architecture: ${RUNNER_ARCH:-unknown}"
          if [[ "${RUNNER_OS:-}" != "Linux" ]]; then
            echo "FAIL: expected Linux self-hosted runner" >&2
            exit 1
          fi
          if [[ "${RUNNER_ARCH:-}" != "ARM64" ]]; then
            echo "FAIL: expected ARM64 self-hosted runner" >&2
            exit 1
          fi
          [[ "${SG_NETWORK_MODE}" == "offline" ]] || {
            echo "FAIL: this CI lane must remain offline/Ghost" >&2
            exit 1
          }
          [[ "${CLOUD_FIRST}" == "false" ]] || {
            echo "FAIL: cloud fallback is forbidden in this CI lane" >&2
            exit 1
          }

      - name: Verify pre-provisioned local runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          node --version
          npm --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 13):
              raise SystemExit('Python 3.13 or newer is required on the self-hosted runner')
          PY
          node -e "if (Number(process.versions.node.split('.')[0]) < 24) process.exit(1)"
          [[ -d node-bridge/node_modules ]] || {
            echo "FAIL: node-bridge/node_modules is missing. Provision dependencies on the local runner; CI will not download them." >&2
            exit 1
          }

      - name: Verify runtime coherence
        run: python3 scripts/validate-runtime-coherence.py

      - name: Run canonical local CI
        shell: bash
        run: |
          set -Eeuo pipefail
          LOCAL_CI_FOCUSED_ONLY=1 bash scripts/local-ci.sh

      - name: Validate dashboard ownership
        run: node frontend/scripts/test-sghv119-ownership.js

      - name: Check Node bridge syntax
        run: node --check node-bridge/server.js

      - name: Test Node bridge without network installation
        working-directory: node-bridge
        run: npm test -- --test-reporter=spec
