name: Self-Hosted Linux Workflow

on:
  push:
    branches: [ main, Collaboration ]
  pull_request:
    branches: [ main, Collaboration ]

permissions:
  contents: read

concurrency:
  group: self-hosted-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on Self-Hosted Linux
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 30
    env:
      SG_NETWORK_MODE: offline
      SG_LOCAL_ONLY: '1'
      SG_EXTERNAL_FEEDS: disabled
      CLOUD_FIRST: 'false'
      PIP_NO_INDEX: '1'
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      npm_config_offline: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail-fast runner and mode diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Selected network mode: ${SG_NETWORK_MODE}"
          echo "Local-only flag: ${SG_LOCAL_ONLY}"
          echo "External feeds: ${SG_EXTERNAL_FEEDS}"
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Runner architecture: ${RUNNER_ARCH:-unknown}"
          echo "Runner labels requested: self-hosted Linux arm64"
          echo "GitHub ref: ${GITHUB_REF}"
          echo "GitHub SHA: ${GITHUB_SHA}"
          if [[ "${RUNNER_OS:-}" != "Linux" ]]; then
            echo "FAIL: expected Linux runner, got ${RUNNER_OS:-unknown}" >&2
            exit 1
          fi
          if [[ "${RUNNER_ARCH:-}" != "ARM64" ]]; then
            echo "FAIL: expected ARM64 runner, got ${RUNNER_ARCH:-unknown}" >&2
            exit 1
          fi
          if [[ "${SG_NETWORK_MODE}" != "offline" ]]; then
            echo "FAIL: automatic CI must run in offline/Ghost mode; explicit network validation requires a separately approved workflow" >&2
            exit 1
          fi
          echo "Runner accepted: Linux ARM64; mode accepted: offline/Ghost"

      - name: Verify required runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          node --version
          npm --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 13):
              raise SystemExit('Python 3.13 or newer is required by README.md')
          PY
          node -e "if (Number(process.versions.node.split('.')[0]) < 24) process.exit(1)"

      - name: Verify runtime coherence
        run: python3 scripts/validate-runtime-coherence.py

      - name: Install checked-in runtime dependencies offline
        shell: bash
        run: |
          set -Eeuo pipefail
          ./INSTALL.sh --offline

      - name: Run canonical local CI
        shell: bash
        run: |
          set -Eeuo pipefail
          LOCAL_CI_FOCUSED_ONLY=1 bash scripts/local-ci.sh

      - name: Validate dashboard ownership
        run: node frontend/scripts/test-sghv119-ownership.js

      - name: Check Node bridge syntax
        run: node --check node-bridge/server.js

      - name: Test Node bridge
        working-directory: node-bridge
        run: npm test -- --test-reporter=spec
