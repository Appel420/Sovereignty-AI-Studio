name: Linux ARM64 Workflow

on:
  push:
    branches: [ main, Collaboration ]
  pull_request:
    branches: [ main, Collaboration ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on GitHub-hosted Linux ARM64
    # Public repositories receive standard GitHub-hosted runner usage at no charge.
    # This avoids waiting forever for an unavailable iOS/self-hosted runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SG_NETWORK_MODE: offline
      SG_LOCAL_ONLY: '1'
      SG_EXTERNAL_FEEDS: disabled
      CLOUD_FIRST: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json

      - name: Install only CI dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            blake3 pynacl cryptography argon2-cffi pytest
          npm --prefix node-bridge ci --ignore-scripts --prefer-offline

      - name: Verify hosted ARM64 runner
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          [[ "${RUNNER_OS}" == "Linux" ]] || exit 1
          [[ "${RUNNER_ARCH}" == "ARM64" ]] || exit 1
          [[ "${SG_NETWORK_MODE}" == "offline" ]] || exit 1
          [[ "${CLOUD_FIRST}" == "false" ]] || exit 1

      - name: Verify runtime coherence
        run: python scripts/validate-runtime-coherence.py

      - name: Run Merkle and Black Canary tests
        run: pytest -q tests/test_merkle_rollback.py tests/test_black_canary.py

      - name: Validate dashboard ownership
        run: node frontend/scripts/test-sghv119-ownership.js

      - name: Check Node bridge syntax
        run: node --check node-bridge/server.js

      - name: Test Node bridge
        working-directory: node-bridge
        run: npm test -- --test-reporter=spec
