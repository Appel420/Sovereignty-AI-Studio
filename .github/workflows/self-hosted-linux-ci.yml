name: Linux ARM64 CI

on:
  push:
    branches: [ main, Collaboration ]
  pull_request:
    branches: [ main, Collaboration ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-arm64-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests on self-hosted Linux ARM64
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 20
    env:
      SG_NETWORK_MODE: offline
      SG_LOCAL_ONLY: '1'
      SG_EXTERNAL_FEEDS: disabled
      CLOUD_FIRST: 'false'
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json

      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r .github/workflows/Requirements.txt
          npm --prefix node-bridge ci --ignore-scripts --prefer-offline

      - name: Verify self-hosted ARM64 runner
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          [[ "${RUNNER_OS}" == "Linux" ]] || exit 1
          [[ "${RUNNER_ARCH}" == "ARM64" ]] || exit 1

      - name: Verify runner policy
        run: python3 scripts/check-runner-policy.py

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest -q

      - name: Check Node bridge syntax
        run: node --check node-bridge/server.js

      - name: Test Node bridge
        working-directory: node-bridge
        run: npm test -- --test-reporter=spec

      - name: Validate dashboard ownership
        run: node frontend/scripts/test-sghv119-ownership.js
