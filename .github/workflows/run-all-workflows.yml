name: RUN ALL WORKFLOWS

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["Collaboration"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-all:
    name: Dispatch every workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enumerate workflows
        id: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow list --all --limit 100 --json name,path,state > workflows.json
          python - <<'PY'
          import json
          data=json.load(open('workflows.json', encoding='utf-8'))
          print(f'workflows discovered: {len(data)}')
          for item in data:
              print(f"{item['state']:10} {item['path']}")
          PY
      - name: Dispatch every workflow that exposes workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          failed=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" == ".github/workflows/run-all-workflows.yml" ]]; then
              continue
            fi
            echo "=== DISPATCH $path @ $REF ==="
            if gh workflow run "$path" --ref "$REF"; then
              echo "DISPATCH=PASS $path"
            else
              echo "DISPATCH=SKIP_OR_FAIL $path"
              failed=1
            fi
          done < <(python - <<'PY'
          import json
          for item in json.load(open('workflows.json', encoding='utf-8')):
              if item.get('state') == 'active':
                  print(item['path'])
          PY
          )
          echo "dispatch_failures=$failed"
          # A workflow without workflow_dispatch cannot be started through the
          # Actions dispatch API. Keep the inventory visible instead of hiding it.
          exit 0
