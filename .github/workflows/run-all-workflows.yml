name: RUN ALL WORKFLOWS

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["Collaboration"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-all:
    name: Dispatch existing workflows individually
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enumerate active workflows
        id: workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow list --repo "$GH_REPO" --all --limit 100 --json name,path,state > workflows.json
          python - <<'PY'
          import json
          data = json.load(open('workflows.json', encoding='utf-8'))
          print(f'workflows discovered: {len(data)}')
          for item in data:
              print(f"{item['state']:10} {item['path']}")
          PY
      - name: Dispatch each existing workflow separately
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          failed=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            [[ "$path" == ".github/workflows/run-all-workflows.yml" ]] && continue
            echo "=== DISPATCHING INDIVIDUAL WORKFLOW: $path @ $REF ==="
            if gh workflow run "$path" --repo "$GH_REPO" --ref "$REF"; then
              echo "DISPATCH=PASS $path"
            else
              echo "DISPATCH=FAIL $path"
              failed=1
            fi
          done < <(
            python - <<'PY'
            import json
            for item in json.load(open('workflows.json', encoding='utf-8')):
                if item.get('state') == 'active':
                    print(item['path'])
            PY
          )
          echo "individual_dispatch_failures=$failed"
          exit "$failed"
