name: Node Bridge CI

on:
  push:
    branches: [ara-hardened, Collaboration]
    paths:
      - 'node-bridge/**'
      - '.github/workflows/node-bridge.yml'
  pull_request:
    branches: [ara-hardened, Collaboration]
    paths:
      - 'node-bridge/**'
      - '.github/workflows/node-bridge.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted, linux, arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json
      - name: Install dependencies
        working-directory: node-bridge
        run: npm ci
      - name: Run tests
        working-directory: node-bridge
        run: npm test
