name: Node Bridge CI

on:
  push:
    branches: [ main ]
    paths:
      - 'node-bridge/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'node-bridge/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test:
    # Owner policy: self-hosted Linux ARM64 only. No GitHub-hosted runners.
    runs-on: ['self-hosted Linux arm64']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '25'

    - name: Install dependencies
      working-directory: node-bridge
      run: npm ci

    - name: Run tests
      working-directory: node-bridge
      run: npm test
