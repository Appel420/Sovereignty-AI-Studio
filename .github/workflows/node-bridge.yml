name: Node Bridge CI

on:
  push:
    branches: [Collaboration, main, dev]
    paths:
      - 'node-bridge/**'
  pull_request:
    branches: [Collaboration, main, dev]
    paths:
      - 'node-bridge/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ['self-hosted', 'linux', 'arm64']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json
      - name: Install dependencies
        working-directory: node-bridge
        run: npm ci
      - name: Run tests
        working-directory: node-bridge
        run: npm test
