name: Node Bridge CI

# PR runs PAUSED — workflow kept.
on:
  push:
    branches: [ main ]
    paths:
      - 'node-bridge/**'
  workflow_dispatch:
  # pull_request: paused

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test:
    runs-on: ['self-hosted Linux arm64']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '25'

    - name: Install dependencies
      working-directory: node-bridge
      run: npm ci

    - name: Run tests
      working-directory: node-bridge
      run: npm test
