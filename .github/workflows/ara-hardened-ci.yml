name: ara-hardened-unit-ci-local

# Named CI: domain=ara-hardened scope=unit mode=local
# PR auto-run PAUSED. Push + workflow_dispatch only.
# Router mode: LOCAL — no OAuth, no full PQC, no outbound.

on:
  push:
    branches: [ ara-hardened ]
  workflow_dispatch:
  # pull_request: paused

concurrency:
  group: ara-hardened-unit-ci-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_NAME: ara-hardened-unit-ci-local
  CI_MODE: local
  SG_NETWORK_MODE: offline
  SG_LOCAL_ONLY: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  light:
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Announce CI identity
        run: |
          echo "CI:   $CI_NAME"
          echo "MODE: $CI_MODE"
          echo "ROUTE: offline-safe"
          echo "BRANCH: ${{ github.ref_name }}"
          echo "COMMIT: ${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal test tools (no PQC extras)
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Coordination unit import check
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from backend.coordination import BranchRegistry
          r = BranchRegistry()
          assert not r.is_writable("main")
          assert not r.is_writable("collaboration")
          assert r.is_writable("ara-hardened")
          print("coordination OK")
          PY

      - name: Accessibility harness tests
        env:
          PYTHONPATH: prototypes
        run: |
          pytest -q prototypes/accessibility/tests/test_accessibility_control.py

      - name: Write mode stamp
        run: |
          python - <<'PY'
          import json, time
          stamp = {
              "ci_name": "ara-hardened-unit-ci-local",
              "ci_mode": "local",
              "route": "offline-safe",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "pqc_full_build": False,
              "oauth_generator": False,
              "pr_trigger": "paused",
              "network_mode": "offline",
              "timestamp": int(time.time()),
              "scar": {
                  "event_type": "ROUTE_SELECTED",
                  "event_class": "policy",
                  "metadata": {
                      "mode": "local",
                      "network": "disabled",
                      "reason": "branch_default_local",
                      "result": "approved",
                  },
              },
          }
          with open("ara-hardened-ci-stamp.json", "w", encoding="utf-8") as f:
              json.dump(stamp, f, indent=2)
          print(json.dumps(stamp, indent=2))
          PY

      - name: Upload stamp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ara-hardened-unit-ci-local-${{ github.run_id }}
          path: ara-hardened-ci-stamp.json
          retention-days: 14
          if-no-files-found: ignore
