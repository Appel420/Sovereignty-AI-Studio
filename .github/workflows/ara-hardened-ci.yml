name: ara-hardened-unit-ci-local

# Retained as an explicit lightweight compatibility lane. The authoritative
# repository gate is .github/workflows/ci.yml.
# Job is always visible; no job-level event hide.
on:
  workflow_dispatch:
  push:
    branches: [ara-hardened]
  pull_request:
    branches: [Collaboration]

concurrency:
  group: ara-hardened-unit-ci-local-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_NAME: ara-hardened-unit-ci-local
  CI_MODE: local
  SG_NETWORK_MODE: local
  SG_LOCAL_ONLY: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  light:
    name: ara-hardened light checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Startup verification (visible to owner)
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "STARTUP=PASS"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install minimal test tools
        run: python -m pip install --upgrade pip pytest
      - name: Coordination import check
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from backend.coordination import BranchRegistry
          r = BranchRegistry()
          assert not r.is_writable('main')
          assert not r.is_writable('collaboration')
          assert r.is_writable('ara-hardened')
          print('coordination OK')
          PY
      - name: Accessibility harness tests
        env:
          PYTHONPATH: prototypes
        run: pytest -q prototypes/accessibility/tests/test_accessibility_control.py
