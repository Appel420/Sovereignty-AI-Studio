name: ara-hardened-unit-ci-local

# Known-good Collaboration execution lane. This workflow is intentionally
# visible on Collaboration pull requests and pushes.
on:
  workflow_dispatch:
  push:
    branches:
      - ara-hardened
      - Collaboration
  pull_request:
    branches:
      - ara-hardened
      - Collaboration

concurrency:
  group: ara-hardened-unit-ci-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_NAME: ara-hardened-unit-ci-local
  CI_MODE: local
  SG_NETWORK_MODE: local
  SG_LOCAL_ONLY: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  light:
    name: Visible Collaboration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Startup verification
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "REPOSITORY=${GITHUB_REPOSITORY}"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
          echo "SHA=${GITHUB_SHA}"
      - name: Install test tools
        run: python3 -m pip install --disable-pip-version-check pytest ruff
      - name: Python syntax gate
        run: python3 -m compileall -q backend apps scripts tests
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "$directory" ]] && targets+=("$directory")
          done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check .; fi
      - name: Coordination import check
        run: python3 -c "from backend.coordination import branch_registry; print('Coordination import: ok')"
      - name: Test collection gate
        run: python3 -m pytest --collect-only -q tests
      - name: Test suite
        run: python3 -m pytest -q tests
      - name: Accessibility harness
        env:
          PYTHONPATH: prototypes
        run: python3 -m pytest -q prototypes/accessibility/tests/test_accessibility_control.py
      - name: Final result
        run: printf 'COLLABORATION_VALIDATION=PASS\n'
