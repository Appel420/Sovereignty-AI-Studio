name: Ara Hardened CI (light)

# Light checks only. PR auto-run PAUSED (workflow kept).
# No OAuth generator, no full PQC/oqs.

on:
  push:
    branches: [ ara-hardened ]
  workflow_dispatch:
  # pull_request: paused

concurrency:
  group: ara-hardened-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SG_NETWORK_MODE: offline
  SG_LOCAL_ONLY: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  light:
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal test tools (no PQC extras)
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Coordination unit import check
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from backend.coordination import (
              BranchRegistry,
              ConflictManager,
              DevAssistRouter,
              LeaseIssuer,
              TaskEnvelope,
          )
          r = BranchRegistry()
          assert not r.is_writable("main")
          assert not r.is_writable("collaboration")
          assert r.is_writable("ara-hardened")
          print("coordination OK")
          PY

      - name: Accessibility harness tests
        env:
          PYTHONPATH: prototypes
        run: |
          pytest -q prototypes/accessibility/tests/test_accessibility_control.py

      - name: Write light CI stamp (no network crypto)
        run: |
          python - <<'PY'
          import json, time
          stamp = {
              "workflow": "Ara Hardened CI (light)",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "pqc_full_build": False,
              "oauth_generator": False,
              "pr_trigger": "paused",
              "network_mode": "offline",
              "timestamp": int(time.time()),
          }
          with open("ara-hardened-ci-stamp.json", "w", encoding="utf-8") as f:
              json.dump(stamp, f, indent=2)
          print(json.dumps(stamp, indent=2))
          PY

      - name: Upload stamp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ara-hardened-ci-stamp-${{ github.run_id }}
          path: ara-hardened-ci-stamp.json
          retention-days: 14
          if-no-files-found: ignore
