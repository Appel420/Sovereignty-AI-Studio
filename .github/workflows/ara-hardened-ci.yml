name: ara-hardened-unit-ci

# Online self-hosted validation lane. Every dispatch/push is independently visible.
on:
  push:
    branches: [ara-hardened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_NAME: ara-hardened-unit-ci
  CI_MODE: online
  SG_NETWORK_MODE: online
  SG_LOCAL_ONLY: '0'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  light:
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Announce CI identity
        run: |
          set -Eeuo pipefail
          echo "CI:   $CI_NAME"
          echo "MODE: $CI_MODE"
          echo "ROUTE: online"
          echo "BRANCH: ${{ github.ref_name }}"
          echo "COMMIT: ${{ github.sha }}"
          echo "RUNNER: ${RUNNER_OS}/${RUNNER_ARCH}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Verify Python runtime
        run: python --version
      - name: Install minimal test tools
        run: python -m pip install --upgrade pip pytest
      - name: Coordination unit import check
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from backend.coordination import BranchRegistry
          r = BranchRegistry()
          assert not r.is_writable('main')
          assert not r.is_writable('collaboration')
          assert r.is_writable('ara-hardened')
          print('coordination OK')
          PY
      - name: Accessibility harness tests
        env:
          PYTHONPATH: prototypes
        run: pytest -q prototypes/accessibility/tests/test_accessibility_control.py
      - name: Write mode stamp
        run: |
          python - <<'PY'
          import json, time
          stamp = {
              'ci_name': 'ara-hardened-unit-ci',
              'ci_mode': 'online',
              'route': 'online',
              'sha': '${{ github.sha }}',
              'ref': '${{ github.ref }}',
              'pqc_full_build': False,
              'oauth_generator': False,
              'network_mode': 'online',
              'timestamp': int(time.time()),
          }
          with open('ara-hardened-ci-stamp.json', 'w', encoding='utf-8') as f:
              json.dump(stamp, f, indent=2)
          print(json.dumps(stamp, indent=2))
