name: ara-hardened-unit-ci-local

# Public/global validation must remain live even when the sovereign runner is absent.
# Sovereign-only execution remains in ci-sovereign.yml.
on:
  push:
    branches: [ ara-hardened ]
  workflow_dispatch:

concurrency:
  group: ara-hardened-unit-ci-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_NAME: ara-hardened-unit-ci-local
  CI_MODE: local
  SG_NETWORK_MODE: offline
  SG_LOCAL_ONLY: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  light:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Announce CI identity
        run: |
          echo "CI:   $CI_NAME"
          echo "MODE: $CI_MODE"
          echo "ROUTE: offline-safe"
          echo "BRANCH: ${{ github.ref_name }}"
          echo "COMMIT: ${{ github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install minimal test tools
        run: python -m pip install --upgrade pip pytest
      - name: Coordination unit import check
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from backend.coordination import BranchRegistry
          r = BranchRegistry()
          assert not r.is_writable('main')
          assert not r.is_writable('collaboration')
          assert r.is_writable('ara-hardened')
          print('coordination OK')
          PY
      - name: Accessibility harness tests
        env:
          PYTHONPATH: prototypes
        run: pytest -q prototypes/accessibility/tests/test_accessibility_control.py
      - name: Write mode stamp
        run: |
          python - <<'PY'
          import json, time
          stamp = {
              'ci_name': 'ara-hardened-unit-ci-local',
              'ci_mode': 'local',
              'route': 'offline-safe',
              'sha': '${{ github.sha }}',
              'ref': '${{ github.ref }}',
              'pqc_full_build': False,
              'oauth_generator': False,
              'network_mode': 'offline',
              'timestamp': int(time.time()),
          }
          with open('ara-hardened-ci-stamp.json', 'w', encoding='utf-8') as f:
              json.dump(stamp, f, indent=2)
          print(json.dumps(stamp, indent=2))
          PY
      - name: Upload stamp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ara-hardened-unit-ci-local-${{ github.run_id }}
          path: ara-hardened-ci-stamp.json
          retention-days: 14
          if-no-files-found: error
