name: Python application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 30
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' \
            fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Set up Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python --version
          python - <<'PY'
          import sys
          if sys.version_info < (3, 13):
              raise SystemExit(f'Python 3.13+ required; found {sys.version}')
          print(f'Python runtime OK: {sys.version}')
          PY
      - name: Install project and test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e '.[test,lint]'
          else
            python -m pip install -r .github/workflows/Requirements.txt
          fi
          python -m pip install flake8
      - name: Lint with flake8
        shell: bash
        run: |
          set -Eeuo pipefail
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        shell: bash
        env:
          PYTHONPATH: .:./backend:./src:./prototypes
        run: python -m pytest tests/ -q
