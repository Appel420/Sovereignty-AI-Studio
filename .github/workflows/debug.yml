name: Debug Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: GitHub Debug
    runs-on: ununtu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository 
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "ubuntu"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Verify Python runtime
        run: python --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest flake8
      - name: Run debug tests
        run: |
          python -m pytest
          flake8
      - name: Debug summary
        run: echo "GitHub debug validation complete."
