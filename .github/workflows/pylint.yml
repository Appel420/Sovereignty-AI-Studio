name: Pylint

on:
  workflow_dispatch:
  push:
    branches: [ara-hardened, Collaboration]
    paths:
      - 'backend/**'
      - 'src/utils/cli.py'
      - 'src/utils/subtools.py'
      - 'workflows/**'
      - 'Makefile'
      - '.github/workflows/pylint.yml'
  pull_request:
    branches: [ara-hardened, Collaboration]
    paths:
      - 'backend/**'
      - 'src/utils/cli.py'
      - 'src/utils/subtools.py'
      - 'workflows/**'
      - 'Makefile'
      - '.github/workflows/pylint.yml'

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted, linux, arm64
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pylint
        run: python -m pip install --upgrade pip pylint
      - name: Analyse the code with pylint
        run: make py-lint
