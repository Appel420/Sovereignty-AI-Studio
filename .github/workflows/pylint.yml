name: Pylint

on:
  push:
    branches: [Collaboration, main, dev]
  pull_request:
    branches: [Collaboration, main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install Pylint
        run: python -m pip install --upgrade pip pylint
      - name: Analyse Python sources
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.git/**')
          if (( ${#files[@]} == 0 )); then
            echo 'No first-party Python files; lane passed.'
            exit 0
          fi
          pylint "${files[@]}"
