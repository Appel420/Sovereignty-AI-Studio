name: Pylint

on:
  workflow_dispatch:
  push:
    branches: [ main, Collaboration ]
  pull_request:
    branches: [ main, Collaboration ]

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pylint
        run: python -m pip install --upgrade pip pylint
      - name: Analyse the code with pylint
        run: make py-lint
