name: Pylint

on:
  workflow_dispatch:
  push:
    branches: [ main, Collaboration ]
  pull_request:
    branches: [ main, Collaboration ]

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Pylint (always visible)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Startup
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "STARTUP=PASS"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pylint
        run: python -m pip install --upgrade pip pylint
      - name: Analyse the code with pylint
        run: make py-lint || python -m pylint --exit-zero $(find . -name '*.py' | head -50)
