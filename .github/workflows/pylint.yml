name: Pylint

on:
  workflow_dispatch:
  push:
    branches: [ Collaboration ]
  pull_request:
    branches: [ Collaboration ]

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Pylint (always visible)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12','3.13']
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Startup
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "STARTUP=PASS"
      - name: Verify Python runtime
        run: python --version
      - name: Install pylint
        run: python -m pip install --upgrade pip pylint
      - name: Analyse the code with pylint
        run: make py-lint || python -m pylint --exit-zero $(find . -name '*.py' | head -50)
