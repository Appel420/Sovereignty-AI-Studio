name: Pylint

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, ara-hardened]
  pull_request:
    branches: [Collaboration, main, ara-hardened]

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Install pylint
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir pylint

      - name: Analyse the code with pylint
        run: |
          set -Eeuo pipefail
          if [ -f Makefile ]; then make py-lint || true; fi
          pylint --version
          find . -name '*.py' -not -path './.venv/*' -not -path './external/*' | head -20 | xargs -r pylint --errors-only || true
