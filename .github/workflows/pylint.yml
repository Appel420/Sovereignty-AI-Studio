name: Pylint

on:
  push:
    branches: [Collaboration, main, dev]
  pull_request:
    branches: [Collaboration, main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install Pylint
        run: python -m pip install --upgrade pip pylint
      - name: Analyse Python sources
        shell: bash
        run: |
          set -Eeuo pipefail
          files=$(git ls-files '*.py')
          if [[ -z "$files" ]]; then
            echo 'No Python files; lane passed.'
            exit 0
          fi
          pylint $files
