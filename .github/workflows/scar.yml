name: SCAR — Sovereign Compliance Audit Record

on:
  push:
    branches: [ 'Collaboration, main, copilot/main, GPT/Codex, ara-hardened' ]
  pull_request:
    branches: [ 'Collaboration, main, copilot/main, GPT/Codex, ara-hardened' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scar-contract:
    name: SCAR — Independent Compliance Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: SCAR source gate
        run: |
          set -Eeuo pipefail
          test -f scripts/scar_pqc_attest.py
          python3 -m py_compile scripts/scar_pqc_attest.py

      - name: SCAR attestation contract
        env:
          SCAR_PQC_KEY_DIR: "${{ runner.temp }}/scar/pqc"
          SCAR_PQC_OUTPUT: "${{ runner.temp }}/scar/attestation.json"
        run: |
          set -Eeuo pipefail
          mkdir -p "${SCAR_PQC_KEY_DIR}" "$(dirname "${SCAR_PQC_OUTPUT}")"
          python3 scripts/scar_pqc_attest.py --status PASS --commit "${GITHUB_SHA}"
          test -s "${SCAR_PQC_OUTPUT}"
          grep -q '"verified": true' "${SCAR_PQC_OUTPUT}"
          grep -q 'ML-DSA-87' "${SCAR_PQC_OUTPUT}"

      - name: SCAR certification marker
        run: |
          set -Eeuo pipefail
          printf 'SCAR_STATUS=PASS\n'
          printf 'SCAR_COMMIT=%s\n' "${GITHUB_SHA}"
