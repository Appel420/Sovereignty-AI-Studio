name: Sync SuperGrok Heavy Skeleton

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ['self-hosted Linux arm64']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Sync last 30 days of updates locally first
        run: python scripts/python/sync_supergrok_skeleton.py --days 30
      - name: Commit synced files on the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A external/SuperGrok-Heavy-4-2-Skeleton .sync_state/supergrok-heavy-4-2-skeleton.json || true
          if git diff --cached --quiet; then
            echo "No sync changes to commit"
            exit 0
          fi
          git commit -m "chore(sync): daily SuperGrok Heavy skeleton sync"
          git push origin HEAD:${{ github.ref_name }}
