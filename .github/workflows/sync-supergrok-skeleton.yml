name: Sync SuperGrok Heavy Skeleton

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync last 30 days of updates
        run: |
          python scripts/python/sync_supergrok_skeleton.py --days 30

      - name: Commit and push synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A external/SuperGrok-Heavy-4-2-Skeleton .sync_state/supergrok-heavy-4-2-skeleton.json || true
          if git diff --cached --quiet; then
            echo "No sync changes to commit"
            exit 0
          fi
          git commit -m "chore(sync): daily SuperGrok Heavy skeleton sync"
          git push
