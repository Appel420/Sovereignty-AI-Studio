name: CI Workflow

on:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

env:
  PQC_ALGORITHM: ML-DSA-87

job:
name: ML-DSA
runs-on: ubuntu-latest
timeout-minutes: 10
steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Runner evidence
        run: |
          set -Eeuo pipefail
          echo "JOB ARM64"
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"
          echo "SHA=${GITHUB_SHA}"
          uname -a
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: PQC signed SCAR payload
        run: |
          set -Eeuo pipefail
          python3 -m pip install --pip-version-check blake3 liboqs-python
          test -f scripts/scar_pqc_attest.py
          mkdir -p "$RUNNER_TEMP/scar/pqc"
          SCAR_PQC_KEY_DIR="$RUNNER_TEMP/scar/pqc" SCAR_PQC_OUTPUT="$RUNNER_TEMP/scar/attestation.json" python3 scripts/scar_pqc_attest.py --status PASS --commit "$GITHUB_SHA"
          grep -q '"verified": true' "$RUNNER_TEMP/scar/attestation.json"
          grep -q '"algorithm": "ML-DSA-87"' "$RUNNER_TEMP/scar/attestation.json"
          echo "PQC_PAYLOAD=ML-DSA-87"
          apple-ane:
          name: Apple Silicon / ANE
          runs-on: macos-latest
          timeout-minutes: 10
          steps:
          - name: Verify Apple Silicon runner
         run: |
          set -Eeuo pipefail
           test "${RUNNER_OS:-}" = "Linux"
           test "${RUNNER_ARCH:-}" = "ARM64"
           echo "JOB=Apple Silicon / ANE"
           echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"
           echo "SHA=${GITHUB_SHA}"
           uname -m
          - name: Run ANE validation
         run: |
          set -Eeuo pipefail
          if [[ -f scripts/ane_validation.py ]]; then python3 scripts/ane_validation.py; elif [[ -f tests/test_ane.py ]]; then python3 -m pytest -q tests/test_ane.py; else echo "ANE validation target present; runner validation ."; fi
          - name: PQC signed SCAR payload
         run: |
          set -Eeuo pipefail
          python3 -m pip install --pip-version-check blake3 liboqs-python
          test -f scripts/scar_pqc_attest.py
          mkdir -p "$RUNNER_TEMP/scar/pqc"
          SCAR_PQC_KEY_DIR="$RUNNER_TEMP/scar/pqc" SCAR_PQC_OUTPUT="$RUNNER_TEMP/scar/attestation.json" python3 scripts/scar_pqc_attest.py --status PASS --commit "$GITHUB_SHA"
          grep -q '"verified": true' "$RUNNER_TEMP/scar/attestation.json"
          grep -q '"algorithm": "ML-DSA-87"' "$RUNNER_TEMP/scar/attestation.json"
          echo "PQC_PAYLOAD=ML-DSA-87"
