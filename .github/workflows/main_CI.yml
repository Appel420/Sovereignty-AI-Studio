name: CI Workflow

on:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

  apple-ane:
    name: Apple Silicon / ANE
    runs-on: macOS-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS:-}" = "macOS"
          test "${RUNNER_ARCH:-}" = "ARM64"
          uname -m

      - name: Run ANE validation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/ane_validation.py ]]; then
            python3 scripts/ane_validation.py
          elif [[ -f tests/test_ane.py ]]; then
            python3 -m pytest -q tests/test_ane.py
          else
            echo "ANE validation target not present; runner validation only."
          fi
