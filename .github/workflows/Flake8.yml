name: Flake8 Lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake8-recovery:
    name: Flake8 recovery / visible execution
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Report workflow state
        run: |
          set -euo pipefail
          echo "WORKFLOW_VISIBLE=true"
          echo "WORKFLOW_FILE=.github/workflows/Flake8.yml"
          echo "RECOVERY_MODE=VISIBLE"
          echo "ORIGINAL_IMPLEMENTATION_REQUIRES_RESTORATION=true"
