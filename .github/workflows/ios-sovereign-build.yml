name: Validate source and generate manifest
        run: |
          set -Eeuo pipefail
          python -m compileall -q backend
          python3 - <<'PY'
          import json
          import os
          import time

          payload = {
              'nodeid': 'ios-build-' + os.environ['GITHUBRUN_ID'],
              'timestamp': int(time.time()),
              'buildref': os.environ['GITHUBSHA'],
              'platform': 'iOS',
              'execution': 'self-hosted-linux-arm64-validation',
              'nativexcodecompile': False,
              'runnername': os.environ.get('RUNNERNAME'),
              'runneros': os.environ.get('RUNNEROS'),
              'runnerarch': os.environ.get('RUNNERARCH'),
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          PY

name: Upload validation manifest
