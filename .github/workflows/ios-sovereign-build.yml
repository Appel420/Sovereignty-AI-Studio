name: iOS Sovereign Build

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lightweight-security:
    name: iOS source validation (visible)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository at exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "macOS"
          test -n "${GITHUB_SHA}"
      - name: Validate backend Python sources
        run: python3 -m compileall -q backend
      - name: Validate Swift sources
        shell: bash
        run: |
          set -Eeuo pipefail
          if find ios -type f -name '*.swift' -print -quit 2>/dev/null | grep -q .; then
            while IFS= read -r -d '' file; do swiftc -parse "$file"; done < <(find ios -type f -name '*.swift' -print0)
          else echo 'No Swift sources found; native source parse is not applicable.'; fi
      - name: Generate validation manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, platform, time
          payload = {'node_id': f"ios-build-{os.environ['GITHUB_RUN_ID']}", 'timestamp': int(time.time()), 'build_ref': os.environ['GITHUB_SHA'], 'platform': 'iOS', 'execution': 'github-hosted-validation', 'native_xcode_compile': False, 'runner_os': os.environ.get('RUNNER_OS', 'local'), 'runner_arch': os.environ.get('RUNNER_ARCH', platform.machine())}
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2, sort_keys=True); fh.write('\n')
          PY
      - name: Verify manifest
        run: python3 -m json.tool ios-build-manifest.json
