name: iOS Sovereign Build (L6 GateOne + PQC)

on:
  push:
    branches: [ main, ara-hardened ]
  pull_request:
    branches: [ main, ara-hardened ]
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend
  GATEONE_VERIFIER_URL: ${{ secrets.GATEONE_VERIFIER_URL || 'http://localhost:9899/verify-attestation' }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # SOVEREIGN SECURITY PRE-CHECK (ML-DSA-87 + GateOne)
  # =========================================================
  sovereign-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install sovereign core + oqs
        run: |
          pip install -r requirements.txt || true
          pip install oqs

      - name: GateOne ML-DSA-87 Attestation (iOS Build Context)
        run: |
          python -c "
          import json, time, oqs, os
          from sovereign.pqc_signatures import MLDSASigner

          PRIMARY = 'ML-DSA-87'
          FALLBACK = 'ML-DSA-65'

          payload = {
              'node_id': 'ios-build-${{ github.run_id }}',
              'nonce': str(int(time.time())),
              'timestamp': int(time.time()),
              'build_ref': '${{ github.sha }}',
              'l6_level': 'Environmental',
              'platform': 'iOS'
          }

          signer = MLDSASigner(algorithm=PRIMARY)
          pub, sec = signer.load_or_create_keypair()
          message = json.dumps(payload, sort_keys=True).encode()
          signature = signer.sign(message)

          token = {
              'payload': payload,
              'signature': signature.hex(),
              'public_key': pub.hex(),
              'algorithm': PRIMARY
          }

          print('iOS ML-DSA-87 attestation token generated')
          print(json.dumps(token, indent=2))

          verified = signer.verify(message, signature)
          print(f'Local verification: {verified}')
          assert verified is True

          verifier_url = os.environ.get('GATEONE_VERIFIER_URL', '')
          if verifier_url and verifier_url.startswith('http'):
              import requests
              try:
                  r = requests.post(verifier_url, json={'attestation_token': json.dumps(token), 'max_age_seconds': 300}, timeout=10)
                  print('GateOne response:', r.json())
              except Exception as e:
                  print('GateOne optional call:', e)
          "

  # =========================================================
  # XCODEGEN + BUILD + PQC MANIFEST SIGNING
  # =========================================================
  build:
    needs: sovereign-security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: xcodebuild clean build -project EnterpriseAudioPlatform.xcodeproj -scheme StreamStudioApp -destination 'generic/platform=iOS'

      - name: Create PQC-Backed Build Manifest
        run: |
          python3 -c "
          import json, time, hashlib
          from sovereign.pqc_signatures import MLDSASigner

          manifest = {
              'build_id': '${{ github.run_id }}',
              'commit': '${{ github.sha }}',
              'timestamp': int(time.time()),
              'app': 'StreamStudioApp',
              'platform': 'iOS',
              'l6_level': 'Environmental'
          }

          signer = MLDSASigner(algorithm='ML-DSA-87')
          pub, sec = signer.load_or_create_keypair()
          message = json.dumps(manifest, sort_keys=True).encode()
          signature = signer.sign(message)

          manifest['ml_dsa_87_signature'] = signature.hex()
          manifest['public_key'] = pub.hex()

          with open('ios-build-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)

          print('PQC-signed iOS build manifest created')
          "

      - name: Upload PQC Manifest + Logs
        uses: actions/upload-artifact@v4
        with:
          name: ios-sovereign-build-artifacts
          path: |
            ios-build-manifest.json
            *.log

  # =========================================================
  # POST-BUILD VERIFICATION
  # =========================================================
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-sovereign-build-artifacts

      - name: Verify PQC Manifest
        run: |
          python3 -c "
          import json
          from sovereign.pqc_signatures import MLDSASigner

          with open('ios-build-manifest.json') as f:
              manifest = json.load(f)

          sig = bytes.fromhex(manifest.pop('ml_dsa_87_signature'))
          pub = bytes.fromhex(manifest.pop('public_key'))

          signer = MLDSASigner(algorithm='ML-DSA-87')
          message = json.dumps(manifest, sort_keys=True).encode()

          if signer.verify(message, sig):
              print('✅ PQC manifest verification PASSED (ML-DSA-87)')
          else:
              print('❌ PQC manifest verification FAILED')
              exit(1)
          "
