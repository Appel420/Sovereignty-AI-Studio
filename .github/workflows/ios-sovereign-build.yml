name: iOS Sovereign Build

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main]
    paths:
      - '.github/workflows/ios-sovereign-build.yaml'
      - 'ios/**'
  pull_request:
    branches: [Collaboration, main]
    paths:
      - '.github/workflows/ios-sovereign-build.yml'
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: ios-sovereign-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: build-ios
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Xcode and Swift
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          swift --version
      - name: Verify Swift package
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ios/Package.swift
          swift package describe --package-path ios
      - name: Build SovereigntyGuard
        shell: bash
        run: swift build --package-path ios
      - name: Test SovereigntyGuard
        shell: bash
        run: swift test --package-path ios
