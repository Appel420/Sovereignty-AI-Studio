name: iOS Sovereign Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS Sovereign Build
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository 
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git -c init.defaultBranch=Collaboration remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Xcode and Swift runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          swift --version

      - name: Validate Swift package
        working-directory: ios
        shell: bash
        run: |
          set -Eeuo pipefail
          swift package describe
          swift package dump-package >/dev/null

      - name: Build SovereigntyGuard
        working-directory: ios
        shell: bash
        run: |
          set -Eeuo pipefail
          swift build

      - name: Test SovereigntyGuard
        working-directory: ios
        shell: bash
        run: |
          set -Eeuo pipefail
          swift test
