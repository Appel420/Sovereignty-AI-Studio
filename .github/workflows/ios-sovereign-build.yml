name: ios-sovereign-build.yml

on:
  push:
    branches: [Collaboration]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-sovereign-build.yml'
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lightweight-security:
    name: iOS source validation (visible)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Startup
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "STARTUP=PASS"
      - name: Validate backend Python sources
        run: python3 -m compileall -q backend
      - name: Validate Swift sources
        shell: bash
        run: |
          set -Eeuo pipefail
          if find ios -type f -name '*.swift' -print -quit 2>/dev/null | grep -q .; then
            while IFS= read -r -d '' file; do swiftc -parse "$file"; done < <(find ios -type f -name '*.swift' -print0)
          else
            echo 'No Swift sources found; native source parse is not applicable.'
          fi
      - name: Generate validation manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, platform, time
          payload = {
              'node_id': f"ios-build-{os.environ['GITHUB_RUN_ID']}",
              'timestamp': int(time.time()),
              'build_ref': os.environ['GITHUB_SHA'],
              'platform': 'iOS',
              'execution': 'github-hosted-validation',
              'native_xcode_compile': True,
              'runner_os': os.environ.get('RUNNER_OS', 'local'),
              'runner_arch': os.environ.get('RUNNER_ARCH', platform.machine()),
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write('\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Verify manifest
        run: python3 -m json.tool ios-build-manifest.json
