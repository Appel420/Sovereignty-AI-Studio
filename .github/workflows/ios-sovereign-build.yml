name: iOS Sovereign Build (local-first)

on:
  push:
    branches: [ ara-hardened ]
  pull_request:
    branches: [ ara-hardened ]
  workflow_dispatch:

# Do NOT install oqs / liboqs / full post-quantum native stacks in CI.
# Real ML-DSA-87 belongs on-device or in an explicit local offline job.
# CI only produces a lightweight, fail-closed local manifest.
# Owner policy: self-hosted Linux ARM64 only. No GitHub-hosted runners.

env:
  PYTHONPATH: .:./backend

permissions:
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight-security:
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Local-only build context manifest (no oqs download)
        run: |
          python3 <<'PY'
          import hashlib
          import hmac
          import json
          import secrets
          import time

          class LocalCISigner:
              def __init__(self):
                  self._sk = secrets.token_bytes(32)
                  self._pk = hashlib.sha256(self._sk).digest()

              def sign(self, message: bytes) -> bytes:
                  return hmac.new(self._sk, message, hashlib.sha256).digest()

              def verify(self, message: bytes, signature: bytes) -> bool:
                  return hmac.compare_digest(self.sign(message), signature)

          payload = {
              'node_id': 'ios-build-${{ github.run_id }}',
              'nonce': str(int(time.time())),
              'timestamp': int(time.time()),
              'build_ref': '${{ github.sha }}',
              'platform': 'iOS',
              'signing_backend': 'hmac-sha256-ci-local',
              'note': 'CI local-only; real ML-DSA-87 is device/offline, not downloaded here',
          }

          signer = LocalCISigner()
          message = json.dumps(payload, sort_keys=True).encode()
          signature = signer.sign(message)
          assert signer.verify(message, signature), 'local CI signature failed'

          token = {
              'payload': payload,
              'signature': signature.hex(),
              'public_key': signer._pk.hex(),
              'algorithm': 'HMAC-SHA256-CI-LOCAL',
          }
          print(json.dumps(token, indent=2))
          print('Local CI attestation token generated (no oqs / liboqs install)')
          PY

  build:
    needs: lightweight-security
    runs-on: ['self-hosted Linux arm64']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check for XcodeGen project definition
        id: xcodegen
        run: |
          if [ -f project.yml ] || [ -f project.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No project.yml — skipping XcodeGen/build on this runner"
          fi

      - name: Note on iOS compile path
        if: steps.xcodegen.outputs.present == 'true'
        run: |
          echo "XcodeGen/xcodebuild require macOS. This job is on self-hosted Linux arm64 per owner policy."
          echo "Compile step is skipped on Linux; manifest is still produced."

      - name: Create local-only build manifest (no PQC download)
        run: |
          python3 <<'PY'
          import hashlib
          import hmac
          import json
          import secrets
          import time

          class LocalCISigner:
              def __init__(self):
                  self._sk = secrets.token_bytes(32)
                  self._pk = hashlib.sha256(self._sk).digest()

              def sign(self, message: bytes) -> bytes:
                  return hmac.new(self._sk, message, hashlib.sha256).digest()

              def verify(self, message: bytes, signature: bytes) -> bool:
                  return hmac.compare_digest(self.sign(message), signature)

          manifest = {
              'build_id': '${{ github.run_id }}',
              'commit': '${{ github.sha }}',
              'timestamp': int(time.time()),
              'app': 'StreamStudioApp',
              'platform': 'iOS',
              'runner': 'self-hosted Linux arm64',
              'signing_backend': 'hmac-sha256-ci-local',
              'note': 'Real ML-DSA-87 is not installed or invoked by this CI job',
          }

          signer = LocalCISigner()
          message = json.dumps(manifest, sort_keys=True).encode()
          signature = signer.sign(message)
          assert signer.verify(message, signature)

          manifest['signature'] = signature.hex()
          manifest['public_key'] = signer._pk.hex()

          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(manifest, fh, indent=2)
          print('Local CI iOS build manifest written (no oqs install)')
          PY

      - name: Upload local manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sovereign-build-artifacts
          path: ios-build-manifest.json
          if-no-files-found: ignore
