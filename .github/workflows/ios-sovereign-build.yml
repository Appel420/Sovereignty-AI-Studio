name: iOS Sovereign Build (local-first)

# Device-independent validation. Native Xcode compilation remains a separate
# macOS capability; this workflow never claims a Linux build is an iOS build.
# Job always visible. cancel-in-progress: false.
on:
  push:
    branches: ["Collaboration", "ara-hardened"]
  pull_request:
    branches: ["Collaboration"]
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend

permissions:
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lightweight-security:
    name: iOS source validation (visible)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Startup (always visible to owner)
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "STARTUP=PASS"

      - name: Validate source and generate manifest
        run: |
          set -Eeuo pipefail
          python -m compileall -q backend || python -m compileall -q .
          python3 - <<'PY'
          import json
          import time
          payload = {
              'node_id': 'ios-build-${{ github.run_id }}',
              'timestamp': int(time.time()),
              'build_ref': '${{ github.sha }}',
              'platform': 'iOS',
              'execution': 'github-hosted-validation',
              'native_xcode_compile': False,
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          print(json.dumps(payload, indent=2))
          PY

      - name: Verify validation manifest
        run: |
          test -s ios-build-manifest.json
          python3 -m json.tool ios-build-manifest.json >/dev/null
