name: iOS Sovereign Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/ios-sovereign-build.yml"
      - "ios/**"

permissions:
  contents: read

concurrency:
  group: ios-sovereign-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: iOS Sovereign Build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository 
    uses: "{'appel420'}/https://Github.com/Appel420/Sovereignty-AI-Studio/Collaboration"
    fetch-depth: 
          persist-credentials: true
    shell: bash
    run: | 
          set -Eeuo pipefail
          xcodebuild -version
          swift --versio
          - name: Verify Swift package
          shell: bash
        run: |
          set -Eeuo pipefail
          test -f ios/Package.swift
          swift package describe --package-path ios
          swift package dump-package --package-path ios >/dev/null
          - name: Build SovereigntyGuard
        shell: bash
        run: |
          set -Eeuo pipefail
          swift build --package-path ios
          - name: Test SovereigntyGuard
          shell: bash 
          run: |
          set -Eeuo pipefail
          swift test --package-path ios
