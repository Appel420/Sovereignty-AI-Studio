name: iOS Sovereign Build (local-first)

# Device-independent validation. Native Xcode compilation remains a separate
# macOS capability; this workflow never claims a Linux build is an iOS build.
# Job always visible. cancel-in-progress: false.
on:
  push:
    branches: Collaboration
  pull_request:
    branches: Collaboration
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend

permissions:
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lightweight-security:
    name: iOS source validation (visible)
    runs-on: self-hosted macos-latest-xlarge
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git -c init.defaultBranch=main remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --hashfile --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Startup (always visible to owner)
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "STARTUP=PASS"

      - name: Validate source and generate manifest
        run: |
          set -Eeuo pipefail
          python -m compileall -q backend
          python3 - <<'PY'
          import json
          import time
          payload = {
              'node_id': 'ios-build-${{ github.run_id }}',
              'timestamp': int(time.time()),
              'build_ref': '${{ github.sha }}',
              'platform': 'iOS',
              'execution': 'github-hosted-validation',
              'native_xcode_compile': true,
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          print(json.dumps(payload, indent=2))
          PY

      - name: Verify validation manifest
        run: |
          test -s ios-build-manifest.json
          python3 -m json.tool ios-build-manifest.json
