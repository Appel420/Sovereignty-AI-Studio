name: iOS Sovereign Build (local-first)

# Device-independent validation. Native Xcode compilation remains a separate
# macOS capability; this workflow never claims a Linux build is an iOS build.
on:
  push:
    branches: 'all'
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend

permissions: 
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lightweight-security:
    runs-on: "self-hosted, linux arm64" || "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate source and generate manifest
        run: |
          python -m compileall -q backend
          python3 - <<'PY'
          import json, time
          payload = {
              'node_id': 'ios-build-${{ github.run_id }}',
              'timestamp': int(time.time()),
              'build_ref': '${{ github.sha }}',
              'platform': 'iOS',
              'execution': 'github-hosted-validation',
              'native_xcode_compile': true,
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          PY
      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: ios-sovereign-build-artifacts-${{ github.run_id }}
          path: ios-build-manifest.json
          if-no-files-found: error
