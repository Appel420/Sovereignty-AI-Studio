name: iOS Sovereign Build

on:
  push:
    branches: [Collaboration]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-sovereign-build.yml'
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swift-package:
    name: iOS Swift Package build + tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify toolchain
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          swift --version
          test -f ios/Package.swift

      - name: Resolve Swift package
        working-directory: ios
        run: swift package resolve

      - name: Build release configuration
        working-directory: ios
        run: swift build -c release

      - name: Run Swift tests
        working-directory: ios
        run: swift test -c release

      - name: Parse standalone Swift sources
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            swiftc -parse "$file"
          done < <(find ios -type f -name '*.swift' -not -path 'ios/.build/*' -print0)

      - name: Generate truthful validation manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, time
          payload = {
              'node_id': f"ios-build-{os.environ['GITHUB_RUN_ID']}",
              'timestamp': int(time.time()),
              'build_ref': os.environ['GITHUB_SHA'],
              'platform': 'iOS',
              'execution': 'github-hosted-macos-validation',
              'swift_package_build': True,
              'swift_tests': True,
              'native_xcode_project_archive': False,
              'claim': 'Swift Package build/test executed; no Xcode project archive claimed.',
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
              fh.write('\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Verify manifest
        run: python3 -m json.tool ios-build-manifest.json >/dev/null
