name: iOS Sovereign Build (local-first)

# Device-independent validation. Native Xcode compilation remains a separate
# macOS capability; this workflow never claims a Linux build is an iOS build.
on:
  push:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-sovereign-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-preflight:
    name: Sovereign Runner Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check registered Linux ARM64 runners
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/runners?per_page=100'
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req, timeout=10) as response:
              data = json.load(response)

          matches = []
          for runner in data.get('runners', []):
              labels = {label['name'].lower() for label in runner.get('labels', [])}
              if {'self-hosted', 'linux', 'arm64'} <= labels:
                  matches.append((runner['name'], runner.get('status'), runner.get('busy')))

          print('Sovereign runner inventory:')
          if not matches:
              print('  NO matching self-hosted/linux/ARM64 runner is registered.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write('available=false\n')
              sys.exit(0)

          available = any(status == 'online' and not busy for _, status, busy in matches)
          for name, status, busy in matches:
              print(f'  {name}: status={status}, busy={busy}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'available={str(available).lower()}\n')
          PY

      - name: Explain runner state
        if: steps.check.outputs.available != 'true'
        run: |
          echo 'No idle Linux ARM64 sovereign runner is currently available.'
          echo 'The native sovereign validation job will be skipped instead of remaining invisibly queued.'

  lightweight-security:
    name: Sovereign Linux ARM64 Validation
    needs: runner-preflight
    if: needs.runner-preflight.outputs.available == 'true'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify sovereign runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Execution mode: self-hosted-linux-arm64-validation"
          echo "Commit: ${GITHUB_SHA}"
          echo "Runner: ${RUNNER_NAME}"

      - name: Validate source and generate manifest
        run: |
          set -Eeuo pipefail
          python -m compileall -q backend
          python3 - <<'PY'
          import json
          import os
          import time

          payload = {
              'node_id': 'ios-build-' + os.environ['GITHUB_RUN_ID'],
              'timestamp': int(time.time()),
              'build_ref': os.environ['GITHUB_SHA'],
              'platform': 'iOS',
              'execution': 'self-hosted-linux-arm64-validation',
              'native_xcode_compile': False,
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          PY

      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: ios-sovereign-build-artifacts-${{ github.run_id }}
          path: ios-build-manifest.json
          if-no-files-found: error
