name: iOS Sovereign Build (deployment)

# Real native build on macOS-latest. This is deployment, not a test.
# Hosted ignition stays cheap; device shift does the actual Xcode compile.
on:
  push:
    branches: [ara-hardened, Collaboration]
  pull_request:
    branches: [ara-hardened, Collaboration]
  workflow_dispatch:

env:
  PYTHONPATH: .:./backend

permissions:
  contents: read

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ignition:
    name: GitHub-hosted ignition (valet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Startup (always visible to owner)
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "STARTUP=PASS"
      - name: Validate source and generate manifest
        run: |
          set -Eeuo pipefail
          python -m compileall -q backend || python -m compileall -q .
          python3 - <<'PY'
          import json
          import time
          payload = {
              'node_id': 'ios-build-${{ github.run_id }}',
              'timestamp': int(time.time()),
              'build_ref': '${{ github.sha }}',
              'platform': 'iOS',
              'execution': 'github-hosted-ignition',
              'native_xcode_compile': True,
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          print(json.dumps(payload, indent=2))
          PY
      - name: Verify validation manifest
        run: |
          test -s ios-build-manifest.json
          python3 -m json.tool ios-build-manifest.json >/dev/null
      - name: Emit handoff artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-handoff-${{ github.run_id }}
          path: ios-build-manifest.json
          retention-days: 7
          if-no-files-found: error

  sovereign-shift:
    name: macOS-latest native Xcode build (device)
    needs: ignition
    if: needs.ignition.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify macOS runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "macOS"
          echo "Execution mode: macOS sovereign build"
          echo "Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install Ruby deps (fastlane)
        run: |
          set -Eeuo pipefail
          if [ -f Gemfile ]; then bundle install; fi
      - name: Build iOS (deployment)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f Makefile ]; then make ios-build; fi
          if [ -f scripts/ios-build.sh ]; then bash scripts/ios-build.sh; fi
          if [ -d ios ] || [ -d "*.xcodeproj" ] || [ -d "*.xcworkspace" ]; then
            xcodebuild -scheme "${IOS_SCHEME:-App}" -configuration Release -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
          else
            echo "No Xcode project found; ignition-only pass"
          fi
