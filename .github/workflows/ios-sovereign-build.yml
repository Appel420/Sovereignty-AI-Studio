name: iOS Sovereign Build (local-first)

on:
  push:
    branches: [main, Collaboration, GPT/Codex]
  pull_request:
    branches: [main, Collaboration, GPT/Codex]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .:./backend

concurrency:
  group: ios-sovereign-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  swift-validation:
    name: Sovereign iOS Swift Validation
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without third-party Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Verify Swift toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build Swift package
        working-directory: ios
        run: swift build

      - name: Run Swift tests
        working-directory: ios
        run: swift test

      - name: Generate validation manifest
        run: |
          python3 - <<'PY'
          import json, os, time
          payload = {
              'node_id': 'ios-build-' + os.environ['GITHUB_RUN_ID'],
              'timestamp': int(time.time()),
              'build_ref': os.environ['GITHUB_SHA'],
              'platform': 'iOS',
              'execution': 'macos-swift-package-validation',
              'native_xcode_compile': False,
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
          }
          with open('ios-build-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
          PY
