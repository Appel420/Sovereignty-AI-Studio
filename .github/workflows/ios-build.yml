name: iOS Build

on:
  push:
    branches: [ main, Collaboration ]
    paths:
      - 'ios/**'
      - 'src/native/**'
  pull_request:
    branches: [ main, Collaboration ]
    paths:
      - 'ios/**'
      - 'src/native/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-validation:
    name: iOS package validation
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate iOS source presence
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d ios ]; then
            find ios -maxdepth 2 -type f | head -100
          else
            echo "ios/ not present on this branch; native macOS compilation is not claimed."
          fi
          if [ -d src/native ]; then
            find src/native -maxdepth 2 -type f | head -100
          fi
      - name: Record compile limitation explicitly
        run: echo "Native Xcode/xcodebuild compilation requires a macOS runner; this Linux CI job performs source/package validation only."
