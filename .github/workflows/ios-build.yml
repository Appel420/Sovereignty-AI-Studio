name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-validation:
    name: iOS package validation (manual)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      
      - name: Validate source presence
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d ios ]]; then find ios -maxdepth 3 -type f -print | head -100; else echo 'No ios/ directory exists; source validation not applicable.'; fi
      - name: Validate Swift syntax when Swift sources exist
        shell: bash
        run: |
          set -Eeuo pipefail
          if find ios -type f -name '*.swift' -print -quit 2>/dev/null | grep -q .; then
            while IFS= read -r -d '' file; do xcrun swiftc -parse "$file"; done < <(find ios -type f -name '*.swift' -print0)
          else echo 'No Swift source files found; native source parse not applicable.'; fi
