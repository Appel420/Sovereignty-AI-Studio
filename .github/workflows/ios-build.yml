name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-validation:
    name: iOS package validation
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate iOS source presence
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d ios ]; then
            find ios -maxdepth 2 -type f | head -100
          else
            echo 'ios directory not present; package-presence validation skipped.'
          fi
