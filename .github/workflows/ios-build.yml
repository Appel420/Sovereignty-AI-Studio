name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, dev]
  pull_request:
    branches: [Collaboration, main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Keep validation runs visible; a newer event must not silently replace an older run.
concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-validation:
    name: iOS package validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record execution provenance
        run: |
          echo "Execution mode: Linux hosted source/package validation"
          echo "Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Runner name: ${RUNNER_NAME}"
          echo "Run ID: ${GITHUB_RUN_ID}"
      - name: Validate iOS source presence
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d ios ]; then
            find ios -maxdepth 2 -type f | head -100
          else
            echo "ios/ not present on this branch; native macOS compilation is not claimed."
          fi
          if [ -d src/native ]; then
            find src/native -maxdepth 2 -type f | head -100
          fi
      - name: Record compile limitation explicitly
        run: echo "Native Xcode/xcodebuild compilation requires a macOS runner; this Linux CI job performs source/package validation only."
