name: iOS Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  package-validation:
    name: iOS package validation
    runs-on: 'self-hosted''ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Validate iOS source presence
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d ios ]; then
            find ios -maxdepth 2 -type f | head -100
          else
          fi
