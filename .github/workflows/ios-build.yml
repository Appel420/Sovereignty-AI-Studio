name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'src/native/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'src/native/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # Owner policy: self-hosted Linux ARM64 only. No GitHub-hosted runners.
    # Xcode is not available on Linux; this job validates checkout and reports skip.
    runs-on: ['self-hosted Linux arm64']
    steps:
    - uses: actions/checkout@v4

    - name: Report iOS build path on owner runner
      run: |
        echo "Runner: self-hosted Linux arm64 (owner policy)"
        echo "Xcode/xcodebuild are macOS-only. Native iOS compile is not executed on this runner."
        if [ -d ios ]; then
          echo "ios/ present — package structure check only"
          ls -la ios | head -20
        else
          echo "ios/ not present on this branch"
        fi
