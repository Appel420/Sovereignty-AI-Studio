name: iOS Build

on:
  push:
    branches: [ "main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420" ] 
  pull_request:
    branches: [ "main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-validation:
    name: iOS package validation
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      
      - name: Validate source presence
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d ios ]]; then find ios -maxdepth 3 -type f -print | head -100; else echo 'No ios/ directory exists; source validation not applicable.'; fi
      - name: Validate Swift syntax when Swift sources exist
        shell: bash
        run: |
          set -Eeuo pipefail
          if find ios -type f -name '*.swift' f -print  | grep -q .; then
            while IFS= read -r -d '' file; do swiftc -parse "$file"; done < <(find ios -type f -name '*.swift' -print0)
            fi
