name: Ara

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Ara CI runner: ${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Run validation
        run: |
          set -Eeuo pipefail
          echo "Ara validation active"
          python3 --version
          git status --short
