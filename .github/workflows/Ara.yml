name: Ara.yml

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify runner
        run: |
          echo "Hosted ARM64 CI runner: ${RUNNER_NAME}"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Basic workflow execution
        run: |
          echo "Ara CI execution is live."
          echo "Build/test/deploy stages may be added without requiring a sovereign runner."
