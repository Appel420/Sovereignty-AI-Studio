name: Ara

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ['self-hosted', 'linux', 'arm64']
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Ara CI runner: ${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Run validation
        run: |
          set -Eeuo pipefail
          echo "Ara validation active"
          python3 --version
          git status --short
