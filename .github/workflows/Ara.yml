name: Ara

on:
  workflow_dispatch:
  push:
    branches: ["Collaboration, ara-hardened, main, dev, copilot/main"]
  pull_request:
    branches: ["Collaboration, ara-hardened, main, dev, copilot/main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Ara CI runner: ${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Run validation
        run: |
          set -Eeuo pipefail
          echo "Ara validation active"
          python3 --version
          git status --short
