name: Ara

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ara:
    name: Ara validation (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without external action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD
          
      - name: Verify runner
        run: test "${RUNNER_OS}" = "Linux"
      - name: Validate first-party Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do python3 -m py_compile "$file"; done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.venv/**')
          echo 'Ara Python syntax validation: PASS'
