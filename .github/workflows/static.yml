name: Static Content Validation

# GitHub Pages deployment requires GitHub-owned actions, which are prohibited
# by this repository's owner-only action policy. Validate the publish surface here.
on:
  push:
    branches: [Collaboration, main, dev]
    paths:
      - 'docs/**'
      - '*.html'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '!.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Validate static files
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Parser(HTMLParser):
              pass

          files = [*Path('.').glob('*.html'), *Path('docs').rglob('*.html') if Path('docs').exists() else []]
          for path in files:
              Parser().feed(path.read_text(encoding='utf-8', errors='strict'))
          print(f'validated {len(files)} HTML files')
          PY
