name: Ara_ci.yml

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]

concurrency:
  group: hardened-unit-ci-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_NAME: Ara_ci.yml
  CI_MODE: local
  SGNETWORKMODE: local
  SGLOCALONLY: '1'
  PIPDISABLEPIPVERSIONCHECK: '1'

jobs:
  light:
    name: Visible local coordination and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Startup verification
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "Running visible CI for ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
      - name: Set up isolated Python
        shell: bash
        run: |
          set -Eeuo pipefail
          python_bin="$(command -v python3.13 || command -v python3)"
          "${python_bin}" -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          "${GITHUB_WORKSPACE}/.venv/bin/python" --version
      - name: Install minimal test tools
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip pytest
      - name: Coordination import check
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from backend.coordination import BranchRegistry
          registry = BranchRegistry()
          assert not registry.is_writable('main')
          assert not registry.is_writable('collaboration')
          print('coordination OK')
          PY
