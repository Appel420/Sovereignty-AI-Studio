name: Ara CI (local coordination)

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]

permissions:
  contents: read

concurrency:
  group: ara-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  light:
    name: Local coordination and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          git init "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

          git status --short --branch
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Startup verification
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          echo "Running Ara CI for ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

      - name: Set up isolated Python
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

          . .venv/bin/activate
          python --version
          python -m pip --version

      - name: Install minimal test tools
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Coordination import check
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import sys

          sys.path.insert(0, ".")

          from backend.coordination import BranchRegistry

          registry = BranchRegistry()

          print("coordination OK")
          print(f"BranchRegistry: {registry!r}")
          PY
