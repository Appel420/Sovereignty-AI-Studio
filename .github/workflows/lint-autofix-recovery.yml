name: Lint Autofix Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-autofix-recovery:
    name: Lint autofix recovery / visible execution
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Report workflow state
        run: |
          set -euo pipefail
          echo "WORKFLOW_VISIBLE=true"
          echo "WORKFLOW_FILE=.github/workflows/lint-autofix-recovery.yml"
          echo "RECOVERY_MODE=VISIBLE"
          echo "ORIGINAL_IMPLEMENTATION_REQUIRES_RESTORATION=true"
