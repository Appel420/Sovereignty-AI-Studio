name: repository-watchdog.yml

on:
  push:
    branches: [Collaboration]
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - 'cd-sovereign.yml'
      - 'oauth-api-generator.yaml'
      - 'SCAR.yml — Sovereign Compliance Audit Record'
      - 'CI — Sovereign Device Validation'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    name: Watch required sovereign lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Watchdog startup — visible
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name || 'direct watchdog invocation' }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || 'applicable' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          printf 'WATCHDOG_STATUS=STARTED\n'
          printf 'WATCHDOG_EVENT=%s\n' "$EVENT_NAME"
          printf 'WATCHDOG_WORKFLOW=%s\n' "$WORKFLOW"
          printf 'WATCHDOG_RUN_ID=%s\n' "$RUN_ID"
          printf 'WATCHDOG_CONCLUSION=%s\n' "$CONCLUSION"
          printf 'WATCHDOG_HEAD_SHA=%s\n' "$HEAD_SHA"
          {
            echo '## Repository Watchdog'
            echo
            echo "- **Status:** STARTED"
            echo "- **Event:** ${EVENT_NAME}"
            echo "- **Workflow:** ${WORKFLOW}"
            echo "- **Run:** ${RUN_ID}"
            echo "- **Commit:** ${HEAD_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout exact inspected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Verify required workflow inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          required_workflows=(cd-sovereign.yml ci-sovereign.yml ci.yml oauth-api-generator.yaml scar.yml repository-watchdog.yml)
          for required in "${required_workflows[@]}"; do
            test -f ".github/workflows/$required" || { echo "Missing workflow: $required" >&2; exit 1; }
            printf 'WORKFLOW_PRESENT=%s\n' "$required"
          done
          echo 'Required sovereign workflow inventory: PASS'
      - name: Verify runner contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/ci.yml
          test -f .github/workflows/python-ci.yml
          test -f .github/workflows/ios-sovereign-build.yml
          test -f .github/workflows/Quart.yml
          grep -Fq 'runs-on: ubuntu-latest' .github/workflows/ci.yml
          grep -Fq 'runs-on: ubuntu-latest' .github/workflows/python-ci.yml
          grep -Fq 'runs-on: macos-latest' .github/workflows/ios-sovereign-build.yml
          grep -Fq 'runs-on: ubuntu-latest' .github/workflows/Quart.yml
          grep -Fq 'runs-on: ubuntu-latest' .github/workflows/repository-watchdog.yml
          echo 'RUNNER_CONTRACTS=PASS'
      - name: Final watchdog result — visible
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'WATCHDOG_STATUS=PASS\n'
          printf 'WATCHDOG_RESULT=ALL_REQUIRED_LANES_VISIBLE_AND_VERIFIED\n'
