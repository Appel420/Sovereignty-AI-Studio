name: Repository Watchdog — Sovereign Maintenance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - cd-sovereign.yml
      - oauth-api-generator.yaml
      - SCAR — Sovereign Compliance Audit Record
      - CI — Sovereign Device Validation
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Watch required sovereign lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect triggering run
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          printf 'WATCHDOG event=%s workflow=%s run=%s conclusion=%s head_sha=%s\n' "$EVENT_NAME" "$WORKFLOW" "$RUN_ID" "$CONCLUSION" "$HEAD_SHA"
          if [[ "$EVENT_NAME" == workflow_run && "$CONCLUSION" != success && "$CONCLUSION" != neutral && "$CONCLUSION" != skipped ]]; then
            echo "Required sovereign workflow failed: $WORKFLOW (run $RUN_ID)" >&2
            exit 1
          fi

      - name: Verify required workflow files locally
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

          required_workflows=(
            cd-sovereign.yml
            oauth-api-generator.yaml
            scar.yml
            repository-watchdog.yml
          )
          for required in "${required_workflows[@]}"; do
            test -f ".github/workflows/$required" || {
              echo "Required workflow missing: $required" >&2
              exit 1
            }
          done
          echo 'Required sovereign workflow inventory: PASS'
          printf 'Checked commit: %s\n' "$CHECKOUT_SHA"

      - name: Verify architecture invariants locally
        env:
          CHECKOUT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd_workflow="$(cat .github/workflows/cd-sovereign.yml)"
          ci_workflow="$(cat .github/workflows/ci-sovereign.yml)"
          oauth_workflow="$(cat .github/workflows/oauth-api-generator.yaml)"
          grep -Fq 'runs-on: ubuntu-24.04-arm' <<<"$cd_workflow"
          grep -Fq 'test "${RUNNER_ARCH}" = ARM64' <<<"$cd_workflow"
          grep -Fq 'test "$(uname -m)" = aarch64' <<<"$cd_workflow"
          grep -Fq 'runs-on: [self-hosted, Linux, ARM64]' <<<"$ci_workflow"
          grep -Fq 'name: OAUTH — local contract' <<<"$oauth_workflow"
          echo 'Architecture invariants: PASS'
          printf 'Architecture commit: %s\n' "$CHECKOUT_SHA"
