name: Repository Watchdog

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: Repository Watchdog (visible)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Watchdog startup — visible
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'WATCHDOG_STATUS=STARTED\n'
          printf 'WATCHDOG_EVENT=%s\n' "${GITHUB_EVENT_NAME}"
          printf 'WATCHDOG_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
          printf 'WATCHDOG_HEAD_SHA=%s\n' "${GITHUB_SHA}"
      - name: Checkout exact inspected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify workflow inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          required_workflows=(ci.yml ci-sovereign.yml python-ci.yml repository-watchdog.yml)
          for required in "${required_workflows[@]}"; do
            test -f ".github/workflows/$required"
            printf 'WORKFLOW_PRESENT=%s\n' "$required"
          done
      - name: Verify executable workflow boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .github/workflows
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort
          echo 'WORKFLOW_BOUNDARY=PASS'
      - name: Final watchdog result — visible
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'WATCHDOG_STATUS=PASS\n'
          printf 'WATCHDOG_RESULT=VISIBLE_COLLABORATION_WORKFLOW_BOUNDARY_VERIFIED\n'
