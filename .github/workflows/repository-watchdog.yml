name: Repository Watchdog

on:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    name: Repository Watchdog (visible)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Watchdog startup — visible
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'WATCHDOG_STATUS=STARTED\n'
          printf 'WATCHDOG_EVENT=%s\n' "${GITHUB_EVENT_NAME}"
          printf 'WATCHDOG_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
          printf 'WATCHDOG_HEAD_SHA=%s\n' "${GITHUB_SHA}"
      - name: Checkout exact inspected commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Verify workflow inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          required_workflows=(ci.yml ci-sovereign.yml python-ci.yml Quart.yml)
          for required in "${required_workflows[@]}"; do
            test -f ".github/workflows/$required"
            printf 'WORKFLOW_PRESENT=%s\n' "$required"
          done
      - name: Verify workflow policy
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE '^[[:space:]]*uses:[[:space:]]*[^@[:space:]]+@(v[0-9]+|[0-9]+\.[0-9]+\.[0-9]+)$' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Unpinned GitHub Action reference detected.' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*group:.*(rm[[:space:]]+-rf|git[[:space:]]|bash[[:space:]]|sh[[:space:]])' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Shell command detected inside concurrency group.' >&2
            exit 1
          fi
          echo 'WORKFLOW_POLICY=PASS'
      - name: Final watchdog result — visible
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'WATCHDOG_STATUS=PASS\n'
          printf 'WATCHDOG_RESULT=VISIBLE_WORKFLOW_POLICY_VERIFIED\n'
