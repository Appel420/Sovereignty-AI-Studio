name: Repository Watchdog — Sovereign Maintenance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - cd-sovereign.yml
      - oauth-api-generator.yaml
      - SCAR — Sovereign Compliance Audit Record
      - CI — Sovereign Device Validation
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watch:
    name: Watch required sovereign lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect triggering run
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          printf 'event=%s workflow=%s run=%s conclusion=%s\n' "$EVENT_NAME" "$WORKFLOW" "$RUN_ID" "$CONCLUSION"
          if [[ "$EVENT_NAME" == workflow_run && "$CONCLUSION" != success && "$CONCLUSION" != neutral && "$CONCLUSION" != skipped ]]; then
            echo "Required sovereign workflow failed: $WORKFLOW (run $RUN_ID)" >&2
            exit 1
          fi

      - name: Resolve verification ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == workflow_run && -n "$WORKFLOW_RUN_BRANCH" ]]; then
            target_ref="$WORKFLOW_RUN_BRANCH"
          elif [[ -n "$REF_NAME" && "$REF_NAME" != "" ]]; then
            target_ref="$REF_NAME"
          else
            target_ref="$DEFAULT_BRANCH"
          fi
          [[ -n "$target_ref" ]] || { echo 'Unable to resolve a verification ref' >&2; exit 1; }
          printf 'target_ref=%s\n' "$target_ref"
          printf 'target_ref=%s\n' "$target_ref" >> "$GITHUB_OUTPUT"

      - name: Verify required workflow files remain present
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.ref.outputs.target_ref }}
        run: |
          set -Eeuo pipefail
          mapfile -t workflows < <(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows" \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              -f "ref=${TARGET_REF}" \
              --jq '.[].name'
          )

          required_workflows=(
            cd-sovereign.yml
            ci-sovereign.yml
            oauth-api-generator.yaml
            scar.yml
            repository-watchdog.yml
          )

          for required in "${required_workflows[@]}"; do
            if ! printf '%s\n' "${workflows[@]}" | grep -Fxq "$required"; then
              echo "Required workflow missing at ref ${TARGET_REF}: $required" >&2
              exit 1
            fi
          done
          echo "Required sovereign workflow inventory: PASS (ref=${TARGET_REF})"

      - name: Load workflow source at verified ref
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.ref.outputs.target_ref }}
        run: |
          set -Eeuo pipefail
          fetch_workflow() {
            local path="$1"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              -f "ref=${TARGET_REF}" \
              --jq '.content' | tr -d '\n' | base64 --decode
          }

          fetch_workflow .github/workflows/cd-sovereign.yml > "$RUNNER_TEMP/cd-sovereign.yml"
          fetch_workflow .github/workflows/ci-sovereign.yml > "$RUNNER_TEMP/ci-sovereign.yml"
          fetch_workflow .github/workflows/oauth-api-generator.yaml > "$RUNNER_TEMP/oauth-api-generator.yaml"

      - name: Verify architecture invariants
        run: |
          set -Eeuo pipefail
          cd_workflow="$(cat "$RUNNER_TEMP/cd-sovereign.yml")"
          ci_workflow="$(cat "$RUNNER_TEMP/ci-sovereign.yml")"
          oauth_workflow="$(cat "$RUNNER_TEMP/oauth-api-generator.yaml")"

          grep -Fq 'runs-on: ubuntu-24.04-arm' <<<"$cd_workflow"
          grep -Fq 'test "${RUNNER_ARCH}" = "ARM64"' <<<"$cd_workflow"
          grep -Fq 'test "$(uname -m)" = "aarch64"' <<<"$cd_workflow"
          grep -Fq 'runs-on: ubuntu-latest' <<<"$ci_workflow"
          grep -Fq 'name: OAUTH — local contract' <<<"$oauth_workflow"
          echo 'Architecture invariants: PASS'
