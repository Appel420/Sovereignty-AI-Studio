name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [Collaboration, main, dev, copilot/main]

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest ruff

      - name: Repository lint report
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          [[ -d backend ]] && targets+=(backend)
          [[ -d prototypes/accessibility ]] && targets+=(prototypes/accessibility)
          if (( ${#targets[@]} )); then
            ruff check "${targets[@]}" --output-format=github || {
              echo 'Ruff reported existing lint debt; test execution remains authoritative.'
            }
          fi

      - name: Python tests
        env:
          PYTHONPATH: prototypes:.:src:backend
        shell: bash
        run: python -m pytest -q

      - name: Coordination import check
        env:
          PYTHONPATH: prototypes:.:src:backend
        run: python -c "from backend.coordination import BranchRegistry; print('coordination import: ok')"
