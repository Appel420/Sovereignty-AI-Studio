name: Python CI
on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: Linux Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]" || pip install ruff mypy pytest
      - name: Lint
        run: ruff check . || true
      - name: Type check
        run: mypy . || true
      - name: Run tests
        run: pytest || true