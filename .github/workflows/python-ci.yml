name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [ copilot/main, main, dev, ara-hardened, Collaboration ]
  pull_request:
    branches: [ copilot/main, main, dev, ara-hardened, Collaboration ]

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: False

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted linux ARM64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test/lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e '.[test,lint]'
      - name: Lint
        run: ruff check backend/coordination prototypes/accessibility
      - name: Run focused tests
        env:
          PYTHONPATH: prototypes:.
        run: pytest -q prototypes/accessibility/tests/test_accessibility_control.py
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
      - name: Create CI manifest
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json
          manifest = {
              'workflow': 'Python CI',
              'run_id': '${{ github.run_id }}',
              'sha': '${{ github.sha }}',
              'ref': '${{ github.ref }}',
              'execution': 'github-hosted',
              'device_independent': True,
              'signing_backend': 'hmac-sha256-ci-local',
          }
          key = b'ci-manifest-local-verification'
          message = json.dumps(manifest, sort_keys=True).encode()
          manifest['signature'] = hmac.new(key, message, hashlib.sha256).hexdigest()
          with open('python-ci-manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(manifest, fh, indent=2)
          PY
      - name: Upload Test Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ci-manifest-${{ github.run_id }}
          path: python-ci-manifest.json
          retention-days: 30
          if-no-files-found: error
