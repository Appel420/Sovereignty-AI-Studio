name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [ara-hardened, Collaboration, GPT/Codex, DevAssist420, copilot/main]
  pull_request:
    branches: [ara-hardened, Collaboration, GPT/Codex, DevAssist420, copilot/main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONPATH: .:./backend:./src:./prototypes

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Python runtime
        run: |
          python --version
          python -m pip --version

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Verify dependency closure
        run: python -m pip check

      - name: Verify critical imports
        run: |
          python - <<'PY'
          import fastapi
          import nacl
          import pydantic
          import jose
          import quart
          import pytest_asyncio
          print('critical imports: OK')
          PY

      - name: Python syntax gate
        run: python -m compileall -q backend apps scripts tests

      - name: Test collection gate
        run: python -m pytest --collect-only -q tests

      - name: Run tests
        run: python -m pytest -q tests

      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('coordination import: OK')"
