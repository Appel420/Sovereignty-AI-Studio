name: python-ci.yml 

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
    paths:
      - 'backend/**'
      - 'apps/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [Collaboration]
    paths:
      - 'backend/**'
      - 'apps/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/python-ci.yml'

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONPATH: .:./backend:./src:./prototypes

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Verify Python runtime
        run: |
          python --version
          python -m pip --version

      - name: Install canonical repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Verify dependency closure
        run: python -m pip check

      - name: Verify required imports and versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import fastapi
          import nacl
          import pydantic
          import quart
          import pytest
          import pytest_asyncio

          expected = {
              'fastapi': '0.139.2',
              'PyNaCl': '1.6.2',
              'pydantic': '2.13.4',
              'quart': '0.20.0',
          }
          for package, required in expected.items():
              actual = version(package)
              print(f'{package}: {actual}')
              assert actual == required, f'{package}: expected {required}, got {actual}'

          print('pytest:', version('pytest'))
          print('pytest-asyncio:', version('pytest-asyncio'))
          print('required imports and versions: PASS')
          PY

      - name: Python syntax gate
        run: python -m compileall -q backend apps scripts tests

      - name: I-008 contract gate
        run: python scripts/verify_i008_contract.py

      - name: Test collection gate
        run: python -m pytest --collect-only -q tests

      - name: Test suite
        run: python -m pytest -q tests

      - name: Quart application smoke test
        run: |
          python - <<'PY'
          from apps.dashboards.weather_dashboard import app
          client = app.test_client()
          assert client is not None
          print('Quart application import and test client: PASS')
          PY

      - name: Coordination import check
        run: |
          python -c "from backend.coordination import BranchRegistry; print('coordination import: PASS')"
