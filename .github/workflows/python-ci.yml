name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify Python runtime
        run: python --version
      - name: Install test/lint tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d backend ]]; then ruff check backend; fi
          if [[ -d prototypes/accessibility ]]; then ruff check prototypes/accessibility; fi
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
