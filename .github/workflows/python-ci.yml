name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[test,lint]'
          python -m pip check
      - name: Verify required imports
        run: |
          python - <<'PY'
          import fastapi, nacl, pydantic, quart, pytest, pytest_asyncio
          print('required imports: PASS')
          PY
      - name: Python syntax gate
        run: python -m compileall -q backend apps scripts tests
      - name: I-008 contract gate
        run: python scripts/verify_i008_contract.py
      - name: Test collection gate
        run: python -m pytest --collect-only -q tests
      - name: Test suite
        run: python -m pytest -q tests
      - name: Quart application smoke test
        run: |
          python - <<'PY'
          from apps.dashboards.weather_dashboard import app
          client = app.test_client()
          assert app is not None and client is not None
          print('Quart application import and test client: PASS')
          PY
      - name: Coordination import check
        run: python -c 'from backend.coordination import BranchRegistry; print("coordination import: PASS")'
