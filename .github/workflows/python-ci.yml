name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install project test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --no-cache-dir -e ".[test]"
          python -m pip install --no-cache-dir ruff pytest

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          ruff check backend/coordination prototypes/accessibility

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: python -m pytest -q

      - name: Coordination import check
        shell: bash
        run: python -c "from backend.coordination import BranchRegistry; print('Coordination import: ok')"
