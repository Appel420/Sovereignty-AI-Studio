name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [Collaboration, main, dev, copilot/main]

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e '.[test,lint]'
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install -r .github/workflows/Requirements.txt
          fi
          python -m pip install ruff pytest
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d backend ]]; then ruff check backend; fi
          if [[ -d prototypes/accessibility ]]; then ruff check prototypes/accessibility; fi
      - name: Run tests
        env:
          PYTHONPATH: .:src:backend:prototypes
        run: python -m pytest -q
      - name: Coordination import check
        env:
          PYTHONPATH: .:src:backend:prototypes
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
