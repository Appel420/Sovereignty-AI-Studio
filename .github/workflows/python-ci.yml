name: Python CI

on:
  workflow_dispatch:
  pull_request:
    branches: [Collaboration]

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Runner evidence
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
          echo "SHA=${GITHUB_SHA}"
      - name: Install test tools
        run: python3 -m pip install --disable-pip-version-check pytest ruff
      - name: Lint
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do [[ -e "$directory" ]] && targets+=("$directory"); done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check .; fi
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python3 -m pytest -q tests
      - name: Coordination import check
        run: python3 -c "from backend.coordination import branch_registry; print('Coordination import: ok')"
