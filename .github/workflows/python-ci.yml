name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, GPT/Codex]
  pull_request:
    branches: [Collaboration, GPT/Codex]

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate-hosted:
    name: Python CI — hosted validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify runner execution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "Execution mode: portable hosted"
          echo "Actual runner: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Runner name: ${RUNNER_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test/lint tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
          python -m pip check

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d backend ]]; then ruff check backend; fi
          if [[ -d prototypes/accessibility ]]; then ruff check prototypes/accessibility; fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q

      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('coordination import OK')"

  validate-sovereign:
    name: Sovereign Linux ARM64 validation
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify sovereign runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          echo "Execution mode: sovereign self-hosted"
          echo "Required semantic runner: self-hosted, linux arm64"
          echo "Actual labels: self-hosted / Linux / ARM64"
          echo "Runner name: ${RUNNER_NAME}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test/lint tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
          python -m pip check

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d backend ]]; then ruff check backend; fi
          if [[ -d prototypes/accessibility ]]; then ruff check prototypes/accessibility; fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q

      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('coordination import OK')"
