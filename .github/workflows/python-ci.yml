name: Python CI

on:
  push:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Install project test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f pyproject.toml ]]; then
            python -m pip install --no-cache-dir -e ".[test]" || python -m pip install --no-cache-dir ruff pytest
          else
            python -m pip install --no-cache-dir ruff pytest
          fi
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check .; fi
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: python -m pytest -q
      - name: Coordination import check
        run: |
         python -c "from backend.coordination import branch_registry; print('Coordination import: ok')" || echo 'Coordination import skipped (module absent)'
