name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -Eeuo pipefail
          git init .; git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"; git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"; git checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Python syntax gate
        run: python -m compileall -q .
      - name: Run tests
        env: {PYTHONPATH: prototypes:.}
        run: python -m pytest -q tests
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
