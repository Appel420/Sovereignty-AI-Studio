name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    # Python syntax/tests do not require the sovereign runner. Using a hosted
    # runner prevents a burst of PR checks from queueing behind one ephemeral
    # self-hosted agent.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test/lint tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
      - name: Syntax and critical lint
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q backend
          ruff check backend --select E9,F63,F7,F82 --output-format concise
          if [[ -d prototypes/accessibility ]]; then
            ruff check prototypes/accessibility --select E9,F63,F7,F82 --output-format concise
          fi
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
