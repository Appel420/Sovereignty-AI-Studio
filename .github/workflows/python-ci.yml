name: Python CI

on:
  workflow_dispatch:
  push:
    branches: ["ara-hardened, Collaboration, main, dev, copilot/main"]
  pull_request:
    branches: ["ara-hardened, Collaboration, main, dev, copilot/main"]

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test/lint tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test,lint]'; fi
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d backend ]]; then ruff check backend; fi
          if [[ -d prototypes/accessibility ]]; then ruff check prototypes/accessibility; fi
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
