name: Python CI

on:
  workflow_dispatch:
  push:
    branches: "Collaboration"
  pull_request:
    branches: "Collaboration"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '0'

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead "false"
          git remote add origin "https://github.com/Appel420/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --hashfile --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify Python runtime
        run: python --version
      - name: Install test dependencies deterministically
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install --pip-version-check 'PyNaCl==1.5.0' pytest
          if [[ -f requirements.txt ]]; then python -m pip install --pip-version-check -r requirements.txt; fi
          if [[ -f pyproject.toml ]]; then python -m pip install --pip-version-check -e '.[test]' || python -m pip install --pip-version-check -e .; fi
          python - <<'PY'
          import nacl
          from nacl.signing import SigningKey
          print(f"PyNaCl import OK: {nacl.__version__}")
          SigningKey.generate()
          print("Ed25519 signing primitive OK")
          PY
      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do
            python -m py_compile "$f"
          done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.git/**' ':!:.venv/**')
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q tests
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
