name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]
  pull_request:
    branches: [ara-hardened, Collaboration, main, dev, copilot/main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify Python runtime
        run: python --version
      - name: Install test tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [[ -f pyproject.toml ]]; then python -m pip install -e '.[test]' || python -m pip install -e .; fi
      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          excluded = {'.git', '.venv', 'venv', 'env', 'ENV', 'external', 'vendor', 'node_modules', 'build', 'dist', 'downloads', 'eggs', '.eggs', 'site-packages', '__pycache__'}
          output = subprocess.run(['git', 'ls-files', '-z', '--', '*.py'], check=True, capture_output=True).stdout
          files = []
          for raw in output.split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if not any(part in excluded for part in path.parts):
                  files.append(path)

          failures = []
          for path in files:
              proc = subprocess.run([sys.executable, '-m', 'py_compile', str(path)], text=True, capture_output=True)
              if proc.returncode:
                  failures.append((str(path), proc.stderr))

          print(f'first-party Python files checked: {len(files)}')
          if failures:
              for path, stderr in failures:
                  print(f'\n--- PYTHON SYNTAX FAILURE: {path} ---')
                  print(stderr, end='')
              raise SystemExit(f'{len(failures)} Python file(s) failed compilation')
          print('Python syntax gate OK')
          PY
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('ok')"
