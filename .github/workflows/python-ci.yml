name: Python CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python CI manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .git
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -e ".[test]"
          python -m pip install --no-cache-dir ruff pytest
          python -m pip check
      - name: Lint
        shell: bash
        run: ruff check backend/coordination prototypes/accessibility
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: python -m pytest -q
      - name: Coordination import check
        shell: bash
        run: python -c "from backend.coordination import branch_registry; print('Coordination import: ok')"
