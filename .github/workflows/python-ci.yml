name: Python CI

on:
  push:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install project test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e ".[test]" || python -m pip install ruff pytest
          else
            python -m pip install ruff pytest
          fi

      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then
            ruff check "${targets[@]}"
          else
            ruff check .
          fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q

      - name: Coordination import check
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c "from backend.coordination import branch_registry; print('Coordination import: ok')"
