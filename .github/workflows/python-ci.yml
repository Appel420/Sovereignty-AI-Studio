name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python CI (self-hosted)
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify local runner
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Set up isolated Python environment
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Install project test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --no-cache-dir -e ".[test]"
          python -m pip install --no-cache-dir ruff pytest
      - name: Lint
        run: ruff check backend/coordination prototypes/accessibility
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q
      - name: Coordination import check
        run: python -c "from backend.coordination import BranchRegistry; print('Coordination import: ok')"
