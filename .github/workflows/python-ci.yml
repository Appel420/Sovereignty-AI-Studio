name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    # Portable default. Set SOVEREIGN_CI_RUNNER=self-hosted Linux arm64
    # when a registered sovereign runner is available.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test/lint tools
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify local runner
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
      - name: Set up isolated Python environment
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Install project test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --no-cache-dir -e ".[test]"
          python -m pip install --no-cache-dir ruff pytest
      - name: Lint
        run: ruff check backend/coordination prototypes/accessibility
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: python -m pytest -q
  python -c "from backend.coordination import branch_registry; print('Coordination import: 'ok')"
