name: PyCharm Python Security

on:
  push:
    branches: [main, Collaboration, GPT/Codex]
  pull_request:
    branches: [main, Collaboration, GPT/Codex]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_EXECUTION_MODE: connected
  SG_NETWORK_MODE: online

jobs:
  pycharm-security:
    name: PyCharm Python Security Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: PyCharm Python Security Scanner
        uses: tonybaloney/pycharm-security@1.25.1
        with:
          path: .
          fail_on_warnings: no
          source: .
          requirements: requirements.txt
