; Sovereignty AI Studio — PHPWin/iOS local profile
; Apply with: php -c config/php/local.ini
; For PHPWin embedded serving, copy the safe directives into the app's
; supported per-directory/user configuration mechanism (for example .user.ini).

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = logs/php-error.log

; Local mode: application code must still enforce destination allowlists.
allow_url_include = Off
allow_url_fopen = Off

; Keep uploads bounded for the embedded iOS server.
file_uploads = On
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20
max_execution_time = 90
memory_limit = 256M

; Safer session defaults for the local HTTPS dashboard.
session.use_strict_mode = On
session.use_only_cookies = On
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax

; Do not allow runtime extension loading or remote includes.
enable_dl = Off
allow_url_include = Off
