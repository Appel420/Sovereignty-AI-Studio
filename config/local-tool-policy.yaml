# Local tool policy
# The model may request tools, but only this local dispatcher executes them.
default_enabled: false
network: disabled
workspace_required: true
allowed_tools:
  - cat
  - echo
  - grep
  - ls
denied_tools:
  - bash
  - curl
  - chmod
  - chown
  - git
  - nohup
  - node
  - python
  - rm
  - rustc
  - sh
  - shell
  - sudo
  - xcode
