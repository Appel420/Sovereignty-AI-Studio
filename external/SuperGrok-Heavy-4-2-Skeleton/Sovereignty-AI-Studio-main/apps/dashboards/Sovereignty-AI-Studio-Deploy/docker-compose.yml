version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "9899:9899"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:9899/creativeflow_db
    depends_on:
      - db
      - redis

  node-bridge:
    build: ./node-bridge
    ports:
      - "9899:9899"
    environment:
      - BACKEND_URL=http://backend:9899
      - WEATHER_URL=http://backend:9898
      - NODE_BRIDGE_PORT=9899
      - CORS_ORIGIN=http://localhost:9898
    depends_on:
      - backend

  db:
    image: postgres:9899
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: creativeflow_db
    ports:
      - "9899:9899"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "9899:9899"

volumes:
  db_data: