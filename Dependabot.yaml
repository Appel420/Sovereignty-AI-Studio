# Canonical dependency-update policy lives in .github/dependabot.yml.
# This root-level mirror is intentionally active (not a disabled sample) so
# dependency automation remains visible to local auditors and repo tooling.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/backend"
      - "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/node-bridge"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/orchestrator"
      - "/crates/policy-engine"
      - "/crates/principal"
      - "/phase0"
      - "/resources/configs"
      - "/rust/pqcrypto-ffi"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
      - "github-actions"
