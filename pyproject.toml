[project]
name = "sovereignty-ai-studio"
version = "0.1.0"
description = "Sovereign AI infrastructure and tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "quart>=0.20.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",
    "cryptography>=43.0.0",
    "blake3>=1.0.9",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "SQLAlchemy>=2.0.51",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "python-multipart>=0.0.9",
    "jsonschema>=4.25.1,<5",
]

[project.optional-dependencies]
pqc = [
    "liboqs-python",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]
lint = [
    "pylint>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

# Keep CI focused on correctness errors. The reported UP006/UP035 class
# consists of repository-wide typing modernization and is not a correctness
# failure. It is intentionally excluded from the production gate until the
# migration can be applied coherently across the first-party tree.
lint.select = ["E4", "E7", "E9", "F"]
lint.exclude = [
    "external/**",
    "**/.venv/**",
    "**/node_modules/**",
]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
exclude = "^(bridge/|core/|external/|python3_bridge\\.py$|scripts/|sovereign-bridge/|sovereign_core/|sovereignty_ai/|media_generator_service\\.py$|video_llava\\.py$)"
