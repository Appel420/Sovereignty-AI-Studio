[project]
name = "sovereignty-ai-studio"
version = "0.1.0"
description = "Sovereign AI infrastructure and tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "quart==0.20.0",
    "uvicorn[standard]==0.51.0",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "cryptography==50.0.1",
    "blake3==1.0.9",
    "argon2-cffi==25.1.0",
    "PyNaCl==1.6.2",
    "pyjwt==2.13.0",
    "passlib[bcrypt]==1.7.4",
    "SQLAlchemy[asyncio]==2.0.51",
    "redis==8.0.1",
    "requests==2.34.2",
    "httpx==0.28.1",
    "aiohttp==3.14.3",
    "websockets==16.1.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "jsonschema>=4.25.1,<5",
    "numpy==2.5.2",
    "torch==2.13.0",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "piper-tts==1.7.0",
]

[project.optional-dependencies]
pqc = [
    "liboqs-python",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]
lint = [
    "pylint>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E4", "E7", "E9", "F"]
lint.exclude = [
    "external/**",
    "**/.venv/**",
    "**/node_modules/**",
]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
exclude = "^(bridge/|core/|external/|python3_bridge\\.py$|scripts/|sovereign-bridge/|sovereign_core/|sovereignty_ai/|media_generator_service\\.py$|video_llava\\.py$)"
