```yaml
version: "3.9"

x-healthcheck: &default-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:health"]
  interval: 30s
  timeout: 10s
  retries: 3

x-restart: &default-restart
  restart: unless-stopped

services:
  python-backend:
    build: ./python-backend
    container_name: python-backend
    ports:
      - "9897:9897"
    environment:
      - FRONTEND_HOST=koder-frontend
      - FRONTEND_PORT=9898
      - CRYPTOKEYPATH=/secrets/crypto_key
    volumes:
      - ./secrets:/secrets
    healthcheck: *default-healthcheck
    <<: *default-restart
    networks:
      - localnet

  koder-frontend:
    build: ./koder-frontend
    container_name: koder-frontend
    ports:
      - "9898:9898"
    depends_on:
      - python-backend
    environment:
      - INTERNALBACKENDHOST=python-backend
      - INTERNALBACKENDPORT=9897
    healthcheck: *default-healthcheck
    <<: *default-restart
    networks:
      - localnet

  node-external-backend:
    build: ./node-backend
    container_name: node-external-backend
    ports:
      - "9899:9899"
    depends_on:
      - koder-frontend
    environment:
      - FRONTENDBRIDGEHOST=koder-frontend
      - FRONTENDBRIDGEPORT=9898
    healthcheck: *default-healthcheck
    <<: *default-restart
    networks:
      - localnet

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    <<: *default-restart
    networks:
      - localnet

  vlm-service-1:
    build: ./vlm-service-1
    container_name: vlm-service-1
    environment:
      - MODEL_PATH=/models/vlm1
      - FRONTEND_HOST=koder-frontend
      - FRONTEND_PORT=9898
    volumes:
      - ./models/vlm1:/models/vlm1
    healthcheck: *default-healthcheck
    <<: *default-restart
    networks:
      - localnet

  vlm-service-2:
    build: ./vlm-service-2
    container_name: vlm-service-2
    environment:
      - MODEL_PATH=/models/vlm2
      - FRONTEND_HOST=koder-frontend
      - FRONTEND_PORT=9898
    volumes:
      - ./models/vlm2:/models/vlm2
    healthcheck: *default-healthcheck
    <<: *default-restart
    networks:
      - localnet

  sovereign-tls-proxy:
    image: nginx:alpine
    container_name: sovereign-tls-proxy
    depends_on:
      - python-backend
      - koder-frontend
    ports:
      - "443:443"
    volumes:
      - ./pki/certs:/etc/ssl/private:ro
      - ./pki/nginx/conf.d:/etc/nginx/conf.d:ro
    environment:
      - PKI_MODE=ghost
      - CIPHERSUITE=TLSAES256GCM_SHA384
      - CURVES=X25519:Ed25519
      - CERT_TYPE=X.509
      - KEY_ENCRYPTION=AES-256
      - ENCLAVE_MODE=enabled
      - AUTOCERTGEN=ED25519
    command: ["/bin/sh", "-c", "sovereign-ts-proxy --cli --pki-mode $PKI_MODE"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    <<: *default-restart
    networks:
      - localnet

  pki-fastapi:
    build: ./pki-fastapi
    container_name: pki-fastapi
    ports:
      - "8443:8443"
    environment:
      - PKI_MODE=ghost
      - SECURE_ENCLAVE=true
      - CERTGENALGO=ED25519
    healthcheck: *default-healthcheck
    <<: *default-restart
    networks:
      - localnet

networks:
  localnet:
    driver: bridge

volumes:
  redis-data:

profiles:
  dev:
    services:
      - python-backend
      - koder-frontend
      - node-external-backend
      - redis
      - vlm-service-1
      - vlm-service-2

  prod:
    services:
      - python-backend
      - koder-frontend
      - node-external-backend
      - redis
      - vlm-service-1
      - vlm-service-2
      - sovereign-tls-proxy
      - pki-fastapi
```
