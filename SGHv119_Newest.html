<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'">
<title>SUPERGROK 4.2 — Enterprise</title>
<script>
(function(){
  try {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(reg){ reg.unregister(); });
      var cfg = window.__SG_CONFIG__ || {};
      if (cfg.serviceWorkerPath) {
        navigator.serviceWorker.register(cfg.serviceWorkerPath).catch(function(err){
          console.warn('[SG_SW] register failed', err);
        });
      }
    }).catch(function(err){
      console.warn('[SG_SW] setup failed', err);
    });
  } catch (err) {
    console.warn('[SG_SW] unexpected error', err);
  }
})();
</script>
<style>
:root{--bg:#03060f;--bg2:#0c1a30;--bg3:#152440;--wire:#1a2e50;--t0:#eaf0ff;--t2:#6a88ae;--acid:#00ffc8;--bad:#ff3d6e;--ok:#00ffc8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--r:12px}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--t0);font-family:var(--body)}
.screen{display:none;min-height:100%;padding:24px;align-items:center;justify-content:center}.screen.active{display:flex}
.card{width:min(520px,100%);background:var(--bg2);border:1px solid var(--wire);border-radius:var(--r);padding:20px}
h1{margin:0 0 8px}p{margin:0 0 12px;color:var(--t2)}
.btn{border:1px solid var(--wire);background:var(--bg3);color:var(--t0);padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--acid);color:#001e18;border-color:transparent;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}
#roleList button{width:100%;text-align:left}
#presencePill{position:fixed;top:10px;right:10px;display:flex;gap:4px;background:var(--bg2);border:1px solid var(--wire);padding:4px;border-radius:999px}
#presencePill button{font:600 11px var(--mono);border:0;background:transparent;color:var(--t2);padding:6px 10px;border-radius:999px;cursor:pointer}
#presencePill .active{background:var(--acid);color:#001e18}
body.offline-mode{filter:saturate(.7) brightness(.8)}
body.ghost-mode{filter:grayscale(1) contrast(.9)}
body.stealth-mode{filter:hue-rotate(40deg)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0b1220;border:1px solid var(--wire);padding:10px 14px;border-radius:8px;font:12px var(--mono);display:none;z-index:9999}
#toast.ok{border-color:var(--ok);color:var(--ok)}#toast.err{border-color:var(--bad);color:var(--bad)}
pre{white-space:pre-wrap;background:#08101d;border:1px solid var(--wire);padding:10px;border-radius:8px;font:11px var(--mono);max-height:240px;overflow:auto}
</style>
<script>
(function(){
  var defaults = {
    oauthEndpoint: 'https://auth.yourdomain.com/oauth/token',
    oauthAuthorizeEndpoint: 'https://auth.yourdomain.com/oauth/authorize',
    oauthClientId: 'sovereignty-studio',
    oauthRedirectUri: window.location.origin + window.location.pathname,
    oauthScope: 'openid profile',
    apiBase: window.location.origin,
    certPath: '/etc/ssl/certs/fullchain.pem',
    dkimSelector: 'mail',
    domain: window.location.hostname || 'localhost',
    dkimKeyPath: '/etc/dkim/private.key',
    aRecord: '',
    aaaaRecord: '',
    mxRecord: '',
    spfTxt: '',
    cnameRecord: ''
  };
  var meta = document.querySelector('meta[name="sg-config"]');
  var metaConfig = {};
  if (meta && meta.content) {
    try { metaConfig = JSON.parse(meta.content); } catch (err) { console.warn('[SG_CONFIG] Invalid meta JSON', err); }
  }
  var config = Object.assign({}, defaults, window.__SG_CONFIG__ || {}, metaConfig);
  window.SG_CONFIG = config;
  try {
    var apiOrigin = new URL(config.apiBase, window.location.origin).origin;
    var cspMeta = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
    if (cspMeta) {
      cspMeta.setAttribute('content', "default-src 'self' data: blob:; connect-src 'self' " + apiOrigin + "; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'");
    }
  } catch (err) {
    console.warn('[SG_CONFIG] Unable to set dynamic CSP connect-src', err);
  }
})();
</script>
<script>
(function(){
  var enc = new TextEncoder();
  function b64url(bytes){
    var bin = '';
    bytes.forEach(function(b){ bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function randomBytes(len){ var out = new Uint8Array(len); crypto.getRandomValues(out); return out; }
  function cryptoRandFloat(){ var buf = new Uint32Array(1); crypto.getRandomValues(buf); return buf[0] / 4294967296; }
  function cryptoRandHex(bytes){ return Array.from(randomBytes(bytes)).map(function(n){ return n.toString(16).padStart(2,'0'); }).join(''); }
  async function sha256Bytes(value){ return new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(value))); }
  async function hmacSha256Base64(keyValue, payload){
    var key = await crypto.subtle.importKey('raw', enc.encode(keyValue), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    var sig = await crypto.subtle.sign('HMAC', key, enc.encode(payload));
    return b64url(new Uint8Array(sig));
  }
  window._SG_CRYPTO_ENGINE = 'native-webcrypto';
  window.SG_CRYPTO = { b64url: b64url, randomBytes: randomBytes, cryptoRandFloat: cryptoRandFloat, cryptoRandHex: cryptoRandHex, sha256Bytes: sha256Bytes, hmacSha256Base64: hmacSha256Base64 };
})();
</script>
<script>
(function(){
  var tokenState = { accessToken: null, expiresAt: 0 };
  var VERIFIER_KEY = 'sg_pkce_verifier';
  var STATE_KEY = 'sg_pkce_state';
  function parseAuthCode(){ return new URLSearchParams(window.location.search).get('code'); }
  function parseState(){ return new URLSearchParams(window.location.search).get('state'); }
  function clearAuthQuery(){
    var url = new URL(window.location.href);
    url.searchParams.delete('code');
    url.searchParams.delete('state');
    history.replaceState({}, '', url.pathname + url.search + url.hash);
  }
  async function createCodeVerifier(){
    var charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    var random = SG_CRYPTO.randomBytes(64);
    var out = '';
    for (var i=0;i<random.length;i++) out += charset[random[i] % charset.length];
    return out.slice(0, 96);
  }
  async function createCodeChallenge(verifier){
    return SG_CRYPTO.b64url(await SG_CRYPTO.sha256Bytes(verifier));
  }
  async function exchangeCode(code, verifier){
    var cfg = window.SG_CONFIG;
    var body = new URLSearchParams({
      grant_type: 'authorization_code',
      code: code,
      client_id: cfg.oauthClientId,
      redirect_uri: cfg.oauthRedirectUri,
      code_verifier: verifier
    });
    var resp = await fetch(cfg.oauthEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    });
    if (!resp.ok) throw new Error('Token exchange failed: ' + resp.status);
    var data = await resp.json();
    if (!data.access_token) throw new Error('Missing access token from OAuth endpoint');
    tokenState.accessToken = data.access_token;
    tokenState.expiresAt = Date.now() + (Math.max(30, Number(data.expires_in || 3600)) * 1000);
    return tokenState.accessToken;
  }
  async function login(options){
    var cfg = window.SG_CONFIG;
    options = options || {};
    var code = options.code || parseAuthCode();
    if (code) {
      var expectedState = sessionStorage.getItem(STATE_KEY);
      var gotState = options.state || parseState();
      if (expectedState && gotState && expectedState !== gotState) throw new Error('OAuth state mismatch');
      var verifier = sessionStorage.getItem(VERIFIER_KEY);
      if (!verifier) throw new Error('Missing PKCE verifier');
      var token = await exchangeCode(code, verifier);
      sessionStorage.removeItem(VERIFIER_KEY);
      sessionStorage.removeItem(STATE_KEY);
      clearAuthQuery();
      return token;
    }
    var verifierNew = await createCodeVerifier();
    var challenge = await createCodeChallenge(verifierNew);
    var state = SG_CRYPTO.cryptoRandHex(16);
    sessionStorage.setItem(VERIFIER_KEY, verifierNew);
    sessionStorage.setItem(STATE_KEY, state);
    var authUrl = new URL(cfg.oauthAuthorizeEndpoint);
    authUrl.searchParams.set('response_type', 'code');
    authUrl.searchParams.set('client_id', cfg.oauthClientId);
    authUrl.searchParams.set('redirect_uri', cfg.oauthRedirectUri);
    authUrl.searchParams.set('scope', cfg.oauthScope || 'openid profile');
    authUrl.searchParams.set('state', state);
    authUrl.searchParams.set('code_challenge', challenge);
    authUrl.searchParams.set('code_challenge_method', 'S256');
    window.location.assign(authUrl.toString());
    return null;
  }
  function logout(){ tokenState.accessToken = null; tokenState.expiresAt = 0; sessionStorage.removeItem(VERIFIER_KEY); sessionStorage.removeItem(STATE_KEY); }
  function getToken(){ return tokenState.expiresAt > Date.now() ? tokenState.accessToken : null; }
  function isAuthed(){ return !!getToken(); }
  window.SG_AUTH = { login: login, logout: logout, getToken: getToken, isAuthed: isAuthed };
})();
</script>
<script>
(function(){
  var cfg = window.SG_CONFIG;
  var required = ['certPath','dkimSelector','domain','dkimKeyPath','aRecord','aaaaRecord','mxRecord','spfTxt','cnameRecord','apiBase','oauthEndpoint'];
  var missing = required.filter(function(k){ return !cfg[k]; });
  window.SG_PKI_CONFIG = {
    ca: cfg.ca || 'DigiCert',
    tls: cfg.tls || 'TLS 1.3',
    cert: cfg.certPath,
    dkim: { selector: cfg.dkimSelector, domain: cfg.domain, keyPath: cfg.dkimKeyPath },
    dnssec: cfg.dnssec !== false,
    records: { A: cfg.aRecord, AAAA: cfg.aaaaRecord, MX: cfg.mxRecord, TXT: cfg.spfTxt, CNAME: cfg.cnameRecord }
  };
  console.group('[SG_PKI_CONFIG] Startup checklist');
  required.forEach(function(k){ console.log((cfg[k] ? '✅' : '❌') + ' ' + k + ':', cfg[k] || '(missing)'); });
  console.log('CA:', window.SG_PKI_CONFIG.ca, '| TLS:', window.SG_PKI_CONFIG.tls, '| DNSSEC:', window.SG_PKI_CONFIG.dnssec);
  if (missing.length) console.warn('[SG_PKI_CONFIG] Missing SG_CONFIG keys:', missing.join(', '));
  console.groupEnd();
})();
</script>
<script>
(function(){
  function sleep(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }
  async function request(endpoint, opts){
    opts = opts || {};
    var cfg = window.SG_CONFIG;
    var baseUrl = new URL(cfg.apiBase, window.location.origin);
    var target = new URL(endpoint, baseUrl);
    if (target.origin !== baseUrl.origin) throw new Error('Endpoint must remain within SG_CONFIG.apiBase origin');
    var token = window.SG_AUTH.getToken();
    if (!token) throw new Error('Not authenticated');
    var method = (opts.method || 'GET').toUpperCase();
    var body = opts.body;
    var bodyText = typeof body === 'string' ? body : (body ? JSON.stringify(body) : '');
    var bodyHash = SG_CRYPTO.b64url(await SG_CRYPTO.sha256Bytes(bodyText));
    var timestamp = new Date().toISOString();
    var signaturePayload = [method, target.pathname + target.search, timestamp, bodyHash].join('\n');
    var signature = await SG_CRYPTO.hmacSha256Base64(token, signaturePayload);
    var headers = Object.assign({}, opts.headers || {}, {
      'Authorization': 'Bearer ' + token,
      'X-SG-Timestamp': timestamp,
      'X-SG-Signature': signature
    });
    if (bodyText && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    var maxAttempts = 3;
    var delay = 250;
    for (var attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        var resp = await fetch(target.toString(), { method: method, headers: headers, body: bodyText || undefined, signal: opts.signal });
        if (resp.ok) return resp;
        if (resp.status < 500 || attempt === maxAttempts) throw new Error('Request failed: ' + resp.status);
      } catch (err) {
        if (attempt === maxAttempts) throw err;
      }
      await sleep(delay);
      delay *= 2;
    }
    throw new Error('Request failed after retries');
  }
  window.SG_API = { request: request };
})();
</script>
<script>
(function(){
  var baseError = console.error.bind(console);
  var baseWarn = console.warn.bind(console);
  var trap = {
    entries: [],
    push: function(level, message, context){
      this.entries.push({ ts: new Date().toISOString(), level: level, message: String(message || ''), context: context || null });
      if (this.entries.length > 250) this.entries.shift();
      if (window.showToast) window.showToast(level.toUpperCase() + ': ' + message, level === 'error' ? 'err' : 'ok');
    }
  };
  window.SG_ERROR_TRAP = trap;
  console.error = function(){ trap.push('error', Array.from(arguments).join(' ')); return baseError.apply(console, arguments); };
  console.warn = function(){ trap.push('warn', Array.from(arguments).join(' ')); return baseWarn.apply(console, arguments); };
  window.onerror = function(message, source, lineno, colno, error){
    trap.push('error', message, { source: source, line: lineno, col: colno, stack: error && error.stack ? error.stack : null });
    return false;
  };
  window.addEventListener('unhandledrejection', function(event){
    var reason = event && event.reason ? (event.reason.stack || event.reason.message || String(event.reason)) : 'Unknown rejection';
    trap.push('error', reason);
  });
})();
</script>

<body>
<div id="presencePill">
  <button data-mode="online" class="active">ONLINE</button>
  <button data-mode="stealth">STEALTH</button>
  <button data-mode="ghost">GHOST</button>
  <button data-mode="offline">OFFLINE</button>
</div>

<section id="bootScreen" class="screen active">
  <div class="card">
    <h1>Booting Sovereignty AI Studio</h1>
    <p>Preparing secure local stack...</p>
    <pre id="bootLog">Initializing...</pre>
  </div>
</section>

<section id="roleScreen" class="screen">
  <div class="card">
    <h1>Role Select</h1>
    <p>Choose your operating role.</p>
    <div id="roleList" class="row"></div>
  </div>
</section>

<section id="authScreen" class="screen">
  <div class="card">
    <h1>OAuth Authentication</h1>
    <p>Authenticate through your configured OAuth pipeline.</p>
    <div class="row">
      <button id="authLoginBtn" class="btn primary">Login via OAuth PKCE</button>
      <button id="authBackBtn" class="btn">Back</button>
    </div>
    <pre id="authStatus"></pre>
  </div>
</section>

<section id="dashScreen" class="screen">
  <div class="card">
    <h1>Dashboard</h1>
    <p id="dashMeta"></p>
    <div class="row">
      <button id="whoamiBtn" class="btn">API Probe</button>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
    <pre id="dashOutput">Ready.</pre>
  </div>
</section>

<div id="toast"></div>

<script>
(function(){
  var screens = {
    boot: document.getElementById('bootScreen'),
    role: document.getElementById('roleScreen'),
    auth: document.getElementById('authScreen'),
    dash: document.getElementById('dashScreen')
  };
  var bootLog = document.getElementById('bootLog');
  var authStatus = document.getElementById('authStatus');
  var dashMeta = document.getElementById('dashMeta');
  var dashOutput = document.getElementById('dashOutput');
  var selectedRole = null;

  function setScreen(name){ Object.keys(screens).forEach(function(k){ screens[k].classList.toggle('active', k === name); }); }
  window.showToast = function(text, cls){
    var el = document.getElementById('toast');
    el.className = cls ? cls : '';
    el.textContent = text;
    el.style.display = 'block';
    setTimeout(function(){ el.style.display = 'none'; }, 2600);
  };

  function setPresence(mode){
    document.body.classList.remove('offline-mode','ghost-mode','stealth-mode');
    if (mode !== 'online') document.body.classList.add(mode + '-mode');
    document.querySelectorAll('#presencePill button').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.mode === mode); });
  }
  document.querySelectorAll('#presencePill button').forEach(function(btn){
    btn.addEventListener('click', function(){ setPresence(btn.dataset.mode); });
  });

  var roles = [
    { id: 'owner', label: 'Owner / Root Operator' },
    { id: 'security', label: 'Security Engineer' },
    { id: 'ops', label: 'Operations Engineer' },
    { id: 'analyst', label: 'Threat Analyst' }
  ];
  var roleList = document.getElementById('roleList');
  roles.forEach(function(role){
    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = role.label;
    btn.addEventListener('click', function(){ selectedRole = role; setScreen('auth'); authStatus.textContent = 'Role selected: ' + role.label; });
    roleList.appendChild(btn);
  });

  document.getElementById('authBackBtn').addEventListener('click', function(){ setScreen('role'); });
  document.getElementById('authLoginBtn').addEventListener('click', async function(){
    try {
      authStatus.textContent = 'Starting OAuth PKCE redirect...';
      await window.SG_AUTH.login();
    } catch (err) {
      authStatus.textContent = 'Login error: ' + (err && err.message ? err.message : String(err));
      showToast('OAuth login failed', 'err');
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    window.SG_AUTH.logout();
    dashOutput.textContent = 'Session cleared.';
    setScreen('auth');
  });

  document.getElementById('whoamiBtn').addEventListener('click', async function(){
    try {
      var response = await window.SG_API.request('/whoami', { method: 'GET' });
      var text = await response.text();
      dashOutput.textContent = text;
    } catch (err) {
      dashOutput.textContent = 'API error: ' + (err && err.message ? err.message : String(err));
      showToast('API request failed', 'err');
    }
  });

  async function init(){
    bootLog.textContent = [
      'Crypto engine: ' + window._SG_CRYPTO_ENGINE,
      'OAuth endpoint: ' + window.SG_CONFIG.oauthEndpoint,
      'API base: ' + window.SG_CONFIG.apiBase,
      'PKI CA/TLS: ' + window.SG_PKI_CONFIG.ca + ' / ' + window.SG_PKI_CONFIG.tls,
      'Ready'
    ].join('\n');
    try {
      if (new URLSearchParams(window.location.search).get('code')) {
        authStatus.textContent = 'Completing OAuth callback...';
        await window.SG_AUTH.login();
      }
    } catch (err) {
      authStatus.textContent = 'OAuth callback failed: ' + (err && err.message ? err.message : String(err));
    }

    if (window.SG_AUTH.isAuthed()) {
      dashMeta.textContent = 'Authenticated · Role: ' + (selectedRole ? selectedRole.label : 'N/A');
      setScreen('dash');
    } else {
      setScreen('role');
    }
  }

  setTimeout(init, 500);
})();
</script>
</body>
